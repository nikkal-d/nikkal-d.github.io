<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <title>Photobook Editor</title>

  <link rel="stylesheet" href="./css/photobook.css" />
  <link rel="stylesheet" href="css/app.css">


  <!-- FABRIC -->
<script src="https://unpkg.com/fabric@5.3.0/dist/fabric.min.js"></script>


</head>
<body>

 <body>
<div id="app">

 
  <!-- LEFT BAR -->
  <div id="leftBar">
    <button id="btnText">T</button>
    <button id="btnImage">🖼</button>
    <button id="btnShapes">⬛</button>
  </div>

  <!-- CANVAS AREA -->
  <div id="canvasArea">
    <div id="canvasHost">
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <!-- RIGHT BAR -->
  <div id="rightBar">
    <h3>Pages / Export</h3>
  </div>

</div>

<!-- LEFT PANELS -->
<div id="panel-text" class="panel">
  <h3>Text</h3>
  <button id="addTextBtn" class="btn">Add Text</button>
</div>

<div id="panel-image" class="panel">
  <h3>Images</h3>
  <input type="file" id="imageInput" accept="image/*">
</div>

  <!-- WORKSPACE -->
  <main id="workspace">
    <div id="canvasHost">
      <canvas id="canvas"></canvas>
    </div>
  </main>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<script type="module" src="./js/core.js"></script>
<script type="module" src="./js/ui.js"></script>
</body>

</body>
</html>
