<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Find My Duplicates · Nikkal Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root{
      --bg:#020617;
      --bg-soft:#0f172a;
      --border:#1f2937;
      --accent:#38bdf8;
      --accent-soft:rgba(56,189,248,0.4);
      --text:#e5e7eb;
      --muted:#9ca3af;
      --radius:14px;
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    /* HEADER */
    .main-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0.7rem 1.2rem;
      background:var(--bg-soft);
      border-bottom:1px solid var(--border);
      position:sticky;
      top:0;
      z-index:10;
    }
    .header-left{display:flex;align-items:center;gap:0.5rem;}
    .logo{font-size:1.4rem;}
    .site-title{
      font-size:1rem;
      text-transform:uppercase;
      letter-spacing:0.14em;
      color:var(--muted);
    }

    .main-menu{
      display:flex;
      gap:0.6rem;
      flex-wrap:wrap;
    }
    .main-menu a{
      text-decoration:none;
      color:var(--muted);
      padding:0.35rem 0.75rem;
      border-radius:999px;
      font-size:0.82rem;
      border:1px solid transparent;
    }
    .main-menu a:hover{
      background:#1e293b;
      border-color:var(--accent-soft);
      color:var(--text);
    }
    .main-menu a.active{
      color:var(--accent);
      border-color:var(--accent-soft);
      background:#1e293b;
    }

    main{
      flex:1;
      display:flex;
      flex-direction:column;
      padding:1rem;
      max-width:900px;
      margin:auto;
      width:100%;
      gap:1.2rem;
    }

    .box{
      background:var(--bg-soft);
      padding:1rem;
      border-radius:var(--radius);
      border:1px solid var(--border);
    }

    h2{margin-top:0;color:var(--accent);}

    input[type="file"]{display:none;}
    .file-label{
      border:1px dashed var(--border);
      padding:0.6rem 1rem;
      display:inline-flex;
      align-items:center;
      gap:0.4rem;
      cursor:pointer;
      border-radius:999px;
      color:var(--muted);
      background:#020617;
      font-size:0.9rem;
    }
    .file-label:hover{
      border-color:var(--accent);
      color:var(--text);
    }

    #results{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
      gap:0.8rem;
      margin-top:1rem;
    }

    .img-wrap{
      background:#020617;
      border:1px solid var(--border);
      border-radius:10px;
      overflow:hidden;
      padding:0.4rem;
      text-align:center;
      font-size:0.8rem;
    }

    .img-wrap img{
      width:100%;
      height:120px;
      object-fit:cover;
      border-radius:8px;
      margin-bottom:0.4rem;
    }

    footer{
      border-top:1px solid var(--border);
      padding:0.8rem;
      text-align:center;
      font-size:0.75rem;
      color:var(--muted);
      background:#020617;
    }
  </style>
</head>
<body>

<header class="main-header">
  <div class="header-left">
    <span class="logo">🔍</span>
    <span class="site-title">Nikkal Studio</span>
  </div>

  <nav class="main-menu">
    <a href="index.html" class="active">Find My Duplicates</a>
    <a href="photobook.html">Photobook Editor</a>
    <a href="projects.html">Projects</a>
    <a href="templates.html">Templates</a>
    <a href="stickers.html">Stickers</a>
    <a href="viewer.html">Viewer</a>
  </nav>
</header>

<main>
  <div class="box">
    <h2>🔎 Βρες διπλές εικόνες</h2>
    <p>Ανέβασε φωτογραφίες και το σύστημα θα εντοπίσει ποιες είναι ίδιες.</p>

    <label for="fileInput" class="file-label">🖼️ Επιλογή εικόνων</label>
    <input type="file" id="fileInput" accept="image/*" multiple>
  </div>

  <div class="box">
    <h2>📌 Αποτελέσματα</h2>
    <div id="results"></div>
  </div>
</main>

<footer>© 2025 Nikkal Studio · Find My Duplicates</footer>

<script>
  const fileInput = document.getElementById('fileInput');
  const results = document.getElementById('results');

  fileInput.addEventListener('change', async (e)=>{
    const files = [...e.target.files];
    if(!files.length) return;

    const hashes = new Map();
    results.innerHTML = "";

    for(const file of files){
      const dataUrl = await fileToDataURL(file);
      const hash = await hashImage(dataUrl);

      if(!hashes.has(hash)){
        hashes.set(hash, []);
      }
      hashes.get(hash).push(dataUrl);
    }

    renderDuplicates(hashes);
  });

  function renderDuplicates(map){
    results.innerHTML = "";

    for(const [hash, arr] of map.entries()){
      if(arr.length < 2) continue;

      arr.forEach(src=>{
        const wrap = document.createElement('div');
        wrap.className = "img-wrap";

        wrap.innerHTML = `
          <img src="${src}" alt="">
          <div>Duplicate</div>
        `;

        results.appendChild(wrap);
      });
    }

    if(results.innerHTML === ""){
      results.innerHTML = "<p>Δεν βρέθηκαν διπλές εικόνες.</p>";
    }
  }

  function fileToDataURL(file){
    return new Promise(res=>{
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.readAsDataURL(file);
    });
  }

  async function hashImage(dataUrl){
    const img = await loadImage(dataUrl);
    const c = document.createElement("canvas");
    const ctx = c.getContext("2d");

    c.width = 16;
    c.height = 16;

    ctx.drawImage(img,0,0,16,16);

    const pixels = ctx.getImageData(0,0,16,16).data;
    let sum = 0;
    for(let i=0;i<pixels.length;i+=4){
      sum += pixels[i] + pixels[i+1] + pixels[i+2];
    }
    return sum.toString();
  }

  function loadImage(src){
    return new Promise(res=>{
      const img = new Image();
      img.onload = ()=>res(img);
      img.src = src;
    });
  }
</script>

</body>
</html>
