<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Photobook Editor</title>

  <link rel="stylesheet" href="./css/app.css" />
  <link rel="stylesheet" href="./css/photobook.css" />

  <!-- Fabric (global) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
</head>

<body class="theme-light">
  <header class="topbar">
    <div class="topbar-left">
      <a class="brand" href="./index.html">Photobook</a>

      <nav class="topnav" aria-label="Site navigation">
        <a href="./index.html" data-i18n="nav_home">Home</a>
        <a href="./templates.html" data-i18n="nav_templates">Templates</a>
        <a href="./projects.html" data-i18n="nav_projects">Projects</a>
        <a href="./viewer.html" data-i18n="nav_viewer">Viewer</a>
        <a href="./stickers.html" data-i18n="nav_stickers">Stickers</a>
      </nav>
    </div>

    <div class="topbar-right">
      <button class="iconbtn" id="themeToggleBtn" title="Dark / Light">🌙</button>
      <button class="iconbtn" id="langToggleBtn" title="EL / EN">EL</button>

      <div class="authbox">
        <span id="userInfo" class="userInfo"></span>
        <button class="btn" id="loginBtn">Σύνδεση</button>
        <button class="btn ghost" id="logoutBtn" style="display:none;">Logout</button>
      </div>
    </div>
  </header>

  <div class="appShell">
    <aside class="leftRail" aria-label="Tools">
      <button class="railbtn active" data-panel="pages" title="Pages">📄</button>
      <button class="railbtn" data-panel="text" title="Text">🅰</button>
      <button class="railbtn" data-panel="images" title="Images">🖼</button>
      <button class="railbtn" data-panel="colors" title="Colors">🎨</button>
      <button class="railbtn" data-panel="shapes" title="Shapes">⬛</button>
      <button class="railbtn" data-panel="layers" title="Layers">📚</button>
    </aside>

    <section class="leftPanel" id="leftPanel">
      <div class="panelHeader">
        <h3 id="panelTitle">Pages</h3>
        <button class="iconbtn" id="closeLeftPanelBtn" title="Close">✕</button>
      </div>

      <div class="panelBody panelView" data-view="pages">
        <div class="row gap">
          <button class="btn" id="addPageBtn">+ Page</button>
          <button class="btn ghost" id="dupPageBtn">Duplicate</button>
          <button class="btn danger" id="delPageBtn">Delete</button>
        </div>

        <div class="row gap" style="margin-top:10px;">
          <button class="btn ghost" id="prevPageBtn">←</button>
          <div class="pill" id="pageInfo">1 / 1</div>
          <button class="btn ghost" id="nextPageBtn">→</button>
        </div>

        <div class="thumbStrip" id="thumbStrip"></div>
      </div>

      <div class="panelBody panelView" data-view="text" hidden>
        <button class="btn" id="addTextBtn">➕ Add Text</button>

        <div class="field">
          <label>Font</label>
          <select class="select" id="fontSelect">
            <option value="Arial" selected>Arial</option>
            <option value="Georgia">Georgia</option>
            <option value="Times New Roman">Times</option>
            <option value="Verdana">Verdana</option>
          </select>
        </div>

        <div class="field">
          <label>Size</label>
          <input class="input" id="fontSizeInput" type="number" min="8" max="180" value="48" />
        </div>

        <div class="row gap">
          <button class="btn ghost" id="boldBtn">B</button>
          <button class="btn ghost" id="italicBtn">I</button>
          <button class="btn ghost" id="underlineBtn">U</button>
        </div>

        <div class="field">
          <label>Fill</label>
          <input class="input" id="textFillInput" type="color" value="#111111"/>
        </div>

        <div class="field">
          <label>Stroke</label>
          <input class="input" id="textStrokeInput" type="color" value="#000000"/>
        </div>

        <div class="field">
          <label>Stroke width</label>
          <input class="input" id="textStrokeWidthInput" type="number" min="0" max="20" value="0"/>
        </div>

        <div class="field">
          <label>Opacity</label>
          <input class="input" id="textOpacityInput" type="range" min="0" max="1" step="0.05" value="1"/>
        </div>

        <div class="row gap">
          <button class="btn ghost" id="alignLeftBtn">Left</button>
          <button class="btn ghost" id="alignCenterBtn">Center</button>
          <button class="btn ghost" id="alignRightBtn">Right</button>
        </div>
      </div>

      <div class="panelBody panelView" data-view="images" hidden>
        <label class="btn">
          Upload Image
          <input type="file" id="imageInput" accept="image/*" hidden />
        </label>

        <div class="row gap" style="margin-top:10px;">
          <button class="btn ghost" id="removeBgBtn">Remove BG</button>
          <button class="btn ghost" id="cropBtn">Crop</button>
        </div>

        <p class="hint">Remove BG / Crop: placeholder UI (θα δέσει μετά).</p>
      </div>

      <div class="panelBody panelView" data-view="colors" hidden>
        <div class="field">
          <label>Canvas Background</label>
          <input class="input" id="canvasBgColor" type="color" value="#ffffff" />
        </div>

        <div class="field">
          <label>Selected Fill</label>
          <input class="input" id="objFillColor" type="color" value="#ff0000" />
        </div>

        <div class="row gap">
          <button class="btn ghost" data-bg="#ffffff">White</button>
          <button class="btn ghost" data-bg="#f3f4f6">Gray</button>
          <button class="btn ghost" data-bg="#111827">Dark</button>
        </div>
      </div>

      <div class="panelBody panelView" data-view="shapes" hidden>
        <div class="row gap">
          <button class="btn" id="addRectBtn">Rectangle</button>
          <button class="btn" id="addCircleBtn">Circle</button>
        </div>
        <div class="row gap" style="margin-top:10px;">
          <button class="btn ghost" id="addLineBtn">Line</button>
        </div>
      </div>

      <div class="panelBody panelView" data-view="layers" hidden>
        <div class="row gap">
          <button class="btn ghost" id="bringFwdBtn">Bring +</button>
          <button class="btn ghost" id="sendBackBtn">Send -</button>
          <button class="btn danger" id="deleteObjBtn">Delete</button>
        </div>

        <div class="layersList" id="layersList"></div>
      </div>
    </section>

    <main class="stage">
      <div class="stageBar">
        <div class="stageBar-left">
          <button class="btn ghost" id="fitBtn" title="Fit to screen">Fit</button>

          <div class="zoomBox">
            <button class="iconbtn" id="zoomOutBtn" title="Zoom out">−</button>
            <div class="pill" id="zoomValue">100%</div>
            <button class="iconbtn" id="zoomInBtn" title="Zoom in">+</button>
            <button class="btn ghost" id="zoomResetBtn" title="Reset zoom">Reset</button>
            <button class="btn" id="zoomFitBtn" title="Fit">⤢</button>
          </div>
        </div>

        <div class="stageBar-right">
          <select class="select" id="pageSizeSelect" title="Page size">
            <option value="A4P" selected>A4 Portrait</option>
            <option value="A4L">A4 Landscape</option>
            <option value="SQUARE">Square</option>
            <option value="STORY">Story</option>
            <option value="HD">HD</option>
            <option value="CUSTOM">Custom…</option>
          </select>

          <button class="btn" id="toggleExportBtn">Export</button>
        </div>
      </div>

      <div class="canvasHost" id="canvasHost">
        <div class="canvasFrame" id="canvasFrame">
          <canvas id="canvas"></canvas>
        </div>

        <div class="floatToolbar" id="floatToolbar" hidden>
          <button class="btn ghost" id="fltOpacityBtn">Opacity</button>
          <button class="btn ghost" id="fltCropBtn">Crop</button>
          <button class="btn danger" id="fltDeleteBtn">Delete</button>
        </div>
      </div>
    </main>

    <aside class="rightRail" aria-label="Export">
      <button class="railbtn" id="openExportBtn" title="Export">⬆️</button>
    </aside>

    <section class="rightPanel" id="rightPanel" aria-label="Export panel">
      <div class="panelHeader">
        <h3>Export</h3>
        <button class="iconbtn" id="closeRightPanelBtn" title="Close">✕</button>
      </div>

      <div class="panelBody">
        <div class="field">
          <label>Flip animation</label>
          <select class="select" id="flipDirSelect">
            <option value="horizontal" selected>Book (horizontal)</option>
            <option value="vertical">Vertical flip</option>
          </select>
        </div>

        <div class="grid2">
          <button class="btn" id="exportFlipBtn">Export Flipbook</button>
          <button class="btn ghost" id="previewFlipBtn">Preview</button>
          <button class="btn" id="exportLinkBtn">Copy Link</button>
          <button class="btn" id="exportPdfBtn">PDF (βασικό)</button>
        </div>

        <div class="divider"></div>

        <p class="hint" id="exportHint">
          Το Flipbook export γίνεται σε shareable link (data URL) + Preview modal.
          Για πραγματικό hosted link θέλει Cloud backend (μετά).
        </p>
      </div>
    </section>
  </div>

  <!-- Flipbook preview modal -->
  <div class="modal" id="flipPreviewModal" aria-hidden="true">
    <div class="modal-inner">
      <div class="modal-head">
        <div class="modal-title">Flipbook Preview</div>
        <div class="row gap">
          <button class="btn ghost" id="flipPrevBtn">← Prev</button>
          <div class="pill" id="flipPageLbl">1 / 1</div>
          <button class="btn ghost" id="flipNextBtn">Next →</button>
          <button class="btn" id="closeFlipPreview">✕</button>
        </div>
      </div>
      <iframe id="flipPreviewFrame" title="Flipbook preview"></iframe>
    </div>
  </div>

  <script type="module" src="./js/core.js"></script>
  <script type="module" src="./js/ui.js"></script>
  <script src="./js/sidebar.js"></script>
</body>
</html>
