<!DOCTYPE html>

</head>
<body>

  <!-- MAIN WRAPPER -->

<!-- ======= PHOTBOOK TOOLBAR ======= -->
<div id="editorToolbar" class="toolbar">

</div>
<!-- ======= END TOOLBAR ======= -->

   
        </div>

        <!-- FILTERS -->

          <label>Αντίθεση</label>
          <input type="range" id="imgContrast" min="-1" max="1" step="0.01" value="0">

          <label>Κορεσμός</label>
          <input type="range" id="imgSaturation" min="-1" max="1" step="0.01" value="0">

          <label>Blur</label>
          <input type="range" id="imgBlur" min="0" max="1" step="0.01" value="0">

          <button id="imgSepiaBtn">Sepia</button>
          <button id="imgBwBtn">B&W</button>
          <button id="imgSharpenBtn">Sharpen</button>
          <button id="imgAutoEnhanceBtn">Auto Enhance</button>
          <button id="imgResetBtn">Reset</button>
        </div>

        <!-- STICKERS -->
        <div class="tab" id="tab-stickers">
          <select id="sticker-category">
            <option value="emoji">Emoji</option>
            <option value="shapes">Shapes</option>
            <option value="doodles">Doodles</option>
            <option value="frames">Frames</option>
          </select>

          <div id="stickers-box"></div>

          <button id="stickerOutlineBtn">Outline</button>
          <button id="stickerShadowBtn">Shadow</button>
          <button id="stickerColorizeBtn">Colorize</button>
        </div>

        <!-- TEMPLATES -->
        <div class="tab" id="tab-templates">
          <button id="tplMinimalBtn">Minimal</button>
          <button id="tplMagazineBtn">Magazine</button>
          <button id="tplScrapbookBtn">Scrapbook</button>
          <button id="tplGrid2Btn">Grid-2</button>
          <button id="tplGrid4Btn">Grid-4</button>
          <button id="tplFullBleedBtn">Full Bleed</button>
        </div>

        <!-- EXPORT -->
        <div class="tab" id="tab-export">
          <button id="exportPdfBtn">📄 PDF</button>
          <button id="exportFlipbookBtn">📘 Flipbook</button>
          <button id="exportCloudBtn">☁ Cloud</button>
        </div>

      </div>
    </aside>

    <!-- CANVAS AREA -->
    <main id="canvas-area">
      <div id="canvas-wrapper">
        <canvas id="canvas"></canvas>
      </div>

      <div id="page-controls">
        <button id="prevPageBtn">‹</button>
        <span id="pageInfo">1 / 1</span>
        <button id="nextPageBtn">›</button>

    <!-- RIGHT THUMBNAILS -->

  </div>
  <script type="module">
import { exportToCloud, exportAsPDF, exportAsZip, exportAsFlipbook } from "./js/export.js";

// Μάζεμα σελίδων από canvas:
function collectPages() {
  return pages.map(p => p.image);
}

document.getElementById("exportCloudBtn").onclick = async () => {
  const pagesData = collectPages();
  const title = prompt("Τίτλος βιβλίου:");
  const pass = prompt("Κωδικός (προαιρετικός):");

  const id = await exportToCloud(pagesData, title, pass);
  if (id) alert("Το βιβλίο ανέβηκε!");
};

document.getElementById("exportPDFBtn").onclick = () => {
  exportAsPDF(collectPages());
};

document.getElementById("exportImagesBtn").onclick = () => {
  exportAsZip(collectPages());
};

document.getElementById("exportFlipbookBtn").onclick = () => {
  exportAsFlipbook(collectPages());
};
</script>


  <!-- JS Modules -->
  <script type="module" src="firebase-init.js"></script>
  <script type="module" src="js/core.js"></script>
  <script type="module" src="js/tools.js"></script>
  <script type="module" src="js/export.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="viewer.js"></script>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal">
  <div class="modal-dialog">
    <div class="modal-header">
      <h2>Σύνδεση</h2>
      <button class="close-modal" type="button">&times;</button>
    </div>
    <div class="modal-body">
      <form id="loginForm" class="auth-form">
        <label>
          Email
          <input type="email" name="email" required>
        </label>
        <label>
          Κωδικός
          <input type="password" name="password" required>
        </label>
        <button type="submit" class="btn btn-primary">Σύνδεση</button>
      </form>
      <p class="auth-switch">
        Δεν έχεις λογαριασμό;
        <button type="button" class="link-btn" id="switchToRegister">
          Εγγραφή
        </button>
      </p>
    </div>
  </div>
</div>

<!-- REGISTER MODAL -->
<div id="registerModal" class="modal">
  <div class="modal-dialog">
    <div class="modal-header">
      <h2>Εγγραφή</h2>
      <button class="close-modal" type="button">&times;</button>
    </div>
    <div class="modal-body">
      <form id="registerForm" class="auth-form">
        <label>
          Όνομα (προαιρετικό)
          <input type="text" name="name">
        </label>
        <label>
          Email
          <input type="email" name="email" required>
        </label>
        <label>
          Κωδικός
          <input type="password" name="password" required minlength="6">
        </label>
        <button type="submit" class="btn btn-primary">Εγγραφή</button>
      </form>
      <p class="auth-switch">
        Έχεις ήδη λογαριασμό;
        <button type="button" class="link-btn" id="switchToLogin">
          Σύνδεση
        </button>
      </p>
    </div>
  </div>
</div>


  <script type="module">
  import "./firebase-init.js";
  import "./js/auth.js";

  const loginModal = document.getElementById("loginModal");
  const registerModal = document.getElementById("registerModal");

  const switchToRegister = document.getElementById("switchToRegister");
  const switchToLogin = document.getElementById("switchToLogin");

  function showModal(el) { el?.classList.add("visible"); }
  function hideModal(el) { el?.classList.remove("visible"); }

  switchToRegister?.addEventListener("click", () => {
    hideModal(loginModal);
    showModal(registerModal);
  });

  switchToLogin?.addEventListener("click", () => {
    hideModal(registerModal);
    showModal(loginModal);
  });
</script>

  

</body>
</html>
