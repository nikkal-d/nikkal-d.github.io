<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Photobook Editor</title>

  <link rel="stylesheet" href="./css/app.css" />
  <link rel="stylesheet" href="./css/photobook.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
  /* Modal Styles */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9999}
  .modal.open{display:flex}
  .modal-inner{width:min(1100px,94vw);height:min(760px,92vh);background:var(--panel,#111);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .modal-head{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal-body{flex:1;position:relative;background:#000}
  .modal-body iframe{width:100%;height:100%;border:none}
  
  /* Topbar Export Styles */
  .export-group {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-right: 10px;
  }
  .btn-export {
    background: #22c55e;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-export:hover {
    background: #16a34a;
    transform: translateY(-1px);
  }
  </style>
</head>

<body class="theme-dark">

  <header class="topbar">
    <div class="topbar-left">
      <span class="brand">Photobook Studio</span>
      <nav class="topnav">
        <a href="#">Αρχείο</a>
        <a href="#">Επεξεργασία</a>
      </nav>
    </div>

    <div class="topbar-right">
      <div class="export-group">
        <button class="btn-export" id="exportPdfBtn">PDF</button>
        <button class="btn-export" id="exportFlipBtn">Flipbook</button>
        <button class="btn-export" id="exportPngBtn">PNG</button>
        <button class="btn-export" id="exportJpgBtn">JPG</button>
      </div>
      <div class="divider-v"></div>
      <button class="btn-login" id="themeToggleBtn">☀️</button>
    </div>
  </header>

  <div class="appShell">
    <aside class="leftRail">
      <button class="railbtn active" data-panel="pages" title="Σελίδες">📄</button>
      <button class="railbtn" data-panel="images" title="Εικόνες">🖼️</button>
      <button class="railbtn" data-panel="text" title="Κείμενο">T</button>
      <button class="railbtn" data-panel="shapes" title="Σχήματα">⭐</button>
      <button class="railbtn" data-panel="colors" title="Φόντο">🎨</button>
      <button class="railbtn" data-panel="layers" title="Επίπεδα">📚</button>
      <div style="margin-top:auto"></div>
      <button class="railbtn" id="clearDraftBtn" title="Καθαρισμός">🗑️</button>
    </aside>

    <aside class="leftPanel" id="leftPanel">
      <div class="panelHead">
        <span id="panelTitle">Pages</span>
        <button class="closeBtn" id="closeLeftPanelBtn">&times;</button>
      </div>

      <div class="panelView" data-view="pages">
        <button class="btn primary" style="width:100%;margin-bottom:12px" id="addPageBtn">+ Νέα Σελίδα</button>
        <div class="thumbStrip" id="thumbStrip"></div>
      </div>

      <div class="panelView" data-view="images" hidden>
        <div class="panelBody">
          <label class="uploadBox">
            <input type="file" id="imageUploadInput" accept="image/*" multiple hidden />
            <span>Ανεβάστε Φωτογραφίες</span>
          </label>
        </div>
      </div>

      <div class="panelView" data-view="text" hidden>
        <div class="panelBody">
          <button class="btn ghost" style="width:100%" onclick="Photobook.addText({text:'Νέο Κείμενο'})">Προσθήκη Κειμένου</button>
        </div>
      </div>

      <div class="panelView" data-view="shapes" hidden>
        <div class="grid2">
          <button class="btn ghost" id="addRectBtn">Τετράγωνο</button>
          <button class="btn ghost" id="addCircleBtn">Κύκλος</button>
        </div>
      </div>

      <div class="panelView" data-view="colors" hidden>
        <div class="panelBody">
          <input type="color" id="bgColorPicker" style="width:100%;height:40px" />
        </div>
      </div>

      <div class="panelView" data-view="layers" hidden>
        <div id="layersList"></div>
      </div>
    </aside>

    <main class="canvasArea">
      <div class="canvasToolbar">
        <div class="zoomGroup">
          <button class="toolBtn" id="zoomOutBtn">−</button>
          <span id="zoomValue">100%</span>
          <button class="toolBtn" id="zoomInBtn">+</button>
          <button class="toolBtn" id="fitScreenBtn">Fit</button>
        </div>
        
        <div class="divider-v"></div>
        
        <select id="pageSizeSelect" class="selectSm">
          <option value="A4P">A4 Κάθετο</option>
          <option value="A4L">A4 Οριζόντιο</option>
          <option value="SQUARE">Τετράγωνο</option>
        </select>
        
        <div class="divider-v"></div>
        
        <div class="pageNav">
          <button class="toolBtn" id="prevPageBtn">←</button>
          <span id="pageInfo">1 / 1</span>
          <button class="toolBtn" id="nextPageBtn">→</button>
        </div>
      </div>

      <div class="canvasHost" id="canvasHost">
        <canvas id="canvas"></canvas>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

  <script type="module" src="./js/core.js"></script>
  <script type="module" src="./js/ui.js"></script>
  <script src="./js/sidebar.js"></script>

  <div class="modal" id="flipPreviewModal">
    <div class="modal-inner">
      <div class="modal-head">
        <span>Προεπισκόπηση</span>
        <button class="closeBtn" id="closeFlipModalBtn">&times;</button>
      </div>
      <div class="modal-body">
        <iframe id="flipPreviewFrame"></iframe>
      </div>
    </div>
  </div>

</body>
</html>
