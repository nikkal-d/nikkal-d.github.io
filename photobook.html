<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FABRIC TEST</title>

  <!-- Fabric -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

  <style>
    body {
      margin: 0;
      background: red; /* ΑΝ ΔΕΝ ΔΕΙΣ ΚΟΚΚΙΝΟ → ΔΕΝ ΦΟΡΤΩΝΕΙ ΚΑΝ ΤΟ HTML */
    }

    #btn {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 10px;
      background: black;
      color: white;
      z-index: 10;
    }

    canvas {
      background: white;
      border: 5px solid black;
      margin: 100px;
    }
  </style>
</head>
<body>

<button id="btn">ADD TEXT</button>

<canvas id="c" width="500" height="400"></canvas>

<script>
  alert("JS ΦΟΡΤΩΣΕ");

  if (typeof fabric === "undefined") {
    alert("❌ FABRIC ΔΕΝ ΦΟΡΤΩΣΕ");
  } else {
    alert("✅ FABRIC OK");
  }

  const canvas = new fabric.Canvas("c");

  document.getElementById("btn").onclick = () => {
    const t = new fabric.Text("HELLO", {
      left: 100,
      top: 100,
      fill: "black",
      fontSize: 40
    });
    canvas.add(t);
  };
</script>

</body>
</html>
