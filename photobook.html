<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Photobook Editor</title>

  <link rel="stylesheet" href="./css/app.css" />
  <link rel="stylesheet" href="./css/photobook.css" />
</head>

<body class="theme-light">

<header class="topbar">
  <div class="topbar-left">
    <span class="brand">Photobook</span>
  </div>
  <div class="topbar-right">
    <button id="themeToggleBtn">🌙</button>
  </div>
</header>

<div class="appShell">

  <aside class="leftRail">
    <button class="railbtn" data-panel="pages">📄</button>
    <button class="railbtn" data-panel="text">🅰</button>
    <button class="railbtn" data-panel="images">🖼</button>
    <button class="railbtn" data-panel="shapes">⬛</button>
    <button class="railbtn" data-panel="layers">📚</button>
  </aside>

  <section class="leftPanel" id="leftPanel">
    <div class="panelHeader">
      <h3 id="panelTitle">Panel</h3>
      <button id="closeLeftPanelBtn">✕</button>
    </div>

    <div class="panelView" data-view="pages">
      <button id="addPageBtn">+ Page</button>
      <button id="dupPageBtn">Duplicate</button>
      <button id="prevPageBtn">←</button>
      <button id="nextPageBtn">→</button>
      <div id="pageInfo">1 / 1</div>
    </div>

    <div class="panelView" data-view="text" hidden>
      <button id="addTextBtn">Add Text</button>
      <input type="color" id="textColorInput" />
      <input type="number" id="fontSizeInput" value="40" />
      <select id="fontSelect">
        <option>Arial</option>
        <option>Georgia</option>
        <option>Times New Roman</option>
        <option>Verdana</option>
      </select>
    </div>

    <div class="panelView" data-view="images" hidden>
      <input type="file" id="imageInput" accept="image/*" />
    </div>

    <div class="panelView" data-view="shapes" hidden>
      <button id="addRectBtn">▭</button>
      <button id="addCircleBtn">◯</button>
    </div>

    <div class="panelView" data-view="layers" hidden>
      <button id="bringFwdBtn">Up</button>
      <button id="sendBackBtn">Down</button>
    </div>
  </section>

  <main class="stage">
    <div class="stageBar">
      <button id="zoomOutBtn">−</button>
      <span id="zoomValue">100%</span>
      <button id="zoomInBtn">+</button>
      <button id="exportFlipBtn">Export Flipbook</button>
    </div>

    <div class="canvasHost">
      <canvas id="canvas"></canvas>
    </div>
  </main>

</div>

<div class="modal" id="flipPreviewModal">
  <div class="modal-inner">
    <div class="modal-head">
      <span>Flipbook Preview</span>
      <button id="closeFlipPreview">✕</button>
    </div>
    <iframe id="flipPreviewFrame"></iframe>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<script type="module" src="./js/firebase-init.js"></script>
<script type="module" src="./js/firebase-store.js"></script>
<script type="module" src="./js/core.js"></script>
<script type="module" src="./js/ui.js"></script>
<script src="./js/sidebar.js"></script>

</body>
</html>
