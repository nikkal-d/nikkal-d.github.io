<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Τα Photobooks μου</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/qrcode"></script>

  
<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Poppins", sans-serif;
  background: #0f172a;
  color: #e2e8f0;
}

header {
  background: #1e293b;
  padding: 1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #334155;
}

  .logo {
  font-weight: 600;
}

.main-nav {
  display: flex;
  gap: 0.6rem;
}

.main-nav a {
  color: #e5e7eb;
  text-decoration: none;
  font-size: 0.9rem;
  padding: 0.25rem 0.7rem;
  border-radius: 999px;
  border: 1px solid transparent;
}

.main-nav a:hover {
  border-color: #475569;
  background: rgba(148,163,184,0.18);
}

.main-nav a.active {
  border-color: #3b82f6;
  background: #3b82f6;
}


h1 {
  margin: 0;
  font-size: 1.6rem;
}

#user-info {
  font-size: 1rem;
}

button {
  background: #3b82f6;
  border: none;
  padding: 0.4rem 0.8rem;
  border-radius: 6px;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #2563eb;
}

#gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1.2rem;
  padding: 1.5rem;
}

.card {
  background: #1e293b;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #334155;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.card-body {
  padding: 0.9rem;
}

.card-title {
  font-size: 1.2rem;
  margin: 0 0 0.3rem 0;
}

.card-date {
  font-size: 0.8rem;
  opacity: 0.7;
}

.card-actions {
  margin-top: 0.9rem;
  display: flex;
  justify-content: space-between;
}

.action-btn {
  background: #475569;
  padding: 0.35rem 0.6rem;
  border-radius: 6px;
}

.action-btn:hover {
  background: #64748b;
}

  .public-badge {
  position: absolute;
  top: 8px;
  left: 8px;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 0.75rem;
  font-weight: 600;
  color: white;
}

.share-panel {
  background: rgba(255,255,255,0.07);
  border-top: 1px solid rgba(255,255,255,0.1);
  margin-top: 8px;
  padding: 10px;
  border-radius: 0 0 10px 10px;
}

.share-link-box {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}

.share-link-box input {
  flex: 1;
  padding: 5px;
  border-radius: 6px;
  border: none;
  font-size: 0.8rem;
}

.qr-box {
  display: flex;
  justify-content: center;
  padding-top: 10px;
}

  
</style>
</head>

<body>

<header>
  <div style="display:flex; align-items:center; gap:1rem;">
    <div class="logo">
      <a href="index.html" style="text-decoration:none; color:inherit;">
        📚 Photobook Studio
      </a>
    </div>

    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="photobook.html">Photobook</a>
      <a href="duplicates.html">Find My Duplication</a>
      <a href="projects.html" class="active">My Photobooks</a>
    </nav>
  </div>

  <div id="user-info">
    <span id="user-label">Φόρτωση...</span>
    <button id="logout-btn" style="display:none;">Αποσύνδεση</button>
  </div>
</header>


<div class="card-actions">
  <a class="action-btn" href="viewer.html?id=${docSnap.id}">
    Προβολή
  </a>

  <button class="action-btn" onclick="renamePhotobook('${docSnap.id}')">
    ✏️ Μετονομασία
  </button>

  <button class="action-btn" onclick="duplicatePhotobook('${docSnap.id}', '${book.bookId}', '${book.userId}')">
    📄 Αντιγραφή
  </button>

  <button class="action-btn" onclick="deletePhotobook('${docSnap.id}', '${book.bookId}', '${book.userId}')">
    🗑 Διαγραφή
  </button>
<button class="action-btn" onclick="togglePublic('${docSnap.id}')">
  🌐 Κοινή χρήση
</button>
  

  
</div>



  
<section id="gallery">
  <!-- Dynamically filled -->
</section>

<!-- Firebase -->
<script type="module" src="firebase-init.js"></script>

<!-- Gallery logic -->
<script type="module" src="js/projects.js"></script>

</body>
</html>
