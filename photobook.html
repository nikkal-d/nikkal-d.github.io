<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <title>Photobook Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- HARD FIX: block alphabetical -->
  <script>
  (function () {
    const proto = CanvasRenderingContext2D.prototype;
    const desc = Object.getOwnPropertyDescriptor(proto, "textBaseline");
    Object.defineProperty(proto, "textBaseline", {
      get() { return this.___tb || "top"; },
      set(v) {
        this.___tb = (v === "alphabetical") ? "top" : v;
        if (desc && desc.set) {
          try { desc.set.call(this, this.___tb); } catch {}
        }
      }
    });
  })();
  </script>

  <!-- FABRIC -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="./css/photobook.css" />
</head>
<body>

<!-- =====================================================
TOP BAR
===================================================== -->
<div class="topbar">
  <div class="top-actions">
    <button class="btn" id="btnPrevPage">◀</button>
    <span id="pageInfo">1 / 1</span>
    <button class="btn" id="btnNextPage">▶</button>
  </div>

  <div class="top-actions">
    <button class="btn" id="btnUndo">Undo</button>
    <button class="btn" id="btnRedo">Redo</button>
    <button class="btn" id="btnFit">Fit</button>
    <button class="btn" id="btnExportToggle">Export</button>
    <button class="btn primary" id="btnLogin">Σύνδεση</button>
  </div>
</div>

<!-- =====================================================
APP
===================================================== -->
<div class="app">

  <!-- LEFT TOOLS -->
  <div class="sidebar">
    <button class="tb" id="toolImage" title="Εικόνα">🖼</button>
    <button class="tb" id="toolPDF" title="PDF">📄</button>
    <button class="tb" id="toolText" title="Κείμενο">T</button>
    <button class="tb" id="toolRect" title="Ορθογώνιο">▭</button>
    <button class="tb" id="toolCircle" title="Κύκλος">◯</button>
    <button class="tb" id="toolLine" title="Γραμμή">／</button>
    <button class="tb" id="toolDelete" title="Διαγραφή">🗑</button>
  </div>

  <!-- CANVAS -->
  <div class="canvas-area">

    <div class="canvas-toolbar">
      <button class="btn" id="zoomOut">−</button>
      <span id="zoomLabel">100%</span>
      <button class="btn" id="zoomIn">+</button>
    </div>

    <div id="canvasHost">
      <canvas id="canvas"></canvas>
    </div>

    <div class="thumb-strip" id="thumbStrip"></div>
  </div>
</div>

<!-- HIDDEN INPUTS -->
<input type="file" id="imageInput" accept="image/*" hidden />
<input type="file" id="pdfInput" accept="application/pdf" hidden />

<!-- =====================================================
EXPORT SIDEBAR
===================================================== -->
<div id="exportDrawer">
  <h3>Export</h3>

  <label>Μορφή</label>
  <select>
    <option>PNG</option>
    <option>PDF</option>
    <option>Flipbook</option>
  </select>

  <label>Ποιότητα</label>
  <input type="range" min="0.5" max="1" step="0.1" value="0.9" />

  <button class="btn primary">Export</button>
</div>

<!-- =====================================================
MODULES
===================================================== -->
<script type="module">
import {
  setZoom,
  fitToScreen,
  undo,
  redo,
  nextPage,
  prevPage
} from "./js/core.js";

import {
  importImage,
  importPDF,
  addHeading,
  addRect,
  addCircle,
  addLine,
  deleteSelected
} from "./js/tools.js";

/* PAGES */
btnNextPage.onclick = nextPage;
btnPrevPage.onclick = prevPage;

/* HISTORY */
btnUndo.onclick = undo;
btnRedo.onclick = redo;

/* ZOOM */
let zoom = 1;
zoomIn.onclick = () => {
  zoom += 0.1;
  setZoom(zoom);
  zoomLabel.textContent = Math.round(zoom * 100) + "%";
};
zoomOut.onclick = () => {
  zoom = Math.max(0.2, zoom - 0.1);
  setZoom(zoom);
  zoomLabel.textContent = Math.round(zoom * 100) + "%";
};
btnFit.onclick = () => {
  fitToScreen();
  zoom = 1;
  zoomLabel.textContent = "100%";
};

/* EXPORT SIDEBAR */
btnExportToggle.onclick = () => {
  exportDrawer.classList.toggle("open");
};

/* TOOLS */
toolImage.onclick = () => imageInput.click();
imageInput.onchange = e => importImage(e.target.files[0]);

toolPDF.onclick = () => pdfInput.click();
pdfInput.onchange = e => importPDF(e.target.files[0]);

toolText.onclick = () => addHeading();
toolRect.onclick = addRect;
toolCircle.onclick = addCircle;
toolLine.onclick = addLine;
toolDelete.onclick = deleteSelected;

/* AUTH */
btnLogin.onclick = () => {
  alert("Σύνδεση χρήστη (Firebase Auth) – επόμενο βήμα");
};
</script>

</body>
</html>
