<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Photobook Viewer</title>
  <link rel="stylesheet" href="css/viewer.css">
</head>

<body>

  <div id="viewer-loading">Φόρτωση...</div>

  <div id="share-banner">
      Δημόσια προβολή
      <button id="copyShareLink">Αντιγραφή</button>
  </div>

  <div id="passwordModal">
      <form id="passwordForm">
          <h3>Κωδικός</h3>
          <input type="password" name="password" placeholder="Κωδικός" required>
          <button>Είσοδος</button>
      </form>
  </div>

  <div id="simpleView"></div>
  <div id="flipbook"></div>

  <div id="flipbook-nav">
      <button id="flipPrev">⟵</button>
      <span id="pageLabel">1/1</span>
      <button id="flipNext">⟶</button>
  </div>

  <button id="fullscreenBtn">⛶</button>

  <script type="module" src="./viewer.js"></script>
</body>
</html>
