<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <title>Photobook Editor</title>

  <!-- CSS -->
  <link rel="stylesheet" href="./css/photobook.css" />

  <!-- Fabric -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
</head>

<body>
  <!-- TOP BAR -->
  <header class="topbar">
    <span class="logo">Photobook</span>
    <div class="top-actions">
      <button id="addTextBtn">Text</button>
      <button id="addImageBtn">Image</button>
      <button id="zoomIn">＋</button>
      <button id="zoomOut">－</button>
      <button id="resetZoom">100%</button>
    </div>
  </header>

  <!-- MAIN -->
  <div class="app">
    <!-- LEFT BAR -->
    <aside class="sidebar left">
      <button id="prevPage">◀</button>
      <span id="pageInfo">1 / 1</span>
      <button id="nextPage">▶</button>
    </aside>

    <!-- CANVAS AREA -->
    <main class="canvas-area">
      <div id="canvasHost">
        <canvas id="canvas"></canvas>
      </div>
    </main>

    <!-- RIGHT BAR -->
    <aside class="sidebar right">
      <button>Export</button>
      <button>Flipbook</button>
    </aside>
  </div>

  <!-- HIDDEN INPUT -->
  <input type="file" id="imageInput" accept="image/*" hidden />

  <!-- JS -->
  <script type="module" src="./js/core.js"></script>
  <script type="module" src="./js/ui.js"></script>
</body>
</html>
