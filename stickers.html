<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<title>Stickers Library · Photobook Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
  :root {
    --bg: #020617;
    --border: #1f2937;
    --accent: #38bdf8;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --radius: 16px;
  }

  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: radial-gradient(circle at top, #020617, #020617 55%);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    padding: 0.8rem 1.5rem;
    background: rgba(2,6,23,0.9);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items:center;
  }

  nav a {
    text-decoration: none;
    color: var(--muted);
    padding: 0.4rem 0.8rem;
    border-radius: 999px;
    border:1px solid transparent;
    font-size:0.8rem;
  }

  nav a:hover { color: var(--text); border-color:rgba(148,163,184,0.3); }

  nav a.active {
    color: var(--accent);
    border-color: rgba(56,189,248,0.35);
  }

  main {
    flex: 1;
    padding: 1.5rem;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
  }

  h1 { margin-top: 0; }

  .category {
    margin-top: 2rem;
  }

  .category h2 {
    font-size: 1.2rem;
    margin-bottom: 0.5rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 1rem;
  }

  .item {
    background: #0f172a;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
    padding: 0.5rem;
    display: flex;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.1s, border-color 0.2s;
  }

  .item:hover {
    border-color: var(--accent);
    transform: scale(1.05);
  }

  .item img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  footer {
    padding: 1rem;
    text-align: center;
    color: var(--muted);
    border-top: 1px solid var(--border);
    background: rgba(2,6,23,0.95);
    font-size:0.75rem;
  }
</style>
</head>
<body>

<header>
  <div style="color:var(--muted);font-size:0.9rem;">📚 Photobook Studio</div>
  <nav>
   <a href="duplicates.html">Find My Duplicates</a>
    <a href="photobook.html">Photobook Editor</a>
    <a href="projects.html">Projects</a>
    <a href="templates.html">Templates</a>
    <a href="stickers.html" class="active">Stickers</a>
    <a href="viewer.html">Viewer</a>
  </nav>
</header>

<main>
  <h1>Stickers Library</h1>
  <p>Προεπισκόπηση όλων των stickers που μπορείς να χρησιμοποιήσεις στον editor. Κλικ σε κάποιο για να αντιγράψεις το URL του.</p>

  <div id="stickers-container"></div>
</main>

<footer>© 2025 Photobook Studio · Stickers</footer>

<script>
const stickers = {
  "Minimal Icons": [
    "https://raw.githubusercontent.com/encharm/Font-Awesome-SVG-PNG/master/black/png/64/heart.png",
    "https://raw.githubusercontent.com/encharm/Font-Awesome-SVG-PNG/master/black/png/64/star.png",
    "https://raw.githubusercontent.com/encharm/Font-Awesome-SVG-PNG/master/black/png/64/camera.png",
    "https://raw.githubusercontent.com/encharm/Font-Awesome-SVG-PNG/master/black/png/64/map.png"
  ],
  "Cute Stickers": [
    "https://i.postimg.cc/GtNwSn0x/cute-1.png",
    "https://i.postimg.cc/V6MN9BzP/cute-2.png",
    "https://i.postimg.cc/gk8mC83w/cute-3.png"
  ],
  "Hearts": [
    "https://i.postimg.cc/3xw1YwN8/heart-glow.png",
    "https://i.postimg.cc/jdYQxNL1/heart-pink.png"
  ],
  "Frames": [
    "https://i.postimg.cc/SNt1dPvt/frame-gold.png",
    "https://i.postimg.cc/2SWqQr6t/frame-minimal.png"
  ],
  "Travel": [
    "https://i.postimg.cc/K8Xgb6cx/travel-plane.png",
    "https://i.postimg.cc/5t73d6xm/travel-stamp.png"
  ]
};

const container = document.getElementById("stickers-container");

Object.keys(stickers).forEach(category => {
  const wrap = document.createElement("div");
  wrap.className = "category";

  const h = document.createElement("h2");
  h.textContent = category;
  wrap.appendChild(h);

  const grid = document.createElement("div");
  grid.className = "grid";

  stickers[category].forEach(url => {
    const div = document.createElement("div");
    div.className = "item";
    div.addEventListener("click", () => {
      navigator.clipboard.writeText(url);
      alert("Το sticker αντιγράφηκε στο clipboard για χρήση στον editor!\nΠήγαινε στο Photobook Editor ➜ Stickers ➜ Επικόλληση URL.");
    });

    const img = document.createElement("img");
    img.src = url;
    div.appendChild(img);

    grid.appendChild(div);
  });

  wrap.appendChild(grid);
  container.appendChild(wrap);
});
</script>

</body>
</html>
