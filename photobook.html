<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<title>Photobook Editor</title>

<!-- Fabric -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

<style>
/* ====== RESET ====== */
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}

/* ====== LAYOUT ====== */
body{
  height:100vh;
  display:flex;
  flex-direction:column;
  background:#f4f4f4;
}

.topbar{
  height:50px;
  background:#222;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
}

.topbar button{
  margin-left:6px;
  padding:6px 10px;
  cursor:pointer;
}

.editor{
  flex:1;
  display:flex;
  overflow:hidden;
}

/* ====== PANELS ====== */
.sidebar{
  width:240px;
  background:#fff;
  border-right:1px solid #ddd;
  padding:10px;
  overflow:auto;
}

.sidebar.hidden{display:none}

.rightbar{
  width:260px;
  background:#fff;
  border-left:1px solid #ddd;
  padding:10px;
  overflow:auto;
}

.rightbar.hidden{display:none}

/* ====== CANVAS AREA ====== */
.canvasArea{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:auto;
  position:relative;
  background:#eaeaea;
}

.canvasWrap{
  margin:auto;
}

canvas{
  background:#fff;
  border:1px solid #ccc;
}

/* ====== BUTTONS ====== */
.btn{
  display:block;
  width:100%;
  margin-bottom:8px;
  padding:8px;
  cursor:pointer;
}

/* ====== TITLES ====== */
h3{margin-bottom:10px}

/* ====== DARK MODE (future ready) ====== */
body.dark{
  background:#1e1e1e;
}
</style>
</head>

<body>

<!-- ===== TOP BAR ===== -->
<div class="topbar">
  <div>
    <button id="toggleLeft">☰</button>
    <button id="toggleLang">EL / EN</button>
  </div>

  <div>
    <button id="zoomOut">−</button>
    <button id="zoomReset">100%</button>
    <button id="zoomIn">+</button>
    <button id="toggleRight" data-i18n="export">Export</button>
    <button id="loginBtn" data-i18n="login">Σύνδεση</button>
  </div>
</div>

<!-- ===== EDITOR ===== -->
<div class="editor">

  <!-- LEFT -->
  <div class="sidebar" id="leftPanel">
    <h3 data-i18n="tools">Εργαλεία</h3>
    <button class="btn" data-i18n="images">Εικόνες</button>
    <button class="btn" data-i18n="text">Κείμενο</button>
    <button class="btn" data-i18n="shapes">Σχήματα</button>
    <button class="btn" data-i18n="stickers">Stickers</button>
  </div>

  <!-- CANVAS -->
  <div class="canvasArea">
    <div class="canvasWrap">
      <canvas id="editorCanvas" width="900" height="600"></canvas>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="rightbar hidden" id="rightPanel">
    <h3 data-i18n="export">Export</h3>
    <button class="btn">PNG</button>
    <button class="btn">PDF</button>
    <button class="btn">Flipbook</button>
  </div>

</div>

<script>
/* ===== CANVAS ===== */
const canvas = new fabric.Canvas('editorCanvas');

/* ===== ZOOM ===== */
let zoom = 1;
const ZOOM_STEP = 0.1;
const MIN_ZOOM = 0.2;
const MAX_ZOOM = 4;

function applyZoom(){
  canvas.setZoom(zoom);
  canvas.requestRenderAll();
}

document.getElementById("zoomIn").onclick = () => {
  zoom = Math.min(MAX_ZOOM, zoom + ZOOM_STEP);
  applyZoom();
};

document.getElementById("zoomOut").onclick = () => {
  zoom = Math.max(MIN_ZOOM, zoom - ZOOM_STEP);
  applyZoom();
};

document.getElementById("zoomReset").onclick = () => {
  zoom = 1;
  canvas.setViewportTransform([1,0,0,1,0,0]);
  applyZoom();
};

canvas.on("mouse:wheel", opt => {
  zoom += opt.e.deltaY > 0 ? -ZOOM_STEP : ZOOM_STEP;
  zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom));
  applyZoom();
  opt.e.preventDefault();
  opt.e.stopPropagation();
});

/* ===== PAN ===== */
let isPanning = false;

document.addEventListener("keydown", e=>{
  if(e.code==="Space"){isPanning=true;canvas.selection=false}
});
document.addEventListener("keyup", e=>{
  if(e.code==="Space"){isPanning=false;canvas.selection=true}
});

canvas.on("mouse:down", opt=>{
  if(isPanning){
    canvas.isDragging=true;
    canvas.lastPosX=opt.e.clientX;
    canvas.lastPosY=opt.e.clientY;
  }
});
canvas.on("mouse:move", opt=>{
  if(canvas.isDragging){
    const vpt=canvas.viewportTransform;
    vpt[4]+=opt.e.clientX-canvas.lastPosX;
    vpt[5]+=opt.e.clientY-canvas.lastPosY;
    canvas.requestRenderAll();
    canvas.lastPosX=opt.e.clientX;
    canvas.lastPosY=opt.e.clientY;
  }
});
canvas.on("mouse:up", ()=>canvas.isDragging=false);

/* ===== PANELS ===== */
toggleLeft.onclick = ()=>leftPanel.classList.toggle("hidden");
toggleRight.onclick = ()=>rightPanel.classList.toggle("hidden");

/* ===== I18N ===== */
let lang="el";
const dict={
  el:{
    login:"Σύνδεση",
    export:"Εξαγωγή",
    tools:"Εργαλεία",
    images:"Εικόνες",
    text:"Κείμενο",
    shapes:"Σχήματα",
    stickers:"Stickers"
  },
  en:{
    login:"Login",
    export:"Export",
    tools:"Tools",
    images:"Images",
    text:"Text",
    shapes:"Shapes",
    stickers:"Stickers"
  }
};

function applyLang(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    el.textContent=dict[lang][el.dataset.i18n];
  });
}

toggleLang.onclick=()=>{
  lang=lang==="el"?"en":"el";
  applyLang();
};

applyLang();
</script>

</body>
</html>
