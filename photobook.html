<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<title>Photobook Editor</title>

<!-- FABRIC -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #1e1e1e;
  color: #eee;
  font-family: Arial, sans-serif;
}

#app {
  display: flex;
  height: 100%;
}

/* LEFT BAR */
#leftBar {
  width: 220px;
  background: #2a2a2a;
  padding: 12px;
  box-sizing: border-box;
}

#leftBar button {
  width: 100%;
  margin-bottom: 8px;
  padding: 10px;
  background: #3a3a3a;
  color: #fff;
  border: none;
  cursor: pointer;
}
#leftBar button:hover { background:#555; }

/* CANVAS AREA */
#center {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #111;
}

#topBar {
  padding: 8px;
  background: #222;
  display: flex;
  gap: 8px;
  align-items: center;
}

#topBar button {
  padding: 6px 10px;
  background: #444;
  color: #fff;
  border: none;
  cursor: pointer;
}

#canvasWrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

canvas {
  background: #fff;
  box-shadow: 0 0 20px rgba(0,0,0,0.6);
}
</style>
</head>

<body>
<div id="app">

  <!-- LEFT -->
  <div id="leftBar">
    <button onclick="addText()">➕ Text</button>

    <button onclick="imageInput.click()">🖼 Image</button>
    <input id="imageInput" type="file" accept="image/*" hidden>

    <hr style="border:0;border-top:1px solid #444;margin:10px 0">

    <button onclick="undo()">↩ Undo</button>
    <button onclick="redo()">↪ Redo</button>
  </div>

  <!-- CENTER -->
  <div id="center">
    <div id="topBar">
      <button onclick="zoomIn()">＋</button>
      <button onclick="zoomOut()">－</button>
      <button onclick="resetZoom()">100%</button>
      <span id="zoomLabel">100%</span>
    </div>

    <div id="canvasWrap">
      <canvas id="canvas" width="1240" height="1754"></canvas>
    </div>
  </div>

</div>

<script>
/* =====================================================
   FABRIC FIX — ΣΚΟΤΩΝΕΙ ΤΟ "alphabetical" ΓΙΑ ΠΑΝΤΑ
===================================================== */
fabric.Textbox.prototype.textBaseline = "alphabetic";
fabric.Text.prototype.textBaseline = "alphabetic";
fabric.IText.prototype.textBaseline = "alphabetic";

/* =====================================================
   APP
===================================================== */
const App = {};
App.canvas = new fabric.Canvas("canvas", {
  preserveObjectStacking: true,
  selection: true
});

/* =====================================================
   ZOOM
===================================================== */
let zoom = 1;

function updateZoomLabel(){
  document.getElementById("zoomLabel").textContent =
    Math.round(zoom * 100) + "%";
}

function setZoom(z){
  zoom = Math.max(0.2, Math.min(4, z));
  const center = new fabric.Point(
    App.canvas.getWidth()/2,
    App.canvas.getHeight()/2
  );
  App.canvas.zoomToPoint(center, zoom);
  App.canvas.requestRenderAll();
  updateZoomLabel();
}

function zoomIn(){ setZoom(zoom + 0.1); }
function zoomOut(){ setZoom(zoom - 0.1); }
function resetZoom(){
  zoom = 1;
  App.canvas.setViewportTransform([1,0,0,1,0,0]);
  App.canvas.setZoom(1);
  updateZoomLabel();
}

/* =====================================================
   HISTORY
===================================================== */
let undoStack = [];
let redoStack = [];
let restoring = false;

function saveHistory(){
  if(restoring) return;
  undoStack.push(JSON.stringify(App.canvas.toJSON()));
  if(undoStack.length > 50) undoStack.shift();
  redoStack = [];
}

App.canvas.on("object:added", saveHistory);
App.canvas.on("object:modified", saveHistory);
App.canvas.on("object:removed", saveHistory);

function undo(){
  if(undoStack.length < 2) return;
  restoring = true;
  redoStack.push(undoStack.pop());
  const prev = undoStack[undoStack.length-1];
  App.canvas.loadFromJSON(prev, ()=>{
    App.canvas.renderAll();
    restoring = false;
  });
}

function redo(){
  if(!redoStack.length) return;
  restoring = true;
  const next = redoStack.pop();
  undoStack.push(next);
  App.canvas.loadFromJSON(next, ()=>{
    App.canvas.renderAll();
    restoring = false;
  });
}

/* =====================================================
   TOOLS
===================================================== */
function addText(){
  const t = new fabric.Textbox("Text", {
    left: 150,
    top: 150,
    fontSize: 48,
    fill: "#111",
    fontFamily: "Arial",
    textBaseline: "alphabetic"
  });
  App.canvas.add(t);
  App.canvas.setActiveObject(t);
  App.canvas.requestRenderAll();
}

const imageInput = document.getElementById("imageInput");
imageInput.onchange = e => {
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    fabric.Image.fromURL(reader.result, img=>{
      img.scaleToWidth(App.canvas.getWidth()*0.4);
      img.left = 200;
      img.top = 200;
      App.canvas.add(img);
      App.canvas.setActiveObject(img);
      App.canvas.requestRenderAll();
    });
  };
  reader.readAsDataURL(file);
};

/* INIT */
saveHistory();
updateZoomLabel();
</script>
</body>
</html>
