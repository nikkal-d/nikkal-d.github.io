<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <title>Photobook Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- CSS (ΔΕΝ ΤΑ ΠΕΙΡΑΖΟΥΜΕ) -->
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/photobook.css" />

  <!-- FABRIC (ΜΙΑ ΦΟΡΑ ΜΟΝΟ) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
</head>

<body>

<!-- ================= TOP BAR ================= -->
<header id="topBar">
  <div class="logo">Photobook</div>

  <div class="top-actions">
    <button id="loginBtn">Σύνδεση</button>
    <button id="logoutBtn" style="display:none">Αποσύνδεση</button>
  </div>
</header>

<!-- ================= MAIN ================= -->
<div id="main">

  <!-- ========== LEFT SIDEBAR ========== -->
  <aside id="leftSidebar" class="sidebar">
    <button data-panel="text">Text</button>
    <button data-panel="image">Image</button>
    <button data-panel="shapes">Shapes</button>
    <button data-panel="pages">Pages</button>
  </aside>

  <!-- ========== PANELS ========== -->
  <div id="panels">

    <!-- TEXT PANEL -->
    <div class="panel" id="panel-text">
      <h3>Text</h3>
      <button id="addTextBtn">➕ Προσθήκη Κειμένου</button>
    </div>

    <!-- IMAGE PANEL -->
    <div class="panel" id="panel-image">
      <h3>Image</h3>
      <input type="file" id="imageInput" accept="image/*" />
    </div>

    <!-- SHAPES PANEL -->
    <div class="panel" id="panel-shapes">
      <h3>Shapes</h3>
      <p>(θα μπουν μετά)</p>
    </div>

    <!-- PAGES PANEL -->
    <div class="panel" id="panel-pages">
      <h3>Pages</h3>
      <div id="thumbStrip"></div>
    </div>

  </div>

  <!-- ========== WORKSPACE ========== -->
  <main id="workspace">
    <div id="canvasHost">
      <canvas id="canvas"></canvas>
    </div>
  </main>

  <!-- ========== RIGHT SIDEBAR ========== -->
  <aside id="rightSidebar" class="sidebar right">
    <button id="zoomIn">＋</button>
    <button id="zoomOut">－</button>
    <button id="zoomReset">100%</button>

    <hr />

    <button id="exportBtn">Export</button>
    <button id="previewBtn">Flipbook</button>
  </aside>

</div>

<!-- ================= JS ================= -->
<script type="module" src="js/core.js"></script>
<script type="module" src="js/ui.js"></script>
<script type="module" src="js/sidebar.js"></script>

</body>
</html>
