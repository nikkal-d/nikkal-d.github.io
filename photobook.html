<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <title>Photobook Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- CSS -->
  <link rel="stylesheet" href="./css/photobook.css" />

  <!-- Fabric.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

  <style>
    /* ====== BASIC LAYOUT ====== */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* LEFT SIDEBAR */
    .sidebar {
      width: 70px;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
    }

    .sidebar button {
      background: none;
      border: none;
      color: #fff;
      margin: 10px 0;
      cursor: pointer;
      font-size: 12px;
    }

    /* LEFT PANELS */
    .panel-container {
      width: 260px;
      background: #fff;
      border-right: 1px solid #ddd;
      display: none;
      flex-direction: column;
    }

    .panel-container.open {
      display: flex;
    }

    .panel {
      padding: 12px;
    }

    /* MAIN CANVAS */
    .editor-main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #eaeaea;
    }

    #canvas-wrapper {
      background: #fff;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,.2);
    }

    /* RIGHT EXPORT PANEL */
    .export-panel {
      width: 0;
      overflow: hidden;
      background: #fff;
      border-left: 1px solid #ddd;
      transition: width .25s ease;
    }

    .export-panel.open {
      width: 260px;
      padding: 12px;
    }

    /* TOP BAR */
    .topbar {
      position: fixed;
      top: 0;
      left: 70px;
      right: 0;
      height: 50px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      z-index: 10;
    }

    .topbar button {
      margin-left: 10px;
    }
  </style>
</head>

<body>

  <!-- LEFT ICON BAR -->
  <div class="sidebar">
    <button data-panel="elements">Στοιχεία</button>
    <button data-panel="text">Κείμενο</button>
    <button data-panel="images">Εικόνες</button>
    <button data-panel="pdf">PDF</button>
    <button data-panel="layers">Layers</button>
  </div>

  <!-- LEFT PANELS -->
  <div id="panel-elements" class="panel-container">
    <div class="panel">📐 Σχήματα / Stickers (coming)</div>
  </div>

  <div id="panel-text" class="panel-container">
    <div class="panel">🔤 Προσθήκη Κειμένου</div>
  </div>

  <div id="panel-images" class="panel-container">
    <div class="panel">
      🖼️ Εισαγωγή Εικόνας  
      <input type="file" id="imageInput" accept="image/*" />
    </div>
  </div>

  <div id="panel-pdf" class="panel-container">
    <div class="panel">
      📄 Εισαγωγή PDF  
      <input type="file" id="pdfInput" accept="application/pdf" />
    </div>
  </div>

  <div id="panel-layers" class="panel-container">
    <div class="panel">🧱 Layers (coming)</div>
  </div>

  <!-- MAIN -->
  <div class="editor-main">
    <div id="canvas-wrapper">
      <canvas id="editorCanvas" width="900" height="600"></canvas>
    </div>
  </div>

  <!-- RIGHT EXPORT PANEL -->
  <div id="exportPanel" class="export-panel">
    <h3>📤 Export</h3>
    <button id="exportPNG">PNG</button><br><br>
    <button id="exportPDF">PDF</button><br><br>
    <button id="exportFlipbook">Flipbook</button>
  </div>

  <!-- TOP BAR -->
  <div class="topbar">
    <div>
      <strong>Photobook Editor</strong>
    </div>
    <div>
      <button id="toggleExport">Export</button>
      <button id="loginBtn">Σύνδεση</button>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script type="module" src="./js/core.js"></script>
  <script type="module" src="./js/ui.js"></script>
  <script type="module" src="./js/export.js"></script>

</body>
</html>
