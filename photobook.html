<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <title>Photobook Editor</title>

  <link rel="stylesheet" href="./css/photobook.css" />
  <link rel="stylesheet" href="css/app.css">


  <!-- FABRIC -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
</head>
<body>

  <!-- TOP BAR -->
 <div id="app">

    <!-- LEFT SIDEBAR -->
    <aside id="leftSidebar">
      <button data-panel="text">Text</button>
      <button data-panel="image">Image</button>
      <button data-panel="shapes">Shapes</button>
      <button data-panel="stickers">Stickers</button>
    </aside>

    <!-- LEFT PANELS -->
    <div id="leftPanels">
      <div id="panel-text" class="panel">Text panel</div>
      <div id="panel-image" class="panel">Image panel</div>
      <div id="panel-shapes" class="panel">Shapes panel</div>
      <div id="panel-stickers" class="panel">Stickers panel</div>
    </div>

    <!-- MAIN WORKSPACE -->
    <main id="workspace">

  <!-- CANVAS -->
  <div id="canvasHost">
    <canvas id="canvas"></canvas>
  </div>
       
  <script type="module" src="js/sidebar.js"></script>

  <!-- SCRIPTS -->
  <script type="module" src="./js/core.js"></script>
  <script type="module" src="./js/ui.js"></script>
  <script src="js/sidebar.js" type="module"></script>

</body>
</html>
