<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Photobook Editor</title>
  <link rel="stylesheet" href="./css/app.css" />
  <link rel="stylesheet" href="./css/photobook.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>if (window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9999}
    .modal.open{display:flex}
    .modal-inner{width:min(1100px,94vw);height:min(760px,92vh);background:var(--panel,#111);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;}
    .modal-body{flex:1;position:relative;background:#000}
    .modal-body iframe{width:100%;height:100%;border:none}
    .export-group{display:flex;align-items:center;gap:8px;margin-right:10px}
    .btn-export{background:#22c55e;color:white;border:none;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;}
  </style>
</head>
<body class="theme-dark">
  <header class="topbar">
    <div class="topbar-left">
      <span class="brand">Photobook Studio</span>
    </div>
    <div class="topbar-right">
      <div class="export-group">
        <button class="btn-export" id="exportPdfBtn">PDF</button>
        <button class="btn-export" id="exportFlipBtn">Flipbook</button>
        <button class="btn-export" id="exportPngBtn">PNG</button>
        <button class="btn-export" id="exportJpgBtn">JPG</button>
      </div>
      <div class="divider-v"></div>
      <button class="btn-login" id="themeToggleBtn">☀️</button>
    </div>
  </header>

  <div class="appShell">
    <aside class="leftRail">
      <button class="railbtn active" data-panel="pages">📄</button>
      <button class="railbtn" data-panel="images">🖼️</button>
      <button class="railbtn" data-panel="text">T</button>
      <button class="railbtn" data-panel="shapes">⭐</button>
      <button class="railbtn" data-panel="colors">🎨</button>
      <div style="margin-top:auto"></div>
      <button class="railbtn" id="clearDraftBtn">🗑️</button>
    </aside>

    <aside class="leftPanel" id="leftPanel">
      <div class="panelHead"><span id="panelTitle">Σελίδες</span></div>
      <div class="panelView" data-view="pages">
        <button class="btn primary" id="addPageBtn" style="width:100%">+ Νέα Σελίδα</button>
        <div class="grid2" style="margin:10px 0"><button class="btn ghost" id="dupPageBtn">Αντιγραφή</button><button class="btn ghost" id="delPageBtn">Διαγραφή</button></div>
        <div class="thumbStrip" id="thumbStrip"></div>
      </div>
      </aside>

    <main class="canvasArea">
      <div class="canvasToolbar">
        <div class="zoomGroup">
          <button class="toolBtn" id="zoomOutBtn">−</button>
          <span id="zoomValue">100%</span>
          <button class="toolBtn" id="zoomInBtn">+</button>
          <button class="toolBtn" id="fitScreenBtn">Fit</button>
        </div>
        <div class="divider-v"></div>
        <select id="pageSizeSelect" class="selectSm">
          <option value="A4P">A4 Κάθετο</option>
          <option value="A4L">A4 Οριζόντιο</option>
          <option value="SQUARE">Τετράγωνο (20x20)</option>
          <option value="LAND32">Φωτογραφία (3:2)</option>
        </select>
        <div class="divider-v"></div>
        <div class="pageNav">
          <button class="toolBtn" id="prevPageBtn">←</button>
          <span id="pageInfo">1 / 1</span>
          <button class="toolBtn" id="nextPageBtn">→</button>
        </div>
      </div>
      <div class="canvasHost" id="canvasHost"><canvas id="canvas"></canvas></div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
  <script type="module" src="./js/core.js"></script>
  <script type="module" src="./js/ui.js"></script>
  <script src="./js/sidebar.js"></script>

  <div class="modal" id="flipPreviewModal">
    <div class="modal-inner">
      <div class="modal-head"><span>Προεπισκόπηση Flipbook</span><button class="closeBtn" id="closeFlipModalBtn">&times;</button></div>
      <div class="modal-body"><iframe id="flipPreviewFrame"></iframe></div>
    </div>
  </div>
</body>
</html>
