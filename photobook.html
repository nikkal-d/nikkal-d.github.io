<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <title>Photobook Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fabric -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      overflow: hidden;
      background: #f0f0f0;
    }

    /* LEFT ICON BAR */
    .sidebar {
      width: 70px;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
    }

    .sidebar button {
      background: none;
      border: none;
      color: #fff;
      margin: 10px 0;
      cursor: pointer;
      font-size: 11px;
    }

    /* LEFT PANELS */
    .panel-container {
      width: 260px;
      background: #fff;
      border-right: 1px solid #ddd;
      display: none;
      flex-direction: column;
    }

    .panel-container.open {
      display: flex;
    }

    .panel {
      padding: 15px;
      border-bottom: 1px solid #eee;
    }

    /* MAIN */
    .editor-main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e5e5e5;
    }

    #canvas-wrapper {
      background: white;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,.2);
    }

    /* RIGHT EXPORT PANEL */
    .export-panel {
      width: 0;
      overflow: hidden;
      background: #fff;
      border-left: 1px solid #ddd;
      transition: width .3s ease;
    }

    .export-panel.open {
      width: 260px;
      padding: 15px;
    }

    /* TOP BAR */
    .topbar {
      position: fixed;
      top: 0;
      left: 70px;
      right: 0;
      height: 50px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
      z-index: 100;
    }
  </style>
</head>

<body>

<!-- LEFT ICON BAR -->
<div class="sidebar">
  <button data-panel="elements">Στοιχεία</button>
  <button data-panel="text">Κείμενο</button>
  <button data-panel="images">Εικόνες</button>
  <button data-panel="pdf">PDF</button>
  <button data-panel="layers">Layers</button>
</div>

<!-- LEFT PANELS -->
<div id="panel-elements" class="panel-container">
  <div class="panel">📐 Σχήματα / Stickers (next)</div>
</div>

<div id="panel-text" class="panel-container">
  <div class="panel">
    <button id="addText">➕ Κείμενο</button>
  </div>
</div>

<div id="panel-images" class="panel-container">
  <div class="panel">
    <input type="file" id="imageInput" accept="image/*">
  </div>
</div>

<div id="panel-pdf" class="panel-container">
  <div class="panel">
    <input type="file" id="pdfInput" accept="application/pdf">
  </div>
</div>

<div id="panel-layers" class="panel-container">
  <div class="panel">🧱 Layers (coming)</div>
</div>

<!-- MAIN -->
<div class="editor-main">
  <div id="canvas-wrapper">
    <canvas id="editorCanvas" width="1200" height="800"></canvas>
  </div>
</div>

<!-- RIGHT EXPORT -->
<div id="exportPanel" class="export-panel">
  <h3>📤 Export</h3>
  <button>PNG</button><br><br>
  <button>PDF</button><br><br>
  <button>Flipbook</button>
</div>

<!-- TOP BAR -->
<div class="topbar">
  <strong>Photobook Editor</strong>
  <div>
    <button id="toggleExport">Export</button>
    <button id="loginBtn">Σύνδεση</button>
  </div>
</div>

<script>
  const canvas = new fabric.Canvas('editorCanvas');

  // left panels toggle
  document.querySelectorAll('.sidebar button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.panel-container').forEach(p => p.classList.remove('open'));
      const panel = document.getElementById('panel-' + btn.dataset.panel);
      panel?.classList.add('open');
    };
  });

  // export panel toggle
  document.getElementById('toggleExport').onclick = () => {
    document.getElementById('exportPanel').classList.toggle('open');
  };

  // add text
  document.getElementById('addText').onclick = () => {
    const text = new fabric.IText('Κείμενο', {
      left: 100,
      top: 100,
      fontSize: 40,
      fill: '#000',
      textBaseline: 'top'
    });
    canvas.add(text);
  };

  // add image
  document.getElementById('imageInput').onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = f => {
      fabric.Image.fromURL(f.target.result, img => {
        img.scaleToWidth(400);
        canvas.add(img);
      });
    };
    reader.readAsDataURL(file);
  };
</script>

</body>
</html>
