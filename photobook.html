<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <title>Photobook Editor</title>

  <link rel="stylesheet" href="./css/photobook.css" />

  <!-- FABRIC -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
</head>
<body>

  <!-- TOP BAR -->
  <div class="topbar">
    <button id="addTextBtn">Text</button>
    <button id="addImageBtn">Image</button>

    <button id="zoomInBtn">＋</button>
    <button id="zoomOutBtn">－</button>
    <button id="zoomResetBtn">100%</button>

    <input type="file" id="imageInput" accept="image/*" hidden />
  </div>

  <!-- CANVAS -->
  <div id="canvasHost">
    <canvas id="canvas"></canvas>
  </div>

  <div id="leftSidebar" class="sidebar">
  <button data-panel="text">Text</button>
  <button data-panel="image">Image</button>
  <button data-panel="shapes">Shapes</button>
  <button data-panel="stickers">Stickers</button>
</div>

<div id="panel-text" class="panel">Text panel</div>
<div id="panel-image" class="panel">Image panel</div>
<div id="panel-shapes" class="panel">Shapes panel</div>
<div id="panel-stickers" class="panel">Stickers panel</div>


  <!-- SCRIPTS -->
  <script type="module" src="./js/core.js"></script>
  <script type="module" src="./js/ui.js"></script>
</body>
</html>
