<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FindMyDuplicates</title>

<style>
body {
  font-family: "Poppins", Arial, sans-serif;
  margin: 0;
  padding: 0;
  background: #fff;
  color: #222;
}
header {
  background: #ff9800;
  color: #fff;
  text-align: center;
  font-size: 1.8em;
  padding: 20px;
  font-weight: bold;
}
main {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  padding: 20px;
}
section {
  flex: 1;
  min-width: 45%;
  background: #f9f9f9;
  margin: 10px;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}
textarea {
  width: 100%;
  height: 150px;
  border-radius: 8px;
  border: 1px solid #ccc;
  padding: 10px;
  font-size: 1em;
  resize: vertical;
}
button, select {
  background: #ff9800;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 10px 16px;
  margin: 10px 5px;
  font-size: 1em;
  cursor: pointer;
}
button:hover { background: #e68900; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.95em;
  margin-top: 10px;
}
th, td {
  border: 1px solid #ccc;
  padding: 8px;
}
.dup {
  text-decoration: underline;
  text-decoration-color: red;
  text-decoration-thickness: 2px;
}
footer {
  text-align: center;
  background: #111;
  color: #fff;
  padding: 12px;
  margin-top: 40px;
  font-size: 0.9em;

  body.dark {
  background: #121212;
  color: #eee;
}
body.dark header {
  background: #333;
  color: #ff9800;
}
body.dark section {
  background: #1e1e1e;
  box-shadow: 0 2px 6px rgba(255,255,255,0.05);
}
body.dark table, body.dark th, body.dark td {
  border-color: #444;
}
body.dark button, body.dark select {
  background: #ff9800;
  color: #fff;
}
body.dark footer {
  background: #000;
}

}

/* ------------------- Αισθητικές βελτιώσεις ------------------- */
body {
  transition: background 0.3s ease, color 0.3s ease;
}

header {
  letter-spacing: 1px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.15);
}

button, select {
  transition: background 0.25s ease, transform 0.1s ease;
}

button:hover, select:hover {
  transform: scale(1.03);
}

textarea {
  transition: box-shadow 0.2s ease;
}
textarea:focus {
  outline: none;
  box-shadow: 0 0 5px 2px rgba(255,152,0,0.4);
}

section {
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
section:hover {
  transform: translateY(-3px);
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

/* Fade-in effect όταν φορτώνουν τα αποτελέσματα */
.fade-in {
  opacity: 0;
  animation: fadeIn 0.8s forwards;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Καλύτερο spacing στα dropdowns */
#downloadMenu button:hover {
  background: rgba(255,152,0,0.1);
  border-radius: 6px;
}

</style>
</head>

<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PZ2ZH59T"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<header>FindMyDuplicates</header>

  <div style="text-align:right;margin:10px 20px;">
  <button id="themeToggle" onclick="toggleTheme()">🌙 / ☀️</button>
  <select id="langSelect" onchange="switchLanguage(this.value)">
    <option value="el">🇬🇷 EL</option>
    <option value="en">🇬🇧 EN</option>
  </select>
</div>



<div style="text-align:center;margin:15px;">
  <textarea id="inputList" placeholder="Επικόλλησε δεδομένα από Excel ή CSV..."></textarea><br>
  <label for="columnSelect">Έλεγχος διπλοτύπων στη στήλη:</label>
  <select id="columnSelect"><option value="">-- επιλέξτε --</option></select>
  <button onclick="processData()">Ανάλυση</button>
</div>

  <!-- κουμπί Κατέβασε με dropdown -->
<div class="dropdown" style="text-align:center;">
  <button id="downloadBtn" onclick="toggleDownloadMenu()">⬇️ Κατέβασε</button>
  <div id="downloadMenu" style="
    display:none;
    position:absolute;
    background:#fff;
    border:1px solid #ccc;
    border-radius:8px;
    margin-top:5px;
    padding:5px;
    text-align:left;
    box-shadow:0 2px 6px rgba(0,0,0,0.2);
  ">
    <button onclick="downloadList('unique')" style="display:block;width:100%;border:none;background:none;padding:6px;cursor:pointer;">Χωρίς διπλότυπα</button>
    <button onclick="downloadList('duplicates')" style="display:block;width:100%;border:none;background:none;padding:6px;cursor:pointer;">Μόνο τα διπλότυπα</button>
  </div>
</div>


<main>
  <section>
    <h3>Δεδομένα</h3>
    <table id="dataTable"><thead></thead><tbody></tbody></table>
  </section>
  <section>
    <h3>Αναφορές διπλοτύπων</h3>
    <div id="duplicatesList" style="white-space:pre-line;"></div>
  </section>
</main>

<footer>© 2025 FindMyDuplicates | Built by Niki Kalantzi</footer>

<script>
let tableData = [];

function processData() {
  const text = document.getElementById("inputList").value.trim();
  if (!text) return alert("Επικόλλησε πρώτα δεδομένα!");

  // Ανίχνευση tabs ή κόμματα (Excel, CSV)
  const rows = text.split(/\r?\n/).map(r => r.split(/\t|,/));
  tableData = rows.filter(r => r.some(cell => cell.trim() !== ""));
  renderTable(tableData);

  // Γέμισμα dropdown για επιλογή στήλης
  const colSelect = document.getElementById("columnSelect");
  colSelect.innerHTML = '<option value="">-- επιλέξτε --</option>';
  if (tableData[0]) {
    tableData[0].forEach((_, i) => {
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = "Στήλη " + (i + 1);
      colSelect.appendChild(opt);
    });
    document.querySelectorAll("section").forEach(s => s.classList.add("fade-in"));

  }

  document.getElementById("duplicatesList").textContent = "";
}

function renderTable(data) {
  const table = document.getElementById("dataTable");
  const head = table.querySelector("thead");
  const body = table.querySelector("tbody");
  head.innerHTML = "";
  body.innerHTML = "";
  if (!data.length) return;

  // Επικεφαλίδες
  const header = document.createElement("tr");
  data[0].forEach((_, i) => {
    const th = document.createElement("th");
    th.textContent = "Στήλη " + (i + 1);
    header.appendChild(th);
  });
  head.appendChild(header);

  // Σώμα
  data.forEach((row) => {
    const tr = document.createElement("tr");
    row.forEach((cell) => {
      const td = document.createElement("td");
      td.textContent = cell;
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
}

// Ανίχνευση διπλοτύπων στη στήλη που επέλεξε ο χρήστης
document.getElementById("columnSelect").addEventListener("change", () => {
  const col = document.getElementById("columnSelect").value;
  if (col === "") return;
  const seen = {};
  const dups = [];
  const bodyRows = document.querySelectorAll("#dataTable tbody tr");
  bodyRows.forEach((tr, rowIndex) => {
    const cell = tr.children[col];
    if (!cell) return;
    const val = cell.textContent.trim();
    if (val) {
      if (seen[val]) {
        dups.push([seen[val], rowIndex]);
        cell.classList.add("dup");
        bodyRows[seen[val]].children[col].classList.add("dup");
      } else {
        seen[val] = rowIndex;
      }
    }
  });

  // Αναφορές δεξιά
  const dupDiv = document.getElementById("duplicatesList");
  dupDiv.textContent = "";
  if (dups.length === 0) dupDiv.textContent = "✅ Δεν βρέθηκαν διπλότυπα.";
  else {
    dupDiv.textContent = dups
      .map(d => `🔴 Η σειρά ${d[0] + 1} με τη σειρά ${d[1] + 1} είναι ίδιες.`)
      .join("\n");
  }
});
  // ----- Διγλωσσία EN/EL -----
const translations = {
  el: {
    header: "FindMyDuplicates",
    textareaPlaceholder: "Επικόλλησε δεδομένα από Excel ή CSV...",
    columnLabel: "Έλεγχος διπλοτύπων στη στήλη:",
    analyzeBtn: "Ανάλυση",
    downloadBtn: "Κατέβασε",
    noDuplicates: "✅ Δεν βρέθηκαν διπλότυπα.",
    footer: "© 2025 FindMyDuplicates | Built by Niki Kalantzi"
  },
  en: {
    header: "FindMyDuplicates",
    textareaPlaceholder: "Paste data from Excel or CSV...",
    columnLabel: "Check duplicates in column:",
    analyzeBtn: "Analyze",
    downloadBtn: "Download",
    noDuplicates: "✅ No duplicates found.",
    footer: "© 2025 FindMyDuplicates | Built by Niki Kalantzi"
  }
};

function switchLanguage(lang) {
  const t = translations[lang];
  if(!t) return;

  document.querySelector("header").textContent = t.header;
  document.getElementById("inputList").placeholder = t.textareaPlaceholder;
  document.querySelector("label[for='columnSelect']").textContent = t.columnLabel;
  document.querySelector("button[onclick='processData()']").textContent = t.analyzeBtn;
  document.getElementById("downloadBtn").textContent = "⬇️ " + t.downloadBtn;
  document.querySelector("footer").textContent = t.footer;

  localStorage.setItem("lang", lang);
}

// Εφαρμογή αποθηκευμένης γλώσσας στην εκκίνηση
window.addEventListener("DOMContentLoaded", ()=>{
  const savedLang = localStorage.getItem("lang") || "el";
  document.getElementById("langSelect").value = savedLang;
  switchLanguage(savedLang);
});

</script>
</body>
</html>
