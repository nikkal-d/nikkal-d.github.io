<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <title>Photobook Editor</title>

  <!-- FABRIC -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      overflow: hidden;
    }

    #topbar {
      height: 56px;
      background: #1e1e1e;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
    }

    button {
      background: #2b2b2b;
      color: #fff;
      border: 0;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #3a3a3a;
    }

    #workspace {
      display: flex;
      height: calc(100vh - 56px);
    }

    #canvasHost {
      flex: 1;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      background: white;
      box-shadow: 0 0 20px rgba(0,0,0,.5);
    }

    #zoomValue {
      min-width: 60px;
      text-align: center;
    }
  </style>
</head>

<body>

<!-- ================= TOP BAR ================= -->
<div id="topbar">
  <button id="addImageBtn">🖼 Image</button>
  <button id="addTextBtn">✏️ Text</button>
  <button id="emojiBtn">😀 Emoji</button>

  <span style="margin-left:20px">Zoom:</span>
  <button id="zoomOutBtn">−</button>
  <span id="zoomValue">100%</span>
  <button id="zoomInBtn">+</button>
  <button id="zoomResetBtn">Reset</button>
</div>

<!-- ================= WORKSPACE ================= -->
<div id="workspace">
  <div id="canvasHost">
    <canvas id="canvas" width="1240" height="1754"></canvas>
  </div>
</div>

<!-- hidden file input -->
<input type="file" id="imageInput" accept="image/*" style="display:none">

<script>
/* ======================================================
   CANVAS INIT (SAFE)
====================================================== */
const canvas = new fabric.Canvas("canvas", {
  preserveObjectStacking: true,
  selection: true
});
window.canvas = canvas;

/* FIX alphabetical forever */
fabric.Textbox.prototype.textBaseline = "top";
fabric.IText.prototype.textBaseline = "top";

/* ======================================================
   ZOOM
====================================================== */
let zoom = 1;

function updateZoom() {
  document.getElementById("zoomValue").textContent =
    Math.round(zoom * 100) + "%";
}

function setZoom(z) {
  zoom = Math.min(4, Math.max(0.2, z));
  const center = new fabric.Point(
    canvas.getWidth() / 2,
    canvas.getHeight() / 2
  );
  canvas.zoomToPoint(center, zoom);
  canvas.requestRenderAll();
  updateZoom();
}

document.getElementById("zoomInBtn").onclick = () => setZoom(zoom + 0.1);
document.getElementById("zoomOutBtn").onclick = () => setZoom(zoom - 0.1);
document.getElementById("zoomResetBtn").onclick = () => setZoom(1);
updateZoom();

/* ======================================================
   IMAGE
====================================================== */
document.getElementById("addImageBtn").onclick = () => {
  document.getElementById("imageInput").click();
};

document.getElementById("imageInput").onchange = e => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    fabric.Image.fromURL(reader.result, img => {
      img.scaleToWidth(canvas.getWidth() * 0.4);
      img.set({ left: 100, top: 100 });
      canvas.add(img);
      canvas.setActiveObject(img);
    });
  };
  reader.readAsDataURL(file);
};

/* ======================================================
   TEXT
====================================================== */
function addText() {
  const t = new fabric.Textbox("Text", {
    left: 150,
    top: 150,
    fontSize: 40,
    fill: "#000",
    textBaseline: "top"
  });
  canvas.add(t);
  canvas.setActiveObject(t);
}

document.getElementById("addTextBtn").onclick = addText;

/* ======================================================
   EMOJI
====================================================== */
document.getElementById("emojiBtn").onclick = () => {
  const e = new fabric.Textbox("😀", {
    left: 200,
    top: 200,
    fontSize: 80,
    textBaseline: "top"
  });
  canvas.add(e);
  canvas.setActiveObject(e);
};
</script>

</body>
</html>
