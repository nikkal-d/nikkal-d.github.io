<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Photobook Editor</title>

<!-- Fabric.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

<style>
/* ================= RESET ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

/* ================= ROOT ================= */
body{
  height:100vh;
  display:flex;
  flex-direction:column;
  background:#f4f4f4;
  overflow:hidden;
}

/* ================= TOP BAR ================= */
.topbar{
  height:50px;
  background:#222;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  flex-shrink:0;
}

.topbar .left,
.topbar .right{
  display:flex;
  align-items:center;
  gap:6px;
}

.topbar button{
  background:#333;
  color:#fff;
  border:none;
  padding:6px 10px;
  cursor:pointer;
  border-radius:4px;
}

.topbar button:hover{
  background:#444;
}

/* ================= EDITOR ================= */
.editor{
  flex:1;
  display:flex;
  overflow:hidden;
}

/* ================= PANELS ================= */
.sidebar{
  width:250px;
  background:#fff;
  border-right:1px solid #ddd;
  padding:10px;
  overflow:auto;
  flex-shrink:0;
}

.rightbar{
  width:280px;
  background:#fff;
  border-left:1px solid #ddd;
  padding:10px;
  overflow:auto;
  flex-shrink:0;
}

.sidebar.hidden,
.rightbar.hidden{
  display:none;
}

.sidebar h3,
.rightbar h3{
  margin-bottom:10px;
}

/* ================= CANVAS AREA ================= */
.canvasArea{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:auto;
  background:#e6e6e6;
  position:relative;
}

.canvasWrap{
  margin:auto;
  padding:40px;
}

canvas{
  background:#fff;
  border:1px solid #bbb;
}

/* ================= BUTTONS ================= */
.tool-btn{
  width:100%;
  padding:8px;
  margin-bottom:8px;
  border:1px solid #ddd;
  background:#fafafa;
  cursor:pointer;
  border-radius:4px;
  text-align:left;
}

.tool-btn:hover{
  background:#f0f0f0;
}

/* ================= DARK MODE (ready) ================= */
body.dark{
  background:#1e1e1e;
}

body.dark .sidebar,
body.dark .rightbar{
  background:#2a2a2a;
  color:#fff;
}

body.dark canvas{
  background:#fff;
}
</style>
</head>

<body>

<!-- ================= TOP BAR ================= -->
<div class="topbar">
  <div class="left">
    <button id="toggleLeft">☰</button>
    <button id="toggleLang">EL / EN</button>
  </div>

  <div class="right">
    <button id="zoomOut">−</button>
    <button id="zoomReset">100%</button>
    <button id="zoomIn">+</button>
    <button id="toggleRight" data-i18n="export">Export</button>
    <button id="loginBtn" data-i18n="login">Σύνδεση</button>
  </div>
</div>

<!-- ================= EDITOR ================= -->
<div class="editor">

  <!-- LEFT PANEL -->
  <div class="sidebar" id="leftPanel">
    <h3 data-i18n="tools">Εργαλεία</h3>

    <button class="tool-btn" data-i18n="images">🖼️ Εικόνες</button>
    <button class="tool-btn" data-i18n="text">🔤 Κείμενο</button>
    <button class="tool-btn" data-i18n="shapes">⬛ Σχήματα</button>
    <button class="tool-btn" data-i18n="stickers">😀 Stickers</button>
    <button class="tool-btn" data-i18n="pages">📄 Σελίδες</button>
  </div>

  <!-- CANVAS -->
  <div class="canvasArea">
    <div class="canvasWrap">
      <canvas id="editorCanvas" width="1000" height="700"></canvas>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="rightbar hidden" id="rightPanel">
    <h3 data-i18n="export">Export</h3>
    <button class="tool-btn">PNG</button>
    <button class="tool-btn">PDF</button>
    <button class="tool-btn">Flipbook</button>
    <button class="tool-btn">Cloud</button>
  </div>

</div>
<script>
/* ================= CANVAS INIT ================= */
const canvas = new fabric.Canvas("editorCanvas", {
  preserveObjectStacking: true,
  selection: true
});

/* ⚠️ FIX for CanvasTextBaseline warning */
fabric.Textbox.prototype.textBaseline = "alphabetic";

/* ================= ZOOM ================= */
let zoom = 1;
const ZOOM_STEP = 0.1;
const MIN_ZOOM = 0.2;
const MAX_ZOOM = 4;

function setZoom(value){
  zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, value));
  const center = canvas.getCenter();
  canvas.zoomToPoint(
    new fabric.Point(center.left, center.top),
    zoom
  );
}

document.getElementById("zoomIn").onclick = () => setZoom(zoom + ZOOM_STEP);
document.getElementById("zoomOut").onclick = () => setZoom(zoom - ZOOM_STEP);
document.getElementById("zoomReset").onclick = () => {
  zoom = 1;
  canvas.setViewportTransform([1,0,0,1,0,0]);
};

/* Mouse wheel zoom */
canvas.on("mouse:wheel", opt => {
  const delta = opt.e.deltaY;
  setZoom(zoom + (delta > 0 ? -ZOOM_STEP : ZOOM_STEP));
  opt.e.preventDefault();
  opt.e.stopPropagation();
});

/* ================= PAN (SPACE) ================= */
let isPanning = false;

document.addEventListener("keydown", e => {
  if (e.code === "Space") {
    isPanning = true;
    canvas.selection = false;
  }
});

document.addEventListener("keyup", e => {
  if (e.code === "Space") {
    isPanning = false;
    canvas.selection = true;
  }
});

canvas.on("mouse:down", opt => {
  if (isPanning) {
    canvas.isDragging = true;
    canvas.lastPosX = opt.e.clientX;
    canvas.lastPosY = opt.e.clientY;
  }
});

canvas.on("mouse:move", opt => {
  if (canvas.isDragging) {
    const vpt = canvas.viewportTransform;
    vpt[4] += opt.e.clientX - canvas.lastPosX;
    vpt[5] += opt.e.clientY - canvas.lastPosY;
    canvas.requestRenderAll();
    canvas.lastPosX = opt.e.clientX;
    canvas.lastPosY = opt.e.clientY;
  }
});

canvas.on("mouse:up", () => {
  canvas.isDragging = false;
});

/* ================= PANELS ================= */
const leftPanel = document.getElementById("leftPanel");
const rightPanel = document.getElementById("rightPanel");

document.getElementById("toggleLeft").onclick = () => {
  leftPanel.classList.toggle("hidden");
};

document.getElementById("toggleRight").onclick = () => {
  rightPanel.classList.toggle("hidden");
};

/* ================= I18N ================= */
let lang = "el";

const i18n = {
  el: {
    login: "Σύνδεση",
    export: "Εξαγωγή",
    tools: "Εργαλεία",
    images: "Εικόνες",
    text: "Κείμενο",
    shapes: "Σχήματα",
    stickers: "Stickers",
    pages: "Σελίδες"
  },
  en: {
    login: "Login",
    export: "Export",
    tools: "Tools",
    images: "Images",
    text: "Text",
    shapes: "Shapes",
    stickers: "Stickers",
    pages: "Pages"
  }
};

function applyLanguage(){
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if (i18n[lang][key]) {
      el.textContent = i18n[lang][key];
    }
  });
}

document.getElementById("toggleLang").onclick = () => {
  lang = lang === "el" ? "en" : "el";
  applyLanguage();
};

applyLanguage();

/* ================= DEMO CONTENT ================= */
canvas.add(new fabric.Textbox("Photobook", {
  left: 200,
  top: 200,
  fontSize: 48,
  fill: "#222",
  textAlign: "center"
}));

</script>

</body>
</html>
