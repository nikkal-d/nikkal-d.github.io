<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Photobook Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Fabric -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

<style>
body{
  margin:0;
  background:#0f1115;
  color:#eee;
  font-family:system-ui,Arial;
  overflow:hidden;
}
#top{
  height:48px;
  background:#151823;
  display:flex;
  align-items:center;
  padding:0 12px;
}
#main{
  display:grid;
  grid-template-columns:260px 1fr;
  height:calc(100vh - 48px);
}
#left{
  background:#151823;
  padding:10px;
  border-right:1px solid #2a3147;
}
#stage{
  position:relative;
  background:#111;
}
#toolbar{
  height:46px;
  background:#1b2030;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
#canvasHost{
  position:absolute;
  inset:46px 0 0 0;
  display:flex;
  align-items:center;
  justify-content:center;
}
canvas{
  background:white;
  border-radius:8px;
}
button{
  background:#242b3e;
  color:white;
  border:1px solid #333;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}
button:hover{background:#2c3550}
</style>
</head>

<body>

<div id="top">📘 Photobook Studio</div>

<div id="main">
  <div id="left">
    <h3>Tools</h3>
    <button onclick="addText()">Text</button><br><br>
    <button onclick="addRect()">Rect</button><br><br>
    <button onclick="addImage()">Image</button><br><br>
    <input type="file" id="imageInput" accept="image/*" hidden>
  </div>

  <div id="stage">
    <div id="toolbar">
      <button onclick="zoomOut()">−</button>
      <span id="zoomLabel">100%</span>
      <button onclick="zoomIn()">+</button>
      <button onclick="fit()">Fit</button>
    </div>

    <div id="canvasHost">
      <canvas id="canvas"></canvas>
    </div>
  </div>
</div>

<script>
/* =======================
   CANVAS INIT
======================= */
const canvas = new fabric.Canvas("canvas",{selection:true});
canvas.setWidth(1240);
canvas.setHeight(1754);
canvas.setBackgroundColor("#fff",canvas.renderAll.bind(canvas));
canvas.setViewportTransform([1,0,0,1,0,0]);
canvas.setZoom(1);
console.log("✅ Canvas initialized");

/* =======================
   HELPERS
======================= */
function centerObj(obj){
  const c = canvas.getCenter();
  obj.set({
    left:c.left,
    top:c.top,
    originX:"center",
    originY:"center"
  });
}

/* =======================
   ADD OBJECTS
======================= */
function addText(){
  const t = new fabric.Textbox("Text",{
    fontSize:48,
    fill:"#111",
    fontFamily:"Arial",
    textBaseline:"alphabetic" // 👈 ΣΩΣΤΟ
  });
  centerObj(t);
  canvas.add(t);
  canvas.setActiveObject(t);
}

function addRect(){
  const r = new fabric.Rect({
    width:300,
    height:200,
    fill:"#111",
    stroke:"#fff",
    strokeWidth:2
  });
  centerObj(r);
  canvas.add(r);
}

function addImage(){
  document.getElementById("imageInput").click();
}

document.getElementById("imageInput").addEventListener("change",e=>{
  const f=e.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    fabric.Image.fromURL(r.result,img=>{
      const maxW=canvas.getWidth()*0.6;
      const maxH=canvas.getHeight()*0.6;
      const s=Math.min(maxW/img.width,maxH/img.height,1);
      img.scale(s);
      centerObj(img);
      canvas.add(img);
    });
  };
  r.readAsDataURL(f);
});

/* =======================
   ZOOM
======================= */
let zoom=1;
function updateZoom(){document.getElementById("zoomLabel").textContent=Math.round(zoom*100)+"%";}
function zoomIn(){zoom=Math.min(4,zoom+0.1);applyZoom();}
function zoomOut(){zoom=Math.max(0.2,zoom-0.1);applyZoom();}
function applyZoom(){
  const c=canvas.getCenter();
  canvas.zoomToPoint(new fabric.Point(c.left,c.top),zoom);
  updateZoom();
}
function fit(){
  const host=document.getElementById("canvasHost");
  const s=Math.min(
    host.clientWidth/canvas.getWidth(),
    host.clientHeight/canvas.getHeight()
  );
  zoom=s;
  canvas.setViewportTransform([1,0,0,1,0,0]);
  applyZoom();
}
fit();
</script>
</body>
</html>
