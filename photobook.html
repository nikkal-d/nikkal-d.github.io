<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<title>Photobook Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- HARD FIX: CanvasTextBaseline -->
<script>
(function () {
  const proto = CanvasRenderingContext2D.prototype;
  Object.defineProperty(proto, "textBaseline", {
    get() { return this.__tb || "top"; },
    set(v) { this.__tb = v === "alphabetical" ? "top" : v; }
  });
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<link rel="stylesheet" href="./css/photobook.css" />

<style>
body { margin:0; font-family:Inter, Arial; background:#f5f6f8; }
.topbar {
  height:48px; background:#fff; border-bottom:1px solid #ddd;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 12px;
}
.app { display:flex; height:calc(100vh - 48px); }

/* LEFT */
.sidebar {
  width:56px; background:#fff; border-right:1px solid #ddd;
  display:flex; flex-direction:column;
}
.sidebar button {
  height:56px; border:none; background:none; cursor:pointer;
}
.left-panels {
  width:0; overflow:hidden; background:#fff;
  border-right:1px solid #ddd; transition:.25s;
}
.left-panels.open { width:260px; }
.panel { display:none; padding:12px; }
.panel.active { display:block; }

/* CANVAS */
.canvas-area { flex:1; display:flex; flex-direction:column; align-items:center; }
#canvasHost {
  background:#999; flex:1; display:flex; align-items:center; justify-content:center;
  width:100%;
}
canvas { background:#fff; box-shadow:0 10px 30px rgba(0,0,0,.2); }

/* RIGHT EXPORT */
.export-panel {
  width:260px; background:#fff; border-left:1px solid #ddd;
  padding:12px;
}
.btn { padding:8px 10px; margin:4px 0; width:100%; }
.btn.primary { background:#6b5cff; color:#fff; border:none; }

.flip-preview {
  position:fixed; inset:0; background:rgba(0,0,0,.7);
  display:none; align-items:center; justify-content:center;
}
.flip-book {
  background:#fff; padding:20px; width:80%; height:80%;
}
</style>
</head>

<body>

<div class="topbar">
  <div>
    <button id="toggleExport" class="btn">
  📤 <span data-i18n="export">Εξαγωγή</span>
</button>
    <select id="canvasSize">
      <option value="a4">A4</option>
      <option value="a5">A5</option>
      <option value="square">Square</option>
      <option value="custom">Custom</option>
    </select>
    <button id="zoomIn">＋</button>
    <button id="zoomOut">－</button>
  </div>
  <div>
    <button id="undo">Undo</button>
    <button id="redo">Redo</button>
  </div>
</div>

<div class="app">

<!-- LEFT -->
<div class="sidebar">
  <button data-panel="images">🖼</button>
  <button data-panel="pdf">📄</button>
  <button data-panel="text">T</button>
  <button data-panel="shapes">▭</button>
  <button data-panel="layers">☰</button>
</div>

<div class="left-panels" id="leftPanels">
  <div class="panel" data-panel="images">
    <h3>Images</h3>
    <input type="file" id="imgInput" accept="image/*">
  </div>
  <div class="panel" data-panel="pdf">
    <h3>PDF</h3>
    <input type="file" id="pdfInput" accept="application/pdf">
  </div>
  <div class="panel" data-panel="text">
    <button id="addText">Add text</button>
  </div>
  <div class="panel" data-panel="shapes">
    <button id="rect">Rectangle</button>
    <button id="circle">Circle</button>
  </div>
  <div class="panel" data-panel="layers">
    <button id="bringFront">Bring front</button>
    <button id="sendBack">Send back</button>
  </div>
</div>

<!-- CANVAS -->
<div class="canvas-area">
  <div id="canvasHost">
    <canvas id="canvas" width="800" height="600"></canvas>
  </div>
</div>

<!-- EXPORT -->
<div class="export-panel">
  <h3>Export</h3>
  <button class="btn" id="expPNG">PNG</button>
  <button class="btn" id="expPDF">PDF</button>
  <button class="btn" id="expZIP">ZIP</button>
  <button class="btn" id="previewFlip">Flipbook preview</button>
  <button class="btn primary" id="cloudExport">Cloud export</button>
</div>

</div>

<!-- FLIPBOOK -->
<div class="flip-preview" id="flipPreview">
  <div class="flip-book">
    <button onclick="flipPreview.style.display='none'">Close</button>
    <div id="flipContent">Flipbook preview εδώ</div>
  </div>
</div>

<script>
/* UI TOGGLE */
const panels=document.querySelectorAll('.panel');
document.querySelectorAll('.sidebar button').forEach(b=>{
  b.onclick=()=>{
    const p=b.dataset.panel;
    const wrap=document.getElementById('leftPanels');
    const active=wrap.querySelector('.panel.active');
    if(active && active.dataset.panel===p){
      wrap.classList.remove('open'); active.classList.remove('active');
    } else {
      panels.forEach(x=>x.classList.remove('active'));
      wrap.classList.add('open');
      wrap.querySelector(`[data-panel="${p}"]`).classList.add('active');
    }
  }
});

/* CANVAS */
const canvas=new fabric.Canvas('canvas');
let zoom=1;

zoomIn.onclick=()=>{ zoom=Math.min(3,zoom+0.1); canvas.setZoom(zoom); }
zoomOut.onclick=()=>{ zoom=Math.max(0.3,zoom-0.1); canvas.setZoom(zoom); }

addText.onclick=()=>canvas.add(new fabric.IText("Text",{left:100,top:100}));
rect.onclick=()=>canvas.add(new fabric.Rect({width:120,height:80,fill:'#ddd'}));
circle.onclick=()=>canvas.add(new fabric.Circle({radius:50,fill:'#ddd'}));

bringFront.onclick=()=>canvas.getActiveObject()?.bringToFront();
sendBack.onclick=()=>canvas.getActiveObject()?.sendToBack();

/* FLIPBOOK */
previewFlip.onclick=()=>{
  document.getElementById('flipPreview').style.display='flex';
}

/* EXPORT MOCKS */
cloudExport.onclick=()=>alert("Cloud export (Firebase) – έτοιμο hook");
expPNG.onclick=()=>window.open(canvas.toDataURL());
</script>

</body>
</html>
