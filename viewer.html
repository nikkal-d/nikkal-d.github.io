<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Photobook Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/page-flip/dist/css/page-flip.css">
  <style>
    body {
      background:#020617;
      color:#e2e8f0;
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }
    header {
      padding:0.8rem 1.2rem;
      background:#0f172a;
      border-bottom:1px solid #1e293b;
      font-size:0.95rem;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    header a {
      color:#38bdf8;
      text-decoration:none;
      font-size:0.8rem;
    }
    main{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:1rem;
    }
    #flipbook{
      width:100%;
      max-width:900px;
      height:75vh;
    }
    .msg{
      text-align:center;
      color:#94a3b8;
      font-size:0.9rem;
    }
  </style>
</head>
<body>
<header>
  <div>📖 Photobook Viewer</div>
  <a href="projects.html">← Πίσω στα Projects</a>
</header>
<main>
  <div id="flipbook">Φόρτωση...</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
<script type="module">
  import { loadPhotobook } from "./loadFromFirebase.js";

  const params = new URLSearchParams(window.location.search);
  const bookId = params.get("id");
  const container = document.getElementById("flipbook");

  if (!bookId) {
    container.innerHTML = "<p class='msg'>❌ Δεν βρέθηκε ID στο URL.</p>";
  } else {
    initViewer();
  }

  async function initViewer() {
    try {
      const data = await loadPhotobook(bookId);

      if (!data.pages || data.pages.length === 0) {
        container.innerHTML = "<p class='msg'>Το βιβλίο είναι άδειο.</p>";
        return;
      }

      if (data.password) {
        const userPass = prompt("Αυτό το βιβλίο είναι προστατευμένο.\nΒάλε password για να συνεχίσεις:");
        if (!userPass || userPass !== data.password) {
          container.innerHTML = "<p class='msg'>❌ Λάθος ή κενό password.</p>";
          return;
        }
      }

      const root = document.createElement("div");
      container.innerHTML = "";
      container.appendChild(root);

      const flip = new St.PageFlip(root, {
        width:480,
        height:320,
        size:"stretch",
        maxShadowOpacity:0.3,
        showCover:false,
        mobileScrollSupport:true
      });

      const pages = data.pages.map(url => {
        const div = document.createElement("div");
        div.className = "page";
        div.innerHTML = `
          <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#020617;">
            <img src="${url}" style="max-width:100%;max-height:100%;border-radius:12px;">
          </div>`;
        return div;
      });

      flip.loadFromHTML(pages);
    } catch (err) {
      console.error(err);
      container.innerHTML = "<p class='msg'>⚠️ Σφάλμα φόρτωσης βιβλίου.</p>";
    }
  }
</script>
</body>
</html>
