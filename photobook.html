<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Photobook Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="css/photobook.css">

  <!-- Fabric.js -->
  <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

 <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.min.js"></script>
<script>
  const pdfjsLib = window["pdfjs-dist/build/pdf"];
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.worker.min.js";
</script>



</head>
<body>

  <!-- HEADER -->
  <header id="topbar">
  <div class="logo">
    <a href="index.html" style="text-decoration:none; color:inherit;">
      📘 Photobook Studio
    </a>
  </div>

  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="photobook.html" class="active">Photobook</a>
    <a href="duplicates.html">Find My Duplication</a>
    <a href="projects.html">My Photobooks</a>
  </nav>

  <div class="top-controls">
    <span id="user-label">Επισκέπτης</span>
    <button id="login-btn">Σύνδεση</button>
    <button id="logout-btn" style="display:none;">Αποσύνδεση</button>
    <button id="themeToggleBtn">☾</button>
  </div>
<div class="header-auth">
  <div id="userInfo"></div>

  <button id="openLoginBtn" class="btn btn-outline">
    Σύνδεση
  </button>

  <button id="logoutBtn" class="btn btn-outline" style="display:none;">
    Αποσύνδεση
  </button>
</div>
<button id="openRegisterBtn" class="btn btn-link">Εγγραφή</button>
    
</header>


  <!-- MAIN WRAPPER -->
  <div id="workspace">
<!-- ======= PHOTBOOK TOOLBAR ======= -->
<div id="editorToolbar" class="toolbar">

  <!-- FILE -->
  <div class="toolbar-group">
    <button class="tb-btn" id="btnNewPage">➕ Σελίδα</button>
    <button class="tb-btn" id="btnDeletePage">🗑️ Διαγραφή</button>

    <div class="divider"></div>

    <button class="tb-btn primary" id="exportCloudBtn">☁️ Cloud</button>
    <button class="tb-btn" id="exportPDFBtn">📄 PDF</button>
    <button class="tb-btn" id="exportImagesBtn">🖼 ZIP</button>
    <button class="tb-btn" id="exportFlipbookBtn">📘 Flipbook</button>
  </div>

  <!-- INSERT -->
  <div class="toolbar-group">
    <button class="tb-btn" id="btnUploadImage">🖼 Εικόνα</button>
    <button class="tb-btn" id="btnAddText">🔤 Κείμενο</button>
    <button class="tb-btn" id="btnAddShape">⬛ Σχήμα</button>
    <button class="tb-btn" id="btnStickers">✨ Stickers</button>
    <button class="tb-btn" id="btnTemplates">📚 Templates</button>
    <button class="tb-btn" id="btnUploadPDF">📑 PDF → Σελίδες</button>
  </div>

  <!-- EDITING -->
  <div class="toolbar-group">
    <button class="tb-btn" id="undoBtn">↶ Undo</button>
    <button class="tb-btn" id="redoBtn">↷ Redo</button>

    <div class="divider"></div>

    <button class="tb-btn" id="shadowBtn">🌗 Σκιά</button>
    <button class="tb-btn" id="filtersBtn">🎨 Φίλτρα</button>
    <button class="tb-btn" id="cropBtn">✂️ Περικοπή</button>
  </div>

  <!-- VIEW -->
  <div class="toolbar-group">
    <select id="pageSizeSelect" class="tb-select">
      <option value="A4">A4</option>
      <option value="Square">Square</option>
      <option value="Landscape">Landscape</option>
    </select>

    <button class="tb-btn" id="themeToggle">🌓 Theme</button>
  </div>

  <button id="cropBtn">✂️ Περικοπή</button>
<button id="cropOK" style="display:none; background:#28a745; color:#fff;">✔ Crop</button>
<button id="cropCancel" style="display:none; background:#c62828; color:#fff;">✖ Cancel</button>


</div>

    
<!-- ======= END TOOLBAR ======= -->

   
        </div>

       <div id="filtersPanel" class="panel hidden">
  <h3>🎨 Φίλτρα</h3>

  Φωτεινότητα
  <input type="range" id="fltBrightness" min="-1" max="1" step="0.05">

  Αντίθεση
  <input type="range" id="fltContrast" min="-1" max="1" step="0.05">

  Κορεσμός
  <input type="range" id="fltSaturation" min="-1" max="1" step="0.05">

  Blur
  <input type="range" id="fltBlur" min="0" max="1" step="0.02">

  <button id="fltGray">Grayscale</button>
  <button id="fltVintage">Vintage</button>
  <button id="fltRemove">Αφαίρεση φίλτρων</button>
</div>

        <!-- STICKERS -->
        <div id="stickersPanel" class="panel hidden">
  <h3>✨ Stickers</h3>

  <select id="stickerCategory">
    <option value="emojis">Emojis</option>
    <option value="shapes">Shapes</option>
    <option value="frames">Frames</option>
    <option value="fun">Fun</option>
  </select>

  <div id="stickerGrid" class="sticker-grid"></div>
</div>


        <!-- TEMPLATES -->
        <div id="templatesPanel" class="panel hidden">
  <h3>📚 Templates</h3>

  <select id="templateCategory">
    <option value="minimal">Minimal</option>
    <option value="wedding">Wedding</option>
    <option value="travel">Travel</option>
    <option value="kids">Kids</option>
  </select>

  <div id="templateGrid" class="template-grid"></div>
</div>


        <!-- EXPORT -->
        <div class="tab" id="tab-export">
          <button id="exportPdfBtn">📄 PDF</button>
          <button id="exportFlipbookBtn">📘 Flipbook</button>
          <button id="exportCloudBtn">☁ Cloud</button>
        </div>

      </div>
    </aside>

  

    <!-- CANVAS AREA -->
    <main id="canvas-area">
      <div id="canvas-wrapper">
        <canvas id="canvas"></canvas>
      </div>

      <div id="page-controls">
        <button id="prevPageBtn">‹</button>
        <span id="pageInfo">1 / 1</span>
        <button id="nextPageBtn">›</button>
      </div>
    </main>

    <!-- RIGHT THUMBNAILS -->
    <aside id="thumbs">
      <button id="addPageBtn">+ Σελίδα</button>
      <button id="deletePageBtn">✕</button>

      <h4>Σελίδες</h4>
      <div id="thumbnails"></div>
    </aside>

  </div>
  <script type="module">
import { exportToCloud, exportAsPDF, exportAsZip, exportAsFlipbook } from "./js/export.js";

// Μάζεμα σελίδων από canvas:
function collectPages() {
  return pages.map(p => p.image);
}

document.getElementById("exportCloudBtn").onclick = async () => {
  const pagesData = collectPages();
  const title = prompt("Τίτλος βιβλίου:");
  const pass = prompt("Κωδικός (προαιρετικός):");

  const id = await exportToCloud(pagesData, title, pass);
  if (id) alert("Το βιβλίο ανέβηκε!");
};

document.getElementById("exportPDFBtn").onclick = () => {
  exportAsPDF(collectPages());
};

document.getElementById("exportImagesBtn").onclick = () => {
  exportAsZip(collectPages());
};

document.getElementById("exportFlipbookBtn").onclick = () => {
  exportAsFlipbook(collectPages());
};
</script>

  

  <!-- JS Modules -->
  <script type="module" src="firebase-init.js"></script>
  <script type="module" src="js/core.js"></script>
  <script type="module" src="js/tools.js"></script>
  <script type="module" src="js/export.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="viewer.js"></script>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal">
  <div class="modal-dialog">
    <div class="modal-header">
      <h2>Σύνδεση</h2>
      <button class="close-modal" type="button">&times;</button>
    </div>
    <div class="modal-body">
      <form id="loginForm" class="auth-form">
        <label>
          Email
          <input type="email" name="email" required>
        </label>
        <label>
          Κωδικός
          <input type="password" name="password" required>
        </label>
        <button type="submit" class="btn btn-primary">Σύνδεση</button>
      </form>
      <p class="auth-switch">
        Δεν έχεις λογαριασμό;
        <button type="button" class="link-btn" id="switchToRegister">
          Εγγραφή
        </button>
      </p>
    </div>
  </div>
</div>

<!-- REGISTER MODAL -->
<div id="registerModal" class="modal">
  <div class="modal-dialog">
    <div class="modal-header">
      <h2>Εγγραφή</h2>
      <button class="close-modal" type="button">&times;</button>
    </div>
    <div class="modal-body">
      <form id="registerForm" class="auth-form">
        <label>
          Όνομα (προαιρετικό)
          <input type="text" name="name">
        </label>
        <label>
          Email
          <input type="email" name="email" required>
        </label>
        <label>
          Κωδικός
          <input type="password" name="password" required minlength="6">
        </label>
        <button type="submit" class="btn btn-primary">Εγγραφή</button>
      </form>
      <p class="auth-switch">
        Έχεις ήδη λογαριασμό;
        <button type="button" class="link-btn" id="switchToLogin">
          Σύνδεση
        </button>
      </p>
    </div>
  </div>
</div>


  <script type="module">
  import "./firebase-init.js";
  import "./js/auth.js";

  const loginModal = document.getElementById("loginModal");
  const registerModal = document.getElementById("registerModal");

  const switchToRegister = document.getElementById("switchToRegister");
  const switchToLogin = document.getElementById("switchToLogin");

  function showModal(el) { el?.classList.add("visible"); }
  function hideModal(el) { el?.classList.remove("visible"); }

  switchToRegister?.addEventListener("click", () => {
    hideModal(loginModal);
    showModal(registerModal);
  });

  switchToLogin?.addEventListener("click", () => {
    hideModal(registerModal);
    showModal(loginModal);
  });


import { applyFilter } from "./js/tools.js";

document.getElementById("filtersBtn").onclick = () => {
  document.getElementById("filtersPanel").classList.toggle("hidden");
};

document.getElementById("fltBrightness").oninput = (e) =>
  applyFilter("brightness", parseFloat(e.target.value));

document.getElementById("fltContrast").oninput = (e) =>
  applyFilter("contrast", parseFloat(e.target.value));

document.getElementById("fltSaturation").oninput = (e) =>
  applyFilter("saturation", parseFloat(e.target.value));

document.getElementById("fltBlur").oninput = (e) =>
  applyFilter("blur", parseFloat(e.target.value));

document.getElementById("fltGray").onclick = () => applyFilter("grayscale");
document.getElementById("fltVintage").onclick = () => applyFilter("vintage");
document.getElementById("fltRemove").onclick = () => applyFilter("remove");



    import { startCrop, applyCrop, cancelCrop } from "./js/tools.js";

document.getElementById("cropBtn").onclick = () => startCrop();
document.getElementById("cropOK").onclick = () => applyCrop();
document.getElementById("cropCancel").onclick = () => cancelCrop();


    import { loadStickers } from "./js/tools.js";

document.getElementById("btnStickers").onclick = () => {
  document.getElementById("stickersPanel").classList.toggle("hidden");
  loadStickers(document.getElementById("stickerCategory").value);
};

document.getElementById("stickerCategory").onchange = (e) => {
  loadStickers(e.target.value);
};


    import { loadTemplates } from "./js/tools.js";

document.getElementById("btnTemplates").onclick = () => {
  document.getElementById("templatesPanel").classList.toggle("hidden");
  loadTemplates(document.getElementById("templateCategory").value);
};

document.getElementById("templateCategory").onchange = (e) => {
  loadTemplates(e.target.value);
};


    
</script>
  

  

</body>
</html>
