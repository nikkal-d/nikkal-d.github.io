<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <title>Photobook Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ===============================
       HARD FIX — BLOCK alphabetical
       MUST be BEFORE fabric.min.js
       =============================== -->
  <script>
  (function () {
    const proto = CanvasRenderingContext2D.prototype;
    const desc = Object.getOwnPropertyDescriptor(proto, "textBaseline");

    Object.defineProperty(proto, "textBaseline", {
      get() {
        return this.___tb || "top";
      },
      set(v) {
        this.___tb = (v === "alphabetical") ? "top" : v;
        if (desc && desc.set) {
          try { desc.set.call(this, this.___tb); } catch {}
        }
      }
    });
  })();
  </script>

  <!-- ===============================
       FABRIC
       =============================== -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

  <!-- ===============================
       CSS
       =============================== -->
  <link rel="stylesheet" href="./css/photobook.css" />
</head>

<body>

<!-- =====================================================
     TOP BAR
===================================================== -->
<div class="topbar">
  <div class="top-actions">
    <button class="btn" id="btnPrevPage">◀</button>
    <span id="pageInfo">1 / 1</span>
    <button class="btn" id="btnNextPage">▶</button>
  </div>

  <div class="top-actions">
    <button class="btn" id="btnUndo">Undo</button>
    <button class="btn" id="btnRedo">Redo</button>
    <button class="btn" id="btnFit">Fit</button>
    <button class="btn primary" id="btnExport">Export</button>
  </div>
</div>

<!-- =====================================================
     APP LAYOUT
===================================================== -->
<div class="app">

  <!-- ===============================
       LEFT TOOLBAR
       =============================== -->
  <div class="sidebar">
    <button class="tb" id="toolImage" title="Image">🖼</button>
    <button class="tb" id="toolText" title="Text">T</button>
    <button class="tb" id="toolRect" title="Rectangle">▭</button>
    <button class="tb" id="toolCircle" title="Circle">◯</button>
    <button class="tb" id="toolLine" title="Line">／</button>
    <button class="tb" id="toolDelete" title="Delete">🗑</button>
  </div>

  <!-- ===============================
       CANVAS AREA
       =============================== -->
  <div class="canvas-area">

    <div class="canvas-toolbar">
      <button class="btn" id="zoomOut">−</button>
      <span id="zoomLabel">100%</span>
      <button class="btn" id="zoomIn">+</button>
    </div>

    <div id="canvasHost">
      <canvas id="canvas"></canvas>
    </div>

    <!-- ===============================
         THUMBNAILS / PAGES
         =============================== -->
    <div class="thumb-strip" id="thumbStrip"></div>

  </div>
</div>

<!-- =====================================================
     HIDDEN INPUTS
===================================================== -->
<input type="file" id="imageInput" accept="image/*" hidden />

<!-- =====================================================
     EXPORT DRAWER
===================================================== -->
<div id="exportDrawer">
  <h3>Export</h3>

  <label>Format</label>
  <select>
    <option>PNG</option>
    <option>PDF</option>
    <option>Flipbook</option>
  </select>

  <label>Quality</label>
  <input type="range" min="0.5" max="1" step="0.1" value="0.9" />

  <button class="btn primary">Export</button>
</div>

<!-- =====================================================
     MODULES
===================================================== -->
<script type="module">
import {
  setZoom,
  resetZoom,
  fitToScreen,
  undo,
  redo,
  nextPage,
  prevPage
} from "./js/core.js";

import {
  importImage,
  addHeading,
  addRect,
  addCircle,
  addLine,
  deleteSelected
} from "./js/tools.js";

/* ------------------ PAGE NAV ------------------ */
document.getElementById("btnNextPage").onclick = nextPage;
document.getElementById("btnPrevPage").onclick = prevPage;

/* ------------------ UNDO / REDO ------------------ */
document.getElementById("btnUndo").onclick = undo;
document.getElementById("btnRedo").onclick = redo;

/* ------------------ ZOOM ------------------ */
let zoom = 1;
const zoomLabel = document.getElementById("zoomLabel");

document.getElementById("zoomIn").onclick = () => {
  zoom += 0.1;
  setZoom(zoom);
  zoomLabel.textContent = Math.round(zoom * 100) + "%";
};

document.getElementById("zoomOut").onclick = () => {
  zoom = Math.max(0.2, zoom - 0.1);
  setZoom(zoom);
  zoomLabel.textContent = Math.round(zoom * 100) + "%";
};

document.getElementById("btnFit").onclick = () => {
  fitToScreen();
  zoom = 1;
  zoomLabel.textContent = "100%";
};

/* ------------------ EXPORT DRAWER ------------------ */
document.getElementById("btnExport").onclick = () => {
  document.getElementById("exportDrawer").classList.toggle("open");
};

/* ------------------ TOOLS ------------------ */
const imgInput = document.getElementById("imageInput");

document.getElementById("toolImage").onclick = () => imgInput.click();
imgInput.onchange = e => importImage(e.target.files[0]);

document.getElementById("toolText").onclick = () => addHeading();
document.getElementById("toolRect").onclick = addRect;
document.getElementById("toolCircle").onclick = addCircle;
document.getElementById("toolLine").onclick = addLine;
document.getElementById("toolDelete").onclick = deleteSelected;
</script>

</body>
</html>
