<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photobook Viewer</title>

<!-- QR LIB -->
<script src="https://cdn.jsdelivr.net/npm/qrcode"></script>

<!-- Firebase -->
<script type="module" src="firebase-init.js"></script>

<style>
:root {
  --bg: #0f172a;
  --fg: #e2e8f0;
  --accent: #3b82f6;
  --card-bg: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.12);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "Inter", sans-serif;
}

/* ---------- TOP NAV ---------- */
#topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 18px;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}

.logo a {
  color: var(--fg);
  text-decoration: none;
  font-size: 1.1rem;
  font-weight: 600;
}

.main-nav {
  display: flex;
  gap: 0.8rem;
}

.main-nav a {
  color: var(--fg);
  text-decoration: none;
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid transparent;
}

.main-nav a.active {
  border-color: var(--accent);
  background: var(--accent);
  color: white;
}

.main-nav a:hover {
  background: rgba(255,255,255,0.08);
}

.top-controls button {
  margin-left: 8px;
  padding: 5px 12px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

/* ---------- LOGIN MODAL ---------- */

#loginModal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(4px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 2000;
}

.login-card {
  width: 340px;
  background: rgba(255,255,255,0.08);
  padding: 22px;
  border-radius: 16px;
  box-shadow: 0 0 24px rgba(0,0,0,0.4);
  border: 1px solid var(--border);
  text-align: center;
}

.login-card h2 {
  margin: 0 0 12px;
}

.login-card input {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: none;
  margin-bottom: 12px;
  background: rgba(255,255,255,0.18);
  color: white;
}

.login-card button {
  width: 100%;
  padding: 10px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  margin-top: 6px;
}

.login-card small {
  display: block;
  opacity: 0.7;
  margin-top: 10px;
}
</style>
</head>
