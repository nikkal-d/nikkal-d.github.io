<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Find My Duplicates · Nikkal Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg: #020617;
      --bg-soft: #0f172a;
      --border: #1e293b;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.35);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .main-header {
      background: var(--bg-soft);
      border-bottom: 1px solid var(--border);
      padding: 0.7rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .header-left { display: flex; gap: .5rem; align-items: center; }
    .logo { font-size: 1.4rem; }
    .site-title {
      text-transform: uppercase;
      letter-spacing: .14em;
      font-size: .95rem;
      color: var(--muted);
    }

    .main-menu {
      display: flex;
      gap: .5rem;
    }
    .main-menu a {
      text-decoration: none;
      color: var(--muted);
      padding: .35rem .7rem;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: .8rem;
    }
    .main-menu a:hover {
      background: var(--bg);
      border-color: var(--accent-soft);
      color: var(--text);
    }
    .main-menu a.active {
      background: var(--bg);
      border-color: var(--accent-soft);
      color: var(--accent);
    }

    /* MAIN */
    main {
      padding: 1.2rem;
      max-width: 900px;
      margin: auto;
      width: 100%;
      flex: 1;
    }

    .box {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1.2rem;
    }

    h2 { margin: 0 0 .8rem; color: var(--accent); }

    input[type="file"] { display: none; }
    .file-btn {
      border: 1px dashed var(--border);
      padding: .6rem 1rem;
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      cursor: pointer;
      border-radius: 999px;
      background: #020617;
      color: var(--muted);
      transition: .2s;
      font-size: .9rem;
    }
    .file-btn:hover {
      background: var(--bg-soft);
      border-color: var(--accent-soft);
      color: var(--text);
    }

    #results {
      margin-top: 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: .8rem;
    }

    .result-item {
      background: #020617;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      text-align: center;
      padding-bottom: .5rem;
    }
    .result-item img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      border-bottom: 1px solid var(--border);
    }
    .result-item span {
      display: block;
      padding: .4rem;
      font-size: .8rem;
      color: var(--accent);
    }

    footer {
      padding: .8rem;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      background: var(--bg-soft);
      font-size: .75rem;
    }
  </style>
</head>

<body>

<header class="main-header">
  <div class="header-left">
    <span class="logo">🔍</span>
    <span class="site-title">Nikkal Studio</span>
  </div>
  <nav class="main-menu">
    <a href="index.html" class="active">Find My Duplicates</a>
    <a href="photobook.html">Photobook Editor</a>
    <a href="projects.html">Projects</a>
    <a href="templates.html">Templates</a>
    <a href="stickers.html">Stickers</a>
    <a href="viewer.html">Viewer</a>
  </nav>
</header>

<main>

  <div class="box">
    <h2>🔎 Βρες διπλές εικόνες</h2>
    <p>Ανέβασε εικόνες και το σύστημα θα εντοπίσει ποιες είναι ίδιες.</p>

    <label for="fileInput" class="file-btn">📁 Επιλογή εικόνων</label>
    <input type="file" id="fileInput" multiple accept="image/*">
  </div>

  <div class="box">
    <h2>📌 Αποτελέσματα</h2>
    <div id="results"></div>
  </div>

</main>

<footer>
  © 2025 Nikkal Studio · Find My Duplicates
</footer>

<script>
const fileInput = document.getElementById("fileInput");
const results = document.getElementById("results");

fileInput.addEventListener("change", async () => {
  const files = [...fileInput.files];
  if (!files.length) return;

  results.innerHTML = "<p>🔄 Επεξεργασία...</p>";

  const hashes = new Map();

  for (const file of files) {
    const dataUrl = await toDataURL(file);
    const hash = await getHash(dataUrl);

    if (!hashes.has(hash)) hashes.set(hash, []);
    hashes.get(hash).push(dataUrl);
  }

  showDuplicates(hashes);
});

function showDuplicates(map) {
  results.innerHTML = "";

  let found = false;

  for (const [hash, arr] of map.entries()) {
    if (arr.length < 2) continue;

    found = true;
    arr.forEach(src => {
      const container = document.createElement("div");
      container.className = "result-item";
      container.innerHTML = `
        <img src="${src}">
        <span>Duplicate</span>
      `;
      results.appendChild(container);
    });
  }

  if (!found) {
    results.innerHTML = "<p>✔ Δεν βρέθηκαν διπλές εικόνες.</p>";
  }
}

function toDataURL(file) {
  return new Promise(res => {
    const reader = new FileReader();
    reader.onload = () => res(reader.result);
    reader.readAsDataURL(file);
  });
}

async function getHash(dataUrl) {
  const img = await loadImage(dataUrl);
  const c = document.createElement("canvas");
  const ctx = c.getContext("2d");
  c.width = 20;
  c.height = 20;
  ctx.drawImage(img, 0, 0, 20, 20);
  const pixels = ctx.getImageData(0, 0, 20, 20).data;
  let sum = 0;
  for (let i = 0; i < pixels.length; i += 4) {
    sum += pixels[i] + pixels[i + 1] + pixels[i + 2];
  }
  return sum.toString();
}

function loadImage(src) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => res(img);
    img.src = src;
  });
}
</script>

</body>
</html>
