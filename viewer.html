<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photobook Viewer</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/4.1.0/turn.min.js"></script>

<!-- QR LIB -->
<script src="https://cdn.jsdelivr.net/npm/qrcode"></script>

<!-- Firebase -->
<script type="module" src="firebase-init.js"></script>

<style>
:root {
  --bg: #0f172a;
  --fg: #e2e8f0;
  --accent: #3b82f6;
  --card-bg: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.12);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "Inter", sans-serif;
}

/* ---------- TOP NAV ---------- */
#topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 18px;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}

.logo a {
  color: var(--fg);
  text-decoration: none;
  font-size: 1.1rem;
  font-weight: 600;
}

.main-nav {
  display: flex;
  gap: 0.8rem;
}

.main-nav a {
  color: var(--fg);
  text-decoration: none;
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid transparent;
}

.main-nav a.active {
  border-color: var(--accent);
  background: var(--accent);
  color: white;
}

.main-nav a:hover {
  background: rgba(255,255,255,0.08);
}

.top-controls button {
  margin-left: 8px;
  padding: 5px 12px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

/* ---------- LOGIN MODAL ---------- */

#loginModal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(4px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 2000;
}

.login-card {
  width: 340px;
  background: rgba(255,255,255,0.08);
  padding: 22px;
  border-radius: 16px;
  box-shadow: 0 0 24px rgba(0,0,0,0.4);
  border: 1px solid var(--border);
  text-align: center;
}

.login-card h2 {
  margin: 0 0 12px;
}

.login-card input {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: none;
  margin-bottom: 12px;
  background: rgba(255,255,255,0.18);
  color: white;
}

.login-card button {
  width: 100%;
  padding: 10px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  margin-top: 6px;
}

.login-card small {
  display: block;
  opacity: 0.7;
  margin-top: 10px;
}

#flipbook {
  box-shadow: 0 0 30px rgba(0,0,0,0.5);
  border-radius: 12px;
  background: #111827;
}

.flip-page {
  background: #111827;
  border-radius: 12px;
  overflow: hidden;
}


  
</style>
</head>

  <body>

<!-- ============================
        TOP NAVIGATION
============================= -->
<header id="topbar">
  <div class="logo">
    <a href="index.html">📘 Photobook Studio</a>
  </div>

  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="photobook.html">Photobook</a>
    <a href="duplicates.html">Find My Duplication</a>
    <a href="projects.html">My Photobooks</a>
    <a href="viewer.html" class="active">Viewer</a>
  </nav>

  <div class="top-controls">
    <span id="viewer-user-label">Guest</span>
    <button id="viewer-login-btn">Σύνδεση</button>
    <button id="viewer-logout-btn" style="display:none;">Αποσύνδεση</button>
  </div>
</header>



<!-- ============================
        ERROR / STATUS MESSAGES
============================= -->
<div id="privateMessage" style="
  display:none;
  text-align:center;
  padding: 40px;
  font-size: 1.2rem;
">
  🔒 Αυτό το photobook είναι ιδιωτικό.
  <br><br>
  <button onclick="openLoginModal()" style="
      padding:10px 20px;
      border:none;
      border-radius:8px;
      background:#3b82f6;
      color:white;
      cursor:pointer;
  ">Σύνδεση</button>
</div>

<div id="notFoundMessage" style="
  display:none;
  text-align:center;
  padding:40px;
  font-size:1.2rem;
">
  ❌ Το photobook δεν βρέθηκε ή έχει διαγραφεί.
</div>



<!-- ============================
        MAIN VIEWER AREA
============================= -->
<div id="viewerContainer" style="display:none; text-align:center; margin-top:40px;">
  <div id="flipbook" style="width:900px; height:600px; margin:auto;">
    <!-- Οι σελίδες φορτώνονται μέσω JS -->
  </div>

  <br><br>

  <button id="prevPageBtn" style="padding:10px 20px;">⬅ Προηγούμενη</button>
  <button id="nextPageBtn" style="padding:10px 20px;">Επόμενη ➡</button>
</div>



<!-- ============================
        LOGIN MODAL
============================= -->
<div id="loginModal">
  <div class="login-card">
    <h2>Σύνδεση</h2>

    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Κωδικός">

    <button id="loginSubmitBtn">Σύνδεση</button>

    <small>Δεν έχεις λογαριασμό; Θα προστεθεί Sign Up.</small>

    <button onclick="closeLoginModal()" style="
      margin-top:16px; background:#ef4444;
    ">Κλείσιμο</button>
  </div>
</div>



<!-- ============================
        VIEWER JS
============================= -->
<script type="module" src="viewer.js"></script>

</body>
</html>
