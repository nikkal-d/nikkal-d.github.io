<script>
let tableData = [];

function processData() {
  const text = document.getElementById("inputList").value.trim();
  if (!text) return alert("Επικόλλησε πρώτα δεδομένα!");

  // Ανίχνευση tabs ή κόμματα (Excel, CSV)
  const rows = text.split(/\r?\n/).map(r => r.split(/\t|,/));
  tableData = rows.filter(r => r.some(cell => cell.trim() !== ""));
  renderTable(tableData);

  // Γέμισμα dropdown για επιλογή στήλης
  const colSelect = document.getElementById("columnSelect");
  colSelect.innerHTML = '<option value="">-- επιλέξτε --</option>';
  if (tableData[0]) {
    tableData[0].forEach((_, i) => {
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = "Στήλη " + (i + 1);
      colSelect.appendChild(opt);
    });
    document.querySelectorAll("section").forEach(s => s.classList.add("fade-in"));

  }

  document.getElementById("duplicatesList").textContent = "";
}

function renderTable(data) {
  const table = document.getElementById("dataTable");
  const head = table.querySelector("thead");
  const body = table.querySelector("tbody");
  head.innerHTML = "";
  body.innerHTML = "";
  if (!data.length) return;

  // Επικεφαλίδες
  const header = document.createElement("tr");
  data[0].forEach((_, i) => {
    const th = document.createElement("th");
    th.textContent = "Στήλη " + (i + 1);
    header.appendChild(th);
  });
  head.appendChild(header);

  // Σώμα
  data.forEach((row) => {
    const tr = document.createElement("tr");
    row.forEach((cell) => {
      const td = document.createElement("td");
      td.textContent = cell;
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
}

// Ανίχνευση διπλοτύπων στη στήλη που επέλεξε ο χρήστης
document.getElementById("columnSelect").addEventListener("change", () => {
  const col = document.getElementById("columnSelect").value;
  if (col === "") return;
  const seen = {};
  const dups = [];
  const bodyRows = document.querySelectorAll("#dataTable tbody tr");
  bodyRows.forEach((tr, rowIndex) => {
    const cell = tr.children[col];
    if (!cell) return;
    const val = cell.textContent.trim();
    if (val) {
      if (seen[val]) {
        dups.push([seen[val], rowIndex]);
        cell.classList.add("dup");
        bodyRows[seen[val]].children[col].classList.add("dup");
      } else {
        seen[val] = rowIndex;
      }
    }
  });

  // Αναφορές δεξιά
  const dupDiv = document.getElementById("duplicatesList");
  dupDiv.textContent = "";
  if (dups.length === 0) dupDiv.textContent = "✅ Δεν βρέθηκαν διπλότυπα.";
  else {
    dupDiv.textContent = dups
      .map(d => `🔴 Η σειρά ${d[0] + 1} με τη σειρά ${d[1] + 1} είναι ίδιες.`)
      .join("\n");
  }
});
  // ----- Διγλωσσία EN/EL -----
const translations = {
  el: {
    header: "FindMyDuplicates",
    textareaPlaceholder: "Επικόλλησε δεδομένα από Excel ή CSV...",
    columnLabel: "Έλεγχος διπλοτύπων στη στήλη:",
    analyzeBtn: "Ανάλυση",
    downloadBtn: "Κατέβασε",
    noDuplicates: "✅ Δεν βρέθηκαν διπλότυπα.",
    footer: "© 2025 FindMyDuplicates | Built by Niki Kalantzi"
  },
  en: {
    header: "FindMyDuplicates",
    textareaPlaceholder: "Paste data from Excel or CSV...",
    columnLabel: "Check duplicates in column:",
    analyzeBtn: "Analyze",
    downloadBtn: "Download",
    noDuplicates: "✅ No duplicates found.",
    footer: "© 2025 FindMyDuplicates | Built by Niki Kalantzi"
  }
};

function switchLanguage(lang) {
  const t = translations[lang];
  if(!t) return;

  document.querySelector("header").textContent = t.header;
  document.getElementById("inputList").placeholder = t.textareaPlaceholder;
  document.querySelector("label[for='columnSelect']").textContent = t.columnLabel;
  document.querySelector("button[onclick='processData()']").textContent = t.analyzeBtn;
  document.querySelector("footer").textContent = t.footer;

  localStorage.setItem("lang", lang);
}

// Εφαρμογή αποθηκευμένης γλώσσας στην εκκίνηση
window.addEventListener("DOMContentLoaded", ()=>{
  const savedLang = localStorage.getItem("lang") || "el";
  document.getElementById("langSelect").value = savedLang;
  switchLanguage(savedLang);

const savedTheme = localStorage.getItem("theme") || "light";
document.body.classList.add(savedTheme);
document.getElementById("themeToggle").textContent = savedTheme === "dark" ? "☀️" : "🌙";
});
// ----- Διόρθωση Dark / Light mode -----
function toggleTheme() {
  const body = document.body;
  const current = body.classList.contains("dark") ? "dark" : "light";
  const next = current === "dark" ? "light" : "dark";

  body.classList.remove(current);
  body.classList.add(next);

  // Αποθήκευση στο localStorage
  localStorage.setItem("theme", next);

  // Αλλαγή εικονιδίου στο κουμπί
  const toggleBtn = document.getElementById("themeToggle");
  if (toggleBtn) toggleBtn.textContent = next === "dark" ? "☀️" : "🌙";
}

// Εφαρμογή αποθηκευμένου θέματος κατά την εκκίνηση
window.addEventListener("DOMContentLoaded", async () => {
  const saved = localStorage.getItem("googleToken");

  if (saved && window.gapi && window.gapi.client) {
    const token = JSON.parse(saved);
    gapi.client.setToken(token);
    document.getElementById('saveDriveBtn').disabled = false;
    document.getElementById('loadDriveBtn').disabled = false;
    setStatus("✅ Επανασυνδέθηκες αυτόματα στο Google Drive!", "green");
  }

  if (window.gapi && window.gapi.client) {
    await checkAndRefreshToken();
  } else {
    const timer = setInterval(async () => {
      if (window.gapi && window.gapi.client) {
        clearInterval(timer);
        await checkAndRefreshToken();
      }
    }, 500);
  }
});


// ---------- GOOGLE DRIVE SYNC ----------
const CLIENT_ID = "7674481557-tr33gquj964b83jorc7lr8vahjrde34o.apps.googleusercontent.com";
const SCOPES = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email openid';


let tokenClient;
let gapiInited = false;
let gisInited = false;

  function gapiLoaded() {
  // Μικρή καθυστέρηση για σταθερή φόρτωση του API
  setTimeout(() => {
    gapi.load('client', initializeGapiClient);
  }, 800);
}

async function initializeGapiClient() {
  await gapi.client.init({
    apiKey: "", // optional, δεν χρειάζεται για απλή χρήση
    discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
  });
  gapiInited = true;
}

function gisLoaded() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (resp) => {
      if (resp.error !== undefined) throw (resp);
      // Αποθήκευση token & ώρας λήξης
      const token = {
        ...gapi.client.getToken(),
        expires_at: Date.now() + 3600 * 1000 // +1 ώρα
      };
      localStorage.setItem("googleToken", JSON.stringify(token));
      afterLogin();
    },
  });
}

function afterLogin(){
  document.getElementById('saveDriveBtn').disabled = false;
  document.getElementById('loadDriveBtn').disabled = false;
  document.getElementById('logoutBtn').style.display = "inline-block";
  setStatus("✅ Συνδεδεμένη στο Google Drive!", "green");
}

async function checkAndRefreshToken(){
  const saved = localStorage.getItem("googleToken");
  if (!saved) return false;
  const token = JSON.parse(saved);

  // Αν λήγει σε λιγότερο από 5 λεπτά → ανανέωση
  if (Date.now() > token.expires_at - 5*60*1000){
    try {
      console.log("🔄 Ανανεώνεται το token...");
      tokenClient.requestAccessToken({ prompt: '' }); // χωρίς popup
      return true;
    } catch(e){
      console.warn("❌ Αποτυχία ανανέωσης token", e);
      localStorage.removeItem("googleToken");
      setStatus("⚠️ Χρειάζεται επανασύνδεση στο Google.", "red");
      return false;
    }
  } else {
    // ακόμα έγκυρο
    gapi.client.setToken(token);
    afterLogin();
    return true;
  }
}

        
  function setStatus(msg, color="#ff9800"){
  const div=document.getElementById("statusMsg");
  div.style.color=color;
  div.textContent=msg;
}

// ----- Επανασύνδεση Google χωρίς αποσύνδεση -----
function handleAuthClick() {
  if (!gapiInited) { setStatus("⏳ Το API φορτώνει... δοκίμασε ξανά.", "red"); return; }

  tokenClient.callback = (resp) => {
    if (resp.error !== undefined) throw (resp);
    const token = gapi.client.getToken();
    localStorage.setItem("googleToken", JSON.stringify(token)); // αποθήκευση
    document.getElementById('saveDriveBtn').disabled = false;
    document.getElementById('loadDriveBtn').disabled = false;
    setStatus("✅ Συνδέθηκες επιτυχώς με Google!", "green");
  };

  setStatus("🔐 Έλεγχος για υπάρχουσα σύνδεση...");

  // Αν υπάρχει ήδη token στο localStorage
  const saved = localStorage.getItem("googleToken");
  if (saved) {
    const token = JSON.parse(saved);
    gapi.client.setToken(token);
    document.getElementById('saveDriveBtn').disabled = false;
    document.getElementById('loadDriveBtn').disabled = false;
    setStatus("✅ Είσαι ήδη συνδεδεμένη με Google!", "green");
  } else {
    // Πρώτη φορά ή δεν υπάρχει αποθηκευμένο token
    setStatus("🔐 Άνοιγμα παραθύρου σύνδεσης...");
    tokenClient.requestAccessToken({ prompt: 'consent' });
  }
}


// ----- Αποθήκευση σε φάκελο "FindMyDuplicates" -----
async function saveToDrive() {
  const text = document.getElementById("inputList").value.trim();
  if (!text){ 
    setStatus("⚠️ Δεν υπάρχουν δεδομένα!", "red"); 
    return; 
  }
  setStatus("⏳ Αποθήκευση στο Google Drive...");

  const folderName = "FindMyDuplicates";
  const token = gapi.client.getToken();
  if (!token) {
    setStatus("⚠️ Δεν υπάρχει ενεργή σύνδεση!", "red");
    return;
  }

  // Έλεγχος αν υπάρχει ήδη φάκελος
  const folderRes = await safeGoogleRequest(() => 
    gapi.client.drive.files.list({
      q: `mimeType='application/vnd.google-apps.folder' and name='${folderName}' and trashed=false`,
      fields: "files(id, name)",
    })
  );

  let folderId;
  if (folderRes.result.files.length > 0) {
    folderId = folderRes.result.files[0].id;
  } else {
    // Δημιουργία φακέλου αν δεν υπάρχει
    const folderMetadata = {
      name: folderName,
      mimeType: "application/vnd.google-apps.folder",
    };
    const createFolder = await gapi.client.drive.files.create({
      resource: folderMetadata,
      fields: "id",
    });
    folderId = createFolder.result.id;
    setStatus("📁 Δημιουργήθηκε φάκελος FindMyDuplicates", "green");
  }

  // Δημιουργία αρχείου μέσα στο φάκελο
  const fileName = `List_${new Date().toISOString().split("T")[0]}.txt`;
  const metadata = {
    name: fileName,
    mimeType: "text/plain",
    parents: [folderId],
  };

  const file = new Blob([text], { type: "text/plain" });
  const form = new FormData();
  form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
  form.append("file", file);

  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
    method: "POST",
    headers: new Headers({ "Authorization": "Bearer " + token.access_token }),
    body: form,
  });

  if (res.ok) {
    setStatus(`☁️ Αποθηκεύτηκε το αρχείο ${fileName} στο φάκελο FindMyDuplicates!`, "green");
  } else {
    setStatus("❌ Σφάλμα κατά την αποθήκευση!", "red");
  }
}

// ----- Φόρτωση αρχείων από φάκελο "FindMyDuplicates" -----
async function loadFromDrive() {
  try {
    setStatus("⏳ Αναζήτηση αρχείων στο Google Drive...");

    const token = gapi.client.getToken();
    if (!token) {
      setStatus("⚠️ Δεν υπάρχει ενεργή σύνδεση!", "red");
      return;
    }

    // Βρίσκουμε το φάκελο FindMyDuplicates
    const folderRes = await gapi.client.drive.files.list({
      q: "mimeType='application/vnd.google-apps.folder' and name='FindMyDuplicates' and trashed=false",
      fields: "files(id, name)",
    });

    if (!folderRes.result.files.length) {
      setStatus("⚠️ Δεν βρέθηκε φάκελος FindMyDuplicates!", "red");
      return;
    }

    const folderId = folderRes.result.files[0].id;

    // Βρίσκουμε όλα τα αρχεία μέσα στο φάκελο
    const fileRes = await gapi.client.drive.files.list({
      q: `'${folderId}' in parents and trashed=false and mimeType='text/plain'`,
      fields: "files(id, name, createdTime)",
      orderBy: "createdTime desc",
    });

    const files = fileRes.result.files;
    if (!files.length) {
      setStatus("⚠️ Δεν υπάρχουν αποθηκευμένα αρχεία!", "red");
      return;
    }

    // Δημιουργούμε λίστα με κουμπιά για κάθε αρχείο
    let listHTML = "<div id='driveFileList' style='position:fixed;top:20%;left:50%;transform:translateX(-50%);background:white;padding:20px;border-radius:12px;box-shadow:0 0 15px rgba(0,0,0,0.3);z-index:9999;max-height:60vh;overflow-y:auto'>";
    listHTML += "<div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;'>";
listHTML += "<h3 style='margin:0'>📂 Επέλεξε αρχείο</h3>";
listHTML += "<button onclick='document.getElementById(\"driveFileList\").remove()' style='background:#ff9800;color:white;border:none;padding:5px 10px;border-radius:6px;cursor:pointer;'>❌ Κλείσιμο</button>";
listHTML += "</div>";

    files.forEach(f => {
      listHTML += `<button style='margin:5px;display:block;width:100%' onclick='loadSpecificFile("${f.id}", "${f.name}")'>${f.name}</button>`;
    });
    listHTML += "</div>";

    document.body.insertAdjacentHTML("beforeend", listHTML);
  } catch (err) {
    console.error(err);
    setStatus("❌ Σφάλμα κατά τη φόρτωση από Drive!", "red");
  }
}

  async function loadSpecificFile(fileId, fileName) {
  try {
    const token = gapi.client.getToken();
    const response = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
      headers: new Headers({ Authorization: "Bearer " + token.access_token }),
    });
    const text = await response.text();
    document.getElementById("inputList").value = text;
    setStatus(`✅ Φορτώθηκε το αρχείο ${fileName} από το Google Drive!`, "green");
    document.getElementById("driveFileList").remove();
  } catch (err) {
    console.error(err);
    setStatus("❌ Σφάλμα κατά τη φόρτωση του αρχείου!", "red");
  }
}


   
function logoutGoogle(){
  localStorage.removeItem("googleToken");
  gapi.client.setToken(null);
  document.getElementById('saveDriveBtn').disabled = true;
  document.getElementById('loadDriveBtn').disabled = true;
  document.getElementById('logoutBtn').style.display = "none";

}

        // ----- Σύστημα ελέγχου ρυθμού αιτημάτων προς Google -----
let lastRequestTime = 0;

async function safeGoogleRequest(fn, delay = 1500) {
  const now = Date.now();
  const elapsed = now - lastRequestTime;
  if (elapsed < delay) {
    await new Promise(r => setTimeout(r, delay - elapsed));
  }
  lastRequestTime = Date.now();
  return await fn();
}


  function downloadList(withDuplicates = true) {
  const text = document.getElementById("inputList").value.trim();
  if (!text) {
    setStatus("⚠️ Δεν υπάρχουν δεδομένα για κατέβασμα!", "red");
    return;
  }

  const blob = new Blob([text], { type: "text/plain" });
  const link = document.createElement("a");
  const suffix = withDuplicates ? "_withDuplicates" : "_noDuplicates";
  link.href = URL.createObjectURL(blob);
  link.download = "FindMyDuplicates" + suffix + ".txt";
  link.click();
  setStatus("⬇️ Το αρχείο κατέβηκε επιτυχώς!", "green");
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);

}
