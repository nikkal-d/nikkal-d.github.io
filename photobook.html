<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Photobook Editor</title>

<!-- ================= FABRIC FIRST ================= -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/4.6.0/fabric.min.js"></script>

<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#111;color:#fff;overflow:hidden}
header{height:50px;background:#181818;display:flex;align-items:center;padding:0 10px;gap:10px}
button{background:#2a2a2a;color:#fff;border:none;padding:6px 10px;border-radius:4px;cursor:pointer}
button:hover{background:#3a3a3a}
#app{display:flex;height:calc(100vh - 50px)}
#left{width:220px;background:#1e1e1e;padding:10px;display:flex;flex-direction:column;gap:8px}
#center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#222}
#canvasWrap{background:#999;padding:20px;border-radius:6px}
#zoomBar{margin-top:10px;display:flex;gap:10px;align-items:center}
#zoomValue{min-width:50px;text-align:center}
</style>
</head>

<body>

<header>
  <strong>Photobook Editor</strong>
</header>

<div id="app">
  <div id="left">
    <button id="addText">➕ Text</button>
    <input type="file" id="imgInput" accept="image/*" />
    <button id="zoomIn">Zoom +</button>
    <button id="zoomOut">Zoom −</button>
    <button id="zoomReset">Reset</button>
  </div>

  <div id="center">
    <div id="canvasWrap">
      <canvas id="canvas"></canvas>
    </div>
    <div id="zoomBar">
      Zoom: <span id="zoomValue">100%</span>
    </div>
  </div>
</div>

<script>
/* ================= SAFE INIT ================= */

let canvas;
let zoom = 1;

window.addEventListener("DOMContentLoaded", () => {

  canvas = new fabric.Canvas("canvas", {
    width: 900,
    height: 600,
    backgroundColor: "#fff",
    preserveObjectStacking: true
  });

  canvas.renderAll();

  /* -------- TEXT -------- */
  document.getElementById("addText").onclick = () => {
    const t = new fabric.Textbox("Κείμενο", {
      left: 100,
      top: 100,
      fontSize: 32,
      fill: "#000",
      textBaseline: "top"
    });
    canvas.add(t).setActiveObject(t);
  };

  /* -------- IMAGE -------- */
  document.getElementById("imgInput").onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      fabric.Image.fromURL(r.result, img => {
        img.scaleToWidth(300);
        canvas.add(img).setActiveObject(img);
      });
    };
    r.readAsDataURL(file);
  };

  /* -------- ZOOM -------- */
  const updateZoom = () => {
    document.getElementById("zoomValue").textContent = Math.round(zoom * 100) + "%";
  };

  document.getElementById("zoomIn").onclick = () => {
    zoom = Math.min(4, zoom + 0.1);
    canvas.zoomToPoint(
      new fabric.Point(canvas.width / 2, canvas.height / 2),
      zoom
    );
    updateZoom();
  };

  document.getElementById("zoomOut").onclick = () => {
    zoom = Math.max(0.2, zoom - 0.1);
    canvas.zoomToPoint(
      new fabric.Point(canvas.width / 2, canvas.height / 2),
      zoom
    );
    updateZoom();
  };

  document.getElementById("zoomReset").onclick = () => {
    zoom = 1;
    canvas.setViewportTransform([1,0,0,1,0,0]);
    updateZoom();
  };

  updateZoom();
});
</script>

</body>
</html>
