<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <title>Photobook Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #sidebar {
      width: 220px;
      background: #1e1e1e;
      color: #fff;
      padding: 12px;
      box-sizing: border-box;
    }

    #sidebar button {
      width: 100%;
      margin-bottom: 8px;
      padding: 10px;
      background: #e53935;
      color: #fff;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }

    #sidebar button:hover {
      background: #c62828;
    }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ddd;
    }

    #topbar {
      width: 100%;
      background: #fff;
      padding: 8px;
      box-sizing: border-box;
      display: flex;
      gap: 8px;
      justify-content: center;
      border-bottom: 1px solid #ccc;
    }

    #topbar button {
      padding: 6px 10px;
      cursor: pointer;
    }

    #canvasWrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    canvas {
      background: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,.3);
    }

    input[type="file"] {
      display: none;
    }
  </style>

  <!-- 🔒 HARD FIX: kill Fabric alphabetical internally -->
  <script>
    (function () {
      const d = Object.getOwnPropertyDescriptor(
        CanvasRenderingContext2D.prototype,
        "textBaseline"
      );
      if (!d || !d.set) return;
      Object.defineProperty(CanvasRenderingContext2D.prototype, "textBaseline", {
        get: d.get,
        set(v) {
          d.set.call(this, v === "alphabetical" ? "alphabetic" : v);
        },
        configurable: true
      });
    })();
  </script>

  <!-- Fabric -->
  <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
</head>

<body>

  <div id="sidebar">
    <button onclick="addText()">➕ Text</button>
    <button onclick="openImage()">🖼 Image</button>
    <button onclick="zoomIn()">➕ Zoom</button>
    <button onclick="zoomOut()">➖ Zoom</button>
    <button onclick="resetZoom()">⤾ Reset Zoom</button>
    <input type="file" id="imageInput" accept="image/*">
  </div>

  <div id="main">
    <div id="topbar">
      <strong>Photobook Editor (Working Base)</strong>
    </div>

    <div id="canvasWrap">
      <canvas id="canvas" width="1240" height="1754"></canvas>
    </div>
  </div>

<script>
  // =====================
  // CORE
  // =====================
  const canvas = new fabric.Canvas("canvas", {
    preserveObjectStacking: true,
    selection: true
  });

  let zoom = 1;

  console.log("✅ Canvas initialized");

  // =====================
  // TEXT
  // =====================
  function addText() {
    const text = new fabric.Textbox("Text", {
      left: 150,
      top: 150,
      fontSize: 48,
      fill: "#111",
      fontFamily: "Arial",
      textBaseline: "alphabetic"
    });
    canvas.add(text);
    canvas.setActiveObject(text);
    canvas.requestRenderAll();
  }

  // =====================
  // IMAGE
  // =====================
  function openImage() {
    document.getElementById("imageInput").click();
  }

  document.getElementById("imageInput").addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      fabric.Image.fromURL(reader.result, img => {
        img.scaleToWidth(canvas.getWidth() * 0.4);
        img.set({ left: 200, top: 200 });
        canvas.add(img);
        canvas.setActiveObject(img);
        canvas.requestRenderAll();
      });
    };
    reader.readAsDataURL(file);
  });

  // =====================
  // ZOOM
  // =====================
  function zoomIn() {
    zoom = Math.min(4, zoom + 0.1);
    applyZoom();
  }

  function zoomOut() {
    zoom = Math.max(0.2, zoom - 0.1);
    applyZoom();
  }

  function resetZoom() {
    zoom = 1;
    canvas.setViewportTransform([1,0,0,1,0,0]);
    canvas.requestRenderAll();
  }

  function applyZoom() {
    const center = new fabric.Point(
      canvas.getWidth() / 2,
      canvas.getHeight() / 2
    );
    canvas.zoomToPoint(center, zoom);
    canvas.requestRenderAll();
  }
</script>

</body>
</html>
