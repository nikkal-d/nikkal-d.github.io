<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Photobook Editor – Stable</title>

<!-- FABRIC -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

<script>
/* 🔒 KILL textBaseline BUG ONCE AND FOR ALL */
if (window.fabric) {
  ["Textbox","IText","Text"].forEach(t=>{
    const p = fabric[t].prototype;
    Object.defineProperty(p,"textBaseline",{get(){return"alphabetic"},set(){}});
  });
}
</script>

<style>
body {
  margin:0;
  font-family:Arial, sans-serif;
  background:#eee;
}
#toolbar {
  display:flex;
  gap:8px;
  padding:10px;
  background:#111;
  color:#fff;
}
#toolbar button {
  padding:8px 12px;
  cursor:pointer;
}
#canvasWrap {
  display:flex;
  justify-content:center;
  align-items:center;
  height:calc(100vh - 60px);
}
canvas {
  background:#fff;
  box-shadow:0 0 10px rgba(0,0,0,.3);
}
#zoomLabel {
  margin-left:auto;
  padding:8px;
}
</style>
</head>

<body>

<div id="toolbar">
  <button id="addText">Text</button>
  <button id="addImage">Image</button>
  <button id="addEmoji">Emoji</button>

  <button id="zoomIn">＋</button>
  <button id="zoomOut">－</button>
  <button id="zoomReset">100%</button>

  <span id="zoomLabel">100%</span>
</div>

<input type="file" id="imageInput" accept="image/*" hidden>

<div id="canvasWrap">
  <canvas id="canvas" width="1240" height="1754"></canvas>
</div>

<script>
/* ================= CANVAS ================= */
const canvas = new fabric.Canvas("canvas", {
  preserveObjectStacking:true,
  selection:true
});
window.canvas = canvas;

/* ================= ZOOM ================= */
let zoom = 1;
function applyZoom() {
  const c = new fabric.Point(canvas.getWidth()/2, canvas.getHeight()/2);
  canvas.zoomToPoint(c, zoom);
  document.getElementById("zoomLabel").textContent = Math.round(zoom*100)+"%";
}

document.getElementById("zoomIn").onclick = ()=>{
  zoom=Math.min(4,zoom+0.1); applyZoom();
};
document.getElementById("zoomOut").onclick = ()=>{
  zoom=Math.max(0.2,zoom-0.1); applyZoom();
};
document.getElementById("zoomReset").onclick = ()=>{
  zoom=1; canvas.setViewportTransform([1,0,0,1,0,0]); applyZoom();
};

/* ================= TEXT ================= */
document.getElementById("addText").onclick = ()=>{
  const t = new fabric.Textbox("Text",{
    left:150, top:150,
    fontSize:48,
    fill:"#111",
    fontFamily:"Arial"
  });
  canvas.add(t);
  canvas.setActiveObject(t);
};

/* ================= EMOJI ================= */
document.getElementById("addEmoji").onclick = ()=>{
  const e = new fabric.Textbox("😀",{
    left:200, top:200,
    fontSize:96
  });
  canvas.add(e);
  canvas.setActiveObject(e);
};

/* ================= IMAGE ================= */
const input = document.getElementById("imageInput");
document.getElementById("addImage").onclick = ()=> input.click();

input.onchange = e=>{
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    fabric.Image.fromURL(r.result,img=>{
      img.scaleToWidth(canvas.getWidth()*0.4);
      img.set({left:120,top:120});
      canvas.add(img);
      canvas.setActiveObject(img);
    });
  };
  r.readAsDataURL(f);
  input.value="";
};
</script>

</body>
</html>
