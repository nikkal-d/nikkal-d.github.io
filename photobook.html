<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <title>Photobook Studio Editor</title>

  <link rel="stylesheet" href="./css/photobook.css" />

  <!-- FabricJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

  <!-- PDF.js for PDF import -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    body {
      margin: 0;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: #202020;
      color: white;
      font-family: Arial, sans-serif;
    }

    #sidebar {
      width: 300px;
      background: #2b2b2b;
      padding: 15px;
      overflow-y: auto;
    }

    #editor {
      flex: 1;
      position: relative;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #canvas-wrapper {
      width: 90%;
      height: 90%;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    canvas {
      background: white;
    }

    /* Tabs */
    .tab-btns {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }
    .tab-btns button.active {
      background: #4caf50;
    }
    .tab {
      display: none;
    }
    .tab.active {
      display: block;
    }

    .tool-section { margin-bottom: 25px; }

    .sticker-thumb {
      width: 60px;
      height: 60px;
      margin: 4px;
      cursor: pointer;
    }

    /* AI images */
    .ai-image-results {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
    }
    .ai-image-thumb {
      width: 100%;
      border-radius: 4px;
      cursor: pointer;
    }

    #thumbnails img {
      width: 80px;
      margin: 4px;
      border-radius: 4px;
      background: #333;
    }
    .thumb.active {
      outline: 2px solid #4caf50;
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <div id="sidebar">

    <h2>Photobook Studio</h2>

    <!-- Tabs -->
    <div class="tab-btns">
      <button data-tab="ai" class="active">AI Εικόνες</button>
      <button data-tab="stickers">Stickers</button>
      <button data-tab="filters">Filters</button>
      <button data-tab="crop">Crop</button>
    </div>

    <!-- TAB: AI IMAGES -->
    <div id="tab-ai" class="tab active">
      <div class="tool-section">
        <h3>AI Εικόνες</h3>
        <div class="ai-search-row" style="display:flex;gap:6px;">
          <input id="aiImageSearch" type="text" placeholder="π.χ. flowers, baby, wedding" style="flex:1;" />
          <button id="aiImageSearchBtn">OK</button>
        </div>
        <div id="aiImageResults" class="ai-image-results"></div>
      </div>
    </div>

    <!-- TAB: STICKERS -->
    <div id="tab-stickers" class="tab">
      <h3>Stickers</h3>
      <button onclick="loadStickers('emojis')">Emoji</button>
      <div id="stickerGrid"></div>
    </div>

    <!-- TAB: FILTERS -->
    <div id="tab-filters" class="tab">
      <h3>Filters</h3>
      <button onclick="applyFilter('grayscale')">Grayscale</button>
      <button onclick="applyFilter('vintage')">Vintage</button>
      <button onclick="applyFilter('remove')">Clear</button>
    </div>

    <!-- TAB: CROP -->
    <div id="tab-crop" class="tab">
      <h3>Crop Tool</h3>
      <button onclick="startCrop()">Start Crop</button>
      <button id="cropOK" style="display:none;" onclick="applyCrop()">Apply</button>
      <button id="cropCancel" style="display:none;" onclick="cancelCrop()">Cancel</button>
    </div>

    <h3>Σελίδες</h3>
    <button id="addPageBtn">➕ Νέα σελίδα</button>
    <button id="deletePageBtn">🗑️ Διαγραφή</button>
    <div id="pageInfo">1/1</div>
    <div id="thumbnails"></div>

  </div>

  <!-- EDITOR WORKSPACE -->
  <div id="editor">
    <div id="canvas-wrapper">
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <!-- Editor scripts -->
  <script type="module" src="./js/core.js"></script>
  <script type="module" src="./js/tools.js"></script>
  <script type="module" src="./js/ui.js"></script>

</body>
</html>
