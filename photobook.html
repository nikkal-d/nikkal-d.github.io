<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <title>Photobook Editor</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <link rel="stylesheet" href="./css/app.css" />
  <link rel="stylesheet" href="./css/photobook.css" />
</head>

<body class="theme-light">

<header class="topbar">
  <div class="topbar-left">
    <strong>Photobook</strong>
  </div>
  <div class="topbar-right">
    <button id="themeToggleBtn">🌙</button>
  </div>
</header>

<div class="appShell">

  <!-- LEFT -->
  <aside class="leftRail">
    <button class="railbtn" data-panel="pages">📄</button>
    <button class="railbtn" data-panel="text">🅰</button>
    <button class="railbtn" data-panel="images">🖼</button>
  </aside>

  <section class="leftPanel" id="leftPanel">
    <div class="panelHeader">
      <h3 id="panelTitle">Pages</h3>
      <button id="closeLeftPanelBtn">✕</button>
    </div>

    <!-- PAGES -->
    <div class="panelView" data-view="pages">
      <button id="addPageBtn">+ Page</button>
      <button id="prevPageBtn">←</button>
      <span id="pageInfo">1 / 1</span>
      <button id="nextPageBtn">→</button>
    </div>

    <!-- TEXT -->
    <div class="panelView" data-view="text" hidden>
      <button id="addTextBtn">Add Text</button>
    </div>

    <!-- IMAGES -->
    <div class="panelView" data-view="images" hidden>
      <input type="file" id="imageInput" accept="image/*">
    </div>
  </section>

  <!-- CANVAS -->
  <main class="stage">
    <div class="stageBar">
      <button id="zoomOutBtn">−</button>
      <span id="zoomValue">100%</span>
      <button id="zoomInBtn">+</button>

      <select id="pageSizeSelect">
        <option value="A4P">A4 Portrait</option>
        <option value="A4L">A4 Landscape</option>
        <option value="SQUARE">Square</option>
      </select>

      <button id="exportFlipBtn">Export Flipbook</button>
      <button id="previewFlipBtn">Preview</button>
    </div>

    <div class="canvasHost" id="canvasHost">
      <canvas id="canvas"></canvas>
    </div>
  </main>

</div>

<!-- FLIPBOOK PREVIEW -->
<div class="modal" id="flipModal">
  <div class="modal-inner">
    <button id="closeFlipBtn">✕</button>
    <iframe id="flipFrame"></iframe>
  </div>
</div>

<!-- FABRIC GLOBAL -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

<script src="./js/core.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/sidebar.js"></script>

</body>
</html>
