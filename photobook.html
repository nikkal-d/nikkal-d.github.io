<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Photobook Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="css/photobook.css">

  <!-- Fabric.js -->
  <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

  <!-- pdf.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }
  </script>

  <!-- Export libs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<!-- ================= TOP BAR ================= -->
<header id="topbar">
  <div class="logo">📘 Photobook Studio</div>

  <div class="top-controls">
    <button id="undoBtn">↶</button>
    <button id="redoBtn">↷</button>

    <button id="zoomOutBtn">−</button>
    <span id="zoomLabel">100%</span>
    <button id="zoomInBtn">+</button>

    <button id="themeToggleBtn">☾</button>
  </div>
</header>

<!-- ================= LEFT SIDEBAR ================= -->
<aside class="sidebar left">
  <button class="side-btn" data-panel="import">📁</button>
  <button class="side-btn" data-panel="edit">✏️</button>
  <button class="side-btn" data-panel="layers">🧱</button>
</aside>

<!-- ================= LEFT DRAWER ================= -->
<div id="leftDrawer" class="drawer left">

  <div class="drawer-panel" id="panel-import">
    <h3>Import</h3>
    <button id="btnUploadImage">🖼 Εικόνα</button>
    <input type="file" id="imageInput" accept="image/*" hidden>

    <button id="btnUploadPDF">📄 PDF</button>
    <input type="file" id="pdfInput" accept="application/pdf" hidden>
  </div>

  <div class="drawer-panel" id="panel-edit">
    <h3>Edit</h3>
    <button id="cropBtn">✂ Crop</button>
    <button id="removeBgBtn">🧠 Remove BG</button>

    <hr>

    <button id="bringForwardBtn">⬆ Bring Forward</button>
    <button id="sendBackwardBtn">⬇ Send Backward</button>
  </div>

  <div class="drawer-panel" id="panel-layers">
    <h3>Layers</h3>
    <div id="layersList">Επίλεξε αντικείμενο</div>
  </div>

</div>

<!-- ================= RIGHT SIDEBAR ================= -->
<button id="exportFab" class="export-fab">Export</button>

<aside id="exportDrawer" class="drawer right">
  <div class="drawer-head">
    <h3>Export</h3>
    <button id="exportCloseBtn">✕</button>
  </div>

  <button id="exportCloudBtn">☁ Cloud</button>
  <button id="exportPDFBtn">📄 PDF</button>
  <button id="exportImagesBtn">🖼 ZIP Images</button>
  <button id="exportFlipbookBtn">📘 Flipbook</button>
</aside>

<!-- ================= MAIN CANVAS ================= -->
<main id="editorMain">
  <div id="canvas-wrapper">
    <canvas id="canvas"></canvas>
  </div>

  <div id="pageControls">
    <button id="prevPageBtn">⟵</button>
    <span id="pageInfo">1 / 1</span>
    <button id="nextPageBtn">⟶</button>
  </div>
</main>

<!-- ================= SCRIPTS ================= -->
<script type="module" src="./firebase-init.js"></script>
<script type="module" src="./js/core.js"></script>
<script type="module" src="./js/tools.js"></script>
<script type="module" src="./js/export.js"></script>
<script type="module" src="./js/ui.js"></script>

<!-- ================= UI BINDINGS ================= -->
<script type="module">
  import { fabricCanvas, pages } from "./js/core.js";
  import { exportAsZip, exportAsPDF, exportAsFlipbook, exportToCloud } from "./js/export.js";
  import { bringForward, sendBackward, removeBackground } from "./js/tools.js";

  /* ---------- Sidebar logic ---------- */
  const sideBtns = document.querySelectorAll(".side-btn");
  const drawer = document.getElementById("leftDrawer");
  const panels = document.querySelectorAll(".drawer-panel");

  sideBtns.forEach(btn => {
    btn.onclick = () => {
      const target = btn.dataset.panel;

      if (btn.classList.contains("active")) {
        btn.classList.remove("active");
        drawer.classList.remove("open");
        panels.forEach(p => p.classList.remove("active"));
        return;
      }

      sideBtns.forEach(b => b.classList.remove("active"));
      panels.forEach(p => p.classList.remove("active"));

      btn.classList.add("active");
      drawer.classList.add("open");
      document.getElementById("panel-" + target)?.classList.add("active");
    };
  });

  /* ---------- Import Image ---------- */
  const imgBtn = document.getElementById("btnUploadImage");
  const imgInput = document.getElementById("imageInput");

  imgBtn.onclick = () => imgInput.click();
  imgInput.onchange = e => {
    const file = e.target.files[0];
    if (!file || !fabricCanvas) return;

    const url = URL.createObjectURL(file);
    fabric.Image.fromURL(url, img => {
      img.scaleToWidth(fabricCanvas.width * 0.6);
      fabricCanvas.add(img).setActiveObject(img);
    });
  };

  /* ---------- Import PDF (images only for now) ---------- */
  document.getElementById("btnUploadPDF").onclick = () =>
    document.getElementById("pdfInput").click();

  /* ---------- Layer order ---------- */
  document.getElementById("bringForwardBtn").onclick = bringForward;
  document.getElementById("sendBackwardBtn").onclick = sendBackward;

  /* ---------- Remove background ---------- */
  document.getElementById("removeBgBtn").onclick = removeBackground;

  /* ---------- Export drawer ---------- */
  const exportDrawer = document.getElementById("exportDrawer");
  document.getElementById("exportFab").onclick = () => exportDrawer.classList.add("open");
  document.getElementById("exportCloseBtn").onclick = () => exportDrawer.classList.remove("open");

  function collectPages() {
    return pages.map(p => p.image).filter(Boolean);
  }

  document.getElementById("exportImagesBtn").onclick = () =>
    exportAsZip(collectPages());

  document.getElementById("exportPDFBtn").onclick = () =>
    exportAsPDF(collectPages());

  document.getElementById("exportFlipbookBtn").onclick = () =>
    exportAsFlipbook(collectPages());

  document.getElementById("exportCloudBtn").onclick = async () => {
    const id = await exportToCloud(collectPages(), "My Photobook");
    if (id) alert("Uploaded! ID: " + id);
  };

  /* ---------- Canvas Zoom ---------- */
  let zoom = 1;
  const zoomLbl = document.getElementById("zoomLabel");

  function applyZoom() {
    fabricCanvas.setZoom(zoom);
    zoomLbl.textContent = Math.round(zoom * 100) + "%";
    fabricCanvas.requestRenderAll();
  }

  document.getElementById("zoomInBtn").onclick = () => {
    zoom = Math.min(3, zoom + 0.1);
    applyZoom();
  };
  document.getElementById("zoomOutBtn").onclick = () => {
    zoom = Math.max(0.3, zoom - 0.1);
    applyZoom();
  };
</script>

</body>
</html>
