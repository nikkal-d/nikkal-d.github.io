<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nikkal Studio – Photobook Editor</title>

<!-- CSS -->
<link rel="stylesheet" href="page-flip.css">
<style>
body {
    margin: 0;
    padding: 0;
    background: #020617;
    color: white;
    font-family: Arial, sans-serif;
}
header {
    background: #0f172a;
    padding: 12px;
    text-align: center;
    color: white;
    font-size: 22px;
    letter-spacing: 1px;
    border-bottom: 2px solid #1e293b;
}
#editor-container {
    display: flex;
    gap: 10px;
    height: calc(100vh - 60px);
    padding: 10px;
}
#sidebar {
    width: 260px;
    background: #0f172a;
    border-right: 2px solid #1e293b;
    padding: 12px;
    overflow-y: auto;
}
#mainArea {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
}
#canvas {
    background: white;
    width: 800px;
    height: 1100px;
    box-shadow: 0px 0px 12px #0008;
}
.thumbnail-bar {
    margin-top: 8px;
    display: flex;
    gap: 8px;
    max-width: 95%;
    overflow-x: auto;
    padding: 6px;
}
.thumbnail {
    width: 90px;
    height: 120px;
    background: #1e293b;
    border: 2px solid #334155;
    cursor: pointer;
}
.thumbnail.active {
    border-color: #38bdf8;
}
button {
    padding: 10px;
    margin: 5px 0;
    width: 100%;
    background: #1e293b;
    color: white;
    border: 1px solid #334155;
    cursor: pointer;
}
button:hover {
    background: #334155;
}
input, select {
    width: 100%;
    padding: 8px;
    margin-top: 6px;
    margin-bottom: 12px;
    background: #1e293b;
    border: 1px solid #334155;
    color: white;
}
</style>

</head>

<body>

<header>📘 Photobook Editor – Nikkal Studio</header>

<div id="editor-container">

<div id="sidebar">

<h3>📤 Μεταφόρτωση</h3>

<label>Εικόνες (PNG/JPG):</label>
<input type="file" id="imageUpload" accept="image/*" multiple>

<label>PDF (από Canva, αρχεία):</label>
<input type="file" id="pdfUpload" accept="application/pdf">

<hr>

<h3>✏️ Εργαλεία</h3>
<button id="addTextBtn">Προσθήκη Κειμένου</button>
<button id="addStickerBtn">Προσθήκη Sticker</button>
<button id="addTemplateBtn">Προσθήκη Template</button>
<button id="undoBtn">↶ Undo</button>
<button id="redoBtn">↷ Redo</button>

<hr>

<h3>📚 Σελίδες</h3>
<button id="addPageBtn">➕ Νέα Σελίδα</button>
<button id="deletePageBtn">🗑️ Διαγραφή Σελίδας</button>

<hr>

<h3>📤 Εξαγωγή</h3>
<button id="exportPdfBtn">📄 Αποθήκευση σαν PDF</button>
<button id="exportZipBtn">📦 Κατέβασμα ZIP</button>

<h3>☁️ Cloud</h3>
<button id="uploadCloudBtn">☁️ Upload στο Cloud</button>
<button id="shareBtn">🔗 Κοινοποίηση Link</button>

</div>

<div id="mainArea">
<canvas id="canvas"></canvas>

<div class="thumbnail-bar" id="thumbnailBar"></div>

</div>

</div>
<div id="viewerContainer" style="margin-top:20px; width:100%; height:500px; background:#020617; position:relative; overflow:hidden;">
    <!-- Flipbook θα προκύψει εδώ -->
</div>

<!-- Ήχος για γύρισμα σελίδας -->
<audio id="pageSound" preload="auto">
  <source src="flip.mp3" type="audio/mpeg">
</audio>

<script type="module">
// -- Modules Εισαγωγές --
import { uploadPhotobook } from "./saveToFirebase.js";
import { loadPhotobooks } from "./loadFromFirebase.js";

const canvas = document.getElementById('canvas');
const fabricCanvas = new fabric.Canvas(canvas, {
  backgroundColor: '#ffffff',
  selection: true
});
let pages = [];
let currentPage = 0;

// Εισαγωγή εικόνων
const imageUpload = document.getElementById('imageUpload');
imageUpload.addEventListener('change', (e) => {
  const files = [...e.target.files];
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = (evt) => {
      pages.push(evt.target.result);
      refreshThumbnails();
      renderFlipbook();
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
});

// Εισαγωγή PDF
const pdfUpload = document.getElementById('pdfUpload');
pdfUpload.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const pdfjsLib = window['pdfjsLib'];
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.worker.min.js';
  const buffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buffer}).promise;
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const viewport = page.getViewport({scale: 2});
    const tmpCanvas = document.createElement('canvas');
    const ctx = tmpCanvas.getContext('2d');
    tmpCanvas.width = viewport.width;
    tmpCanvas.height = viewport.height;
    await page.render({canvasContext: ctx, viewport}).promise;
    pages.push(tmpCanvas.toDataURL());
  }
  refreshThumbnails();
  renderFlipbook();
  e.target.value = '';
});

// Refresh thumbnails
function refreshThumbnails() {
  const bar = document.getElementById('thumbnailBar');
  bar.innerHTML = '';
  pages.forEach((p, i) => {
    const img = document.createElement('img');
    img.src = p;
    img.className = 'thumbnail';
    if (i === currentPage) img.classList.add('active');
    img.onclick = () => {
      currentPage = i;
      loadPageToCanvas();
      refreshThumbnails();
    };
    bar.appendChild(img);
  });
}

// Load page into canvas
function loadPageToCanvas() {
  fabricCanvas.clear();
  const img = new Image();
  img.onload = () => {
    const fabricImg = new fabric.Image(img);
    fabricImg.scaleToWidth(canvas.width);
    fabricCanvas.add(fabricImg);
    fabricCanvas.renderAll();
  };
  img.src = pages[currentPage];
}

// Add new blank page
document.getElementById('addPageBtn').onclick = () => {
  pages.push(canvas.toDataURL());
  currentPage = pages.length - 1;
  loadPageToCanvas();
  refreshThumbnails();
};

// Delete current page
document.getElementById('deletePageBtn').onclick = () => {
  if (pages.length <= 1) return alert('Δεν μπορείτε να διαγράψετε όλες τις σελίδες.');
  pages.splice(currentPage, 1);
  currentPage = 0;
  loadPageToCanvas();
  refreshThumbnails();
};

// Add text
document.getElementById('addTextBtn').onclick = () => {
  const text = new fabric.IText('Κείμενο', {
    left: 100,
    top: 100,
    fontSize: 40,
    fill: 'black'
  });
  fabricCanvas.add(text);
};

// Undo/Redo
let undoStack = [];
let redoStack = [];

fabricCanvas.on('object:added', saveState);
fabricCanvas.on('object:removed', saveState);
fabricCanvas.on('object:modified', saveState);

function saveState() {
  undoStack.push(JSON.stringify(fabricCanvas));
  redoStack = [];
}

document.getElementById('undoBtn').onclick = () => {
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(fabricCanvas));
  const prev = undoStack.pop();
  fabricCanvas.loadFromJSON(prev, () => fabricCanvas.renderAll());
};

document.getElementById('redoBtn').onclick = () => {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(fabricCanvas));
  const next = redoStack.pop();
  fabricCanvas.loadFromJSON(next, () => fabricCanvas.renderAll());
};

// Render Flipbook
function renderFlipbook() {
  const viewer = document.getElementById('viewerContainer');
  viewer.innerHTML = '';
  const book = document.createElement('div');
  book.id = 'flipbook';
  book.style.width = '100%';
  book.style.height = '100%';
  viewer.appendChild(book);

  pages.forEach(p => {
    const page = document.createElement('div');
    page.className = 'page';
    const img = document.createElement('img');
    img.src = p;
    img.style.width = '100%';
    img.style.height = '100%';
    page.appendChild(img);
    book.appendChild(page);
  });

  const flipBook = new St.PageFlip(book, {
    width: 500,
    height: 700,
    maxShadowOpacity: 0,
    showCover: false
  });
}

// Export PDF
document.getElementById('exportPdfBtn').onclick = async () => {
  const pdf = new jspdf.jsPDF('p', 'px', [800, 1100]);
  for (let i = 0; i < pages.length; i++) {
    if (i > 0) pdf.addPage();
    const img = pages[i];
    pdf.addImage(img, 'PNG', 0, 0, 800, 1100);
  }
  pdf.save('photobook.pdf');
};

// Export ZIP
document.getElementById('exportZipBtn').onclick = async () => {
  const zip = new JSZip();
  pages.forEach((p, i) => {
    zip.file(`page-${i + 1}.png`, p.split(',')[1], { base64: true });
  });
  const blob = await zip.generateAsync({ type: 'blob' });
  const link = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = link;
  a.download = 'photobook.zip';
  document.body.appendChild(a);
  a.click();
  a.remove();
};

// Save to Cloud
document.getElementById('uploadCloudBtn').onclick = async () => {
  if (!pages.length) return alert('Δεν υπάρχουν σελίδες');
  const title = prompt('Τίτλος βιβλίου:');
  const pwd = prompt('Password (προαιρετικό):');
  try {
    const id = await uploadPhotobook(pages, title, pwd);
    alert('Το βιβλίο ανέβηκε! ID: ' + id);
  } catch (err) {
    alert('Σφάλμα κατά την αποστολή.');
  }
};

// Share Link
document.getElementById('shareBtn').onclick = async () => {
  const bookID = prompt('ID βιβλίου που ανέβηκε:');
  if (!bookID) return;
  const link = `${location.origin}/viewer.html?id=${bookID}`;
  await navigator.clipboard.writeText(link);
  alert('Το link αντιγράφηκε: ' + link);
};

// Initial setup
pages.push(canvas.toDataURL());
refreshThumbnails();
renderFlipbook();

</script>

<!-- JS LIBRARIES -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.2.4/fabric.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>

<!-- PageFlip -->
<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

</body>
</html>
