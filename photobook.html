<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Photobook Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="css/photobook.css">

  <!-- Fabric.js -->
  <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

 <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.min.js"></script>
<script>
  const pdfjsLib = window["pdfjs-dist/build/pdf"];
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.worker.min.js";
</script>



</head>
<body>

  <!-- HEADER -->
  <header id="topbar">
  <div class="logo">
    <a href="index.html" style="text-decoration:none; color:inherit;">
      📘 Photobook Studio
    </a>
  </div>

  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="photobook.html" class="active">Photobook</a>
    <a href="duplicates.html">Find My Duplication</a>
    <a href="projects.html">My Photobooks</a>
  </nav>

  <div class="top-controls">
    <span id="user-label">Επισκέπτης</span>
    <button id="login-btn">Σύνδεση</button>
    <button id="logout-btn" style="display:none;">Αποσύνδεση</button>
    <button id="themeToggleBtn">☾</button>
  </div>
<div class="header-auth">
  <div id="userInfo"></div>

  <button id="openLoginBtn" class="btn btn-outline">
    Σύνδεση
  </button>

  <button id="logoutBtn" class="btn btn-outline" style="display:none;">
    Αποσύνδεση
  </button>
</div>
<button id="openRegisterBtn" class="btn btn-link">Εγγραφή</button>
    
</header>


  <!-- MAIN WRAPPER -->
  <div id="workspace">

    <!-- LEFT PANEL -->
    <aside id="sidebar">
      <h3>Εργαλεία</h3>

      <!-- Tabs -->
      <div class="tab-btns">
        <button data-tab="photos">Φωτογραφίες</button>
        <button data-tab="text">Κείμενο</button>
        <button data-tab="filters">Φίλτρα</button>
        <button data-tab="stickers">Stickers</button>
        <button data-tab="templates">Templates</button>
        <button data-tab="export">Εξαγωγή</button>
      </div>

      <!-- Tab Content -->
      <div id="tab-content">

        <!-- PHOTOS -->
        <div class="tab" id="tab-photos">
          <button id="uploadImageBtn">+ Εικόνες</button>
          <input type="file" id="imageInput" accept="image/*" multiple style="display:none;">
          <button id="uploadPdfBtn">+ PDF</button>
          <input type="file" id="pdfInput" accept="application/pdf" style="display:none;">
          <button id="clearMediaBtn">Καθαρισμός βιβλιοθήκης</button>

          <h4>Βιβλιοθήκη</h4>
          <div id="media-library"></div>
        </div>

        <!-- TEXT -->
        <div class="tab" id="tab-text">
          <label>Γραμματοσειρά:</label>
          <select id="textFont">
            <option>Arial</option>
            <option>Poppins</option>
            <option>Playfair Display</option>
            <option>Pacifico</option>
          </select>

          <label>Μέγεθος:</label>
          <input type="number" id="textSize" value="40">

          <label>Χρώμα:</label>
          <input type="color" id="textColor" value="#000000">

          <button id="addTextBtn">Προσθήκη Κειμένου</button>
          <button id="addCurvedTextBtn">Καμπύλο Κείμενο</button>

          <button id="textBoldBtn">Bold</button>
          <button id="textItalicBtn">Italic</button>
          <button id="textUnderlineBtn">Underline</button>

          <button id="gradientTextBtn">Gradient</button>
          <button id="highlightTextBtn">Highlight</button>
          <button id="shadowTextBtn">Σκιά</button>
          <button id="clearShadowTextBtn">Αφαίρεση Σκιάς</button>

          <button id="deleteTextBtn">Διαγραφή</button>
        </div>

        <!-- FILTERS -->
        <div class="tab" id="tab-filters">
          <label>Φωτεινότητα</label>
          <input type="range" id="imgBrightness" min="-1" max="1" step="0.01" value="0">

          <label>Αντίθεση</label>
          <input type="range" id="imgContrast" min="-1" max="1" step="0.01" value="0">

          <label>Κορεσμός</label>
          <input type="range" id="imgSaturation" min="-1" max="1" step="0.01" value="0">

          <label>Blur</label>
          <input type="range" id="imgBlur" min="0" max="1" step="0.01" value="0">

          <button id="imgSepiaBtn">Sepia</button>
          <button id="imgBwBtn">B&W</button>
          <button id="imgSharpenBtn">Sharpen</button>
          <button id="imgAutoEnhanceBtn">Auto Enhance</button>
          <button id="imgResetBtn">Reset</button>
        </div>

        <!-- STICKERS -->
        <div class="tab" id="tab-stickers">
          <select id="sticker-category">
            <option value="emoji">Emoji</option>
            <option value="shapes">Shapes</option>
            <option value="doodles">Doodles</option>
            <option value="frames">Frames</option>
          </select>

          <div id="stickers-box"></div>

          <button id="stickerOutlineBtn">Outline</button>
          <button id="stickerShadowBtn">Shadow</button>
          <button id="stickerColorizeBtn">Colorize</button>
        </div>

        <!-- TEMPLATES -->
        <div class="tab" id="tab-templates">
          <button id="tplMinimalBtn">Minimal</button>
          <button id="tplMagazineBtn">Magazine</button>
          <button id="tplScrapbookBtn">Scrapbook</button>
          <button id="tplGrid2Btn">Grid-2</button>
          <button id="tplGrid4Btn">Grid-4</button>
          <button id="tplFullBleedBtn">Full Bleed</button>
        </div>

        <!-- EXPORT -->
        <div class="tab" id="tab-export">
          <button id="exportPdfBtn">📄 PDF</button>
          <button id="exportFlipbookBtn">📘 Flipbook</button>
          <button id="exportCloudBtn">☁ Cloud</button>
        </div>

      </div>
    </aside>

    <!-- CANVAS AREA -->
    <main id="canvas-area">
      <div id="canvas-wrapper">
        <canvas id="canvas"></canvas>
      </div>

      <div id="page-controls">
        <button id="prevPageBtn">‹</button>
        <span id="pageInfo">1 / 1</span>
        <button id="nextPageBtn">›</button>
      </div>
    </main>

    <!-- RIGHT THUMBNAILS -->
    <aside id="thumbs">
      <button id="addPageBtn">+ Σελίδα</button>
      <button id="deletePageBtn">✕</button>

      <h4>Σελίδες</h4>
      <div id="thumbnails"></div>
    </aside>

  </div>

  <!-- JS Modules -->
  <script type="module" src="firebase-init.js"></script>
  <script type="module" src="js/core.js"></script>
  <script type="module" src="js/tools.js"></script>
  <script type="module" src="js/export.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="viewer.js"></script>


</body>
</html>
