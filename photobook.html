<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Photobook Editor</title>

  <style>
    :root{
      --bg:#0f1115; --panel:#151924; --panel2:#10131b; --border:#232a3a;
      --text:#e9eefc; --muted:#a9b3cf; --btn:#1f2636; --btn2:#2a3550;
      --accent:#7aa2ff;
    }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Arial;}
    *{box-sizing:border-box}

    .app{height:100%;display:grid;grid-template-columns:72px 320px 1fr 340px;grid-template-rows:56px 1fr}
    header{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--panel2)}
    header .title{font-weight:700}
    header .sp{flex:1}
    header .pill{padding:6px 10px;border:1px solid var(--border);border-radius:999px;color:var(--muted)}

    .rail{grid-row:2;grid-column:1;background:var(--panel2);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
    .rail button{width:48px;height:48px;border-radius:12px;border:1px solid var(--border);background:var(--btn);color:var(--text);cursor:pointer}
    .rail button:hover{background:var(--btn2)}
    .rail .hint{font-size:11px;color:var(--muted);text-align:center}

    .left{grid-row:2;grid-column:2;background:var(--panel);border-right:1px solid var(--border);padding:12px;overflow:auto}
    .left h3{margin:6px 0 10px 0;font-size:14px;color:var(--muted);font-weight:700}
    .group{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
    .btn{padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--btn);color:var(--text);cursor:pointer;text-align:left}
    .btn:hover{background:var(--btn2)}
    .row{display:flex;gap:8px;align-items:center}
    .row .btn{flex:1}
    .small{font-size:12px;color:var(--muted)}

    .stage{grid-row:2;grid-column:3;display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden}
    .canvasHost{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#1a1f2d;border:1px solid var(--border);border-radius:16px}
    #canvasWrap{padding:18px;border-radius:14px;background:#0b0e14;border:1px solid var(--border)}
    canvas{background:#fff;border-radius:6px;box-shadow:0 14px 40px rgba(0,0,0,.35);}

    .right{grid-row:2;grid-column:4;background:var(--panel);border-left:1px solid var(--border);padding:12px;overflow:auto}
    .right .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .toggle{padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--btn);color:var(--text);cursor:pointer}
    .toggle:hover{background:var(--btn2)}
    .panel{display:none}
    .panel.open{display:block}
    .kv{display:flex;align-items:center;justify-content:space-between;padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--btn);margin-bottom:10px}
    .kv strong{font-size:12px;color:var(--muted)}
    .zoomBox{display:flex;gap:8px;align-items:center}
    .zoomBox button{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--btn2);color:var(--text);cursor:pointer}
    .zoomBox button:hover{filter:brightness(1.08)}
    #zoomValue{min-width:64px;text-align:center;font-weight:700}

    .warn{margin-top:10px;font-size:12px;color:#ffcf7a}
  </style>

  <!-- ✅ PATCH πριν φορτώσει το Fabric: μετατρέπει ctx.textBaseline "alphabetical" -> "alphabetic" -->
  <script>
    (function(){
      const proto = CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
      if (!proto) return;

      const desc = Object.getOwnPropertyDescriptor(proto, "textBaseline");
      if (!desc || !desc.set) return;

      Object.defineProperty(proto, "textBaseline", {
        get: desc.get,
        set: function(v){
          if (v === "alphabetical") v = "alphabetic";
          return desc.set.call(this, v);
        }
      });
    })();
  </script>

  <!-- Fabric -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
  <!-- App core -->
  <script src="./js/core.js" defer></script>
</head>

<body>
  <div class="app">
    <header>
      <div class="title">Photobook Editor</div>
      <div class="pill" id="statusPill">Ready</div>
      <div class="sp"></div>
      <div class="pill">Space = Pan · Ctrl+Wheel = Zoom</div>
    </header>

    <div class="rail">
      <button id="railText" title="Text">T</button>
      <button id="railImage" title="Image">🖼</button>
      <button id="railEmoji" title="Emoji">😀</button>
      <div class="hint">Tools</div>
    </div>

    <aside class="left">
      <h3>Tools</h3>

      <div class="group">
        <button class="btn" id="addTextBtn">➕ Add Text</button>
        <div class="row">
          <button class="btn" id="addEmojiBtn">😀 Emoji</button>
          <button class="btn" id="addImageBtn">🖼 Image</button>
        </div>
        <div class="small">Αν δεν μπαίνει κάτι, δες το “Status” πάνω.</div>
      </div>

      <h3>Pages</h3>
      <div class="group">
        <div class="row">
          <button class="btn" id="prevPageBtn">⟵ Prev</button>
          <button class="btn" id="nextPageBtn">Next ⟶</button>
        </div>
        <div class="kv">
          <strong>Page</strong>
          <div id="pageInfo">1 / 1</div>
        </div>
      </div>

      <input type="file" id="imageInput" accept="image/*" hidden />
    </aside>

    <main class="stage">
      <div class="canvasHost" id="canvasHost">
        <div id="canvasWrap">
          <canvas id="canvas" width="1240" height="1754"></canvas>
        </div>
      </div>
    </main>

    <aside class="right">
      <div class="head">
        <h3 style="margin:0;color:var(--muted);font-size:14px">View</h3>
        <button class="toggle" id="toggleRight">Open/Close</button>
      </div>

      <div class="panel open" id="rightPanel">
        <div class="kv">
          <strong>Zoom</strong>
          <div class="zoomBox">
            <button id="zoomOutBtn">−</button>
            <div id="zoomValue">100%</div>
            <button id="zoomInBtn">+</button>
            <button id="zoomResetBtn" title="Reset">⟲</button>
          </div>
        </div>

        <div class="kv">
          <strong>Fit</strong>
          <button class="toggle" id="fitBtn">Fit to Screen</button>
        </div>

        <div class="warn" id="warnBox" style="display:none">
          ⚠ Fabric warning filtered/handled.
        </div>
      </div>
    </aside>
  </div>
</body>
</html>
