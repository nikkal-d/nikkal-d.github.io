        onload="gapiLoaded()" async defer></script>

<style>
body {
  font-family: "Poppins", Arial, sans-serif;
  margin: 0;
  padding: 0;
  background: #fff;
  color: #222;
}
header {
  background: #ff9800;
  color: #fff;
  text-align: center;
  font-size: 1.8em;
  padding: 20px;
  font-weight: bold;
}
main {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  padding: 20px;
}
section {
  flex: 1;
  min-width: 45%;
  background: #f9f9f9;
  margin: 10px;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}
textarea {
  width: 100%;
  height: 150px;
  border-radius: 8px;
  border: 1px solid #ccc;
  padding: 10px;
  font-size: 1em;
  resize: vertical;
}
button, select {
  background: #ff9800;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 10px 16px;
  margin: 10px 5px;
  font-size: 1em;
  cursor: pointer;
}
button:hover { background: #e68900; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.95em;
  margin-top: 10px;
}
th, td {
  border: 1px solid #ccc;
  padding: 8px;
}
.dup {
  text-decoration: underline;
  text-decoration-color: red;
  text-decoration-thickness: 2px;
}
footer {
  text-align: center;
  background: #111;
  color: #fff;
  padding: 12px;
  margin-top: 40px;
  font-size: 0.9em;
}

/* ---- Dark Mode Ενεργό ---- */
body.dark {
  background: #121212;
  color: #eee;
}
body.dark header {
  background: #333;
  color: #ff9800;
}
body.dark section {
  background: #1e1e1e;
  box-shadow: 0 2px 6px rgba(255,255,255,0.05);
}
body.dark table, body.dark th, body.dark td {
  border-color: #444;
  background: #1e1e1e;
}
body.dark button, body.dark select {
  background: #ff9800;
  color: #fff;
}
body.dark footer {
  background: #000;
}

  #driveButtons button {
  transition: background 0.25s ease;
}
#driveButtons button:hover {
  background: #e68900;
}



/* ------------------- Αισθητικές βελτιώσεις ------------------- */
body {
  transition: background 0.3s ease, color 0.3s ease;
}

header {
  letter-spacing: 1px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.15);
}

button, select {
  transition: background 0.25s ease, transform 0.1s ease;
}

button:hover, select:hover {
  transform: scale(1.03);
}

textarea {
  transition: box-shadow 0.2s ease;
}
textarea:focus {
  outline: none;
  box-shadow: 0 0 5px 2px rgba(255,152,0,0.4);
}

section {
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
section:hover {
  transform: translateY(-3px);
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

/* Fade-in effect όταν φορτώνουν τα αποτελέσματα */
.fade-in {
  opacity: 0;
  animation: fadeIn 0.8s forwards;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Καλύτερο spacing στα dropdowns */
#downloadMenu button:hover {
  background: rgba(255,152,0,0.1);
  border-radius: 6px;
}

</style>
  <script async defer src="https://apis.google.com/js/api.js"></script>
<script async defer src="https://accounts.google.com/gsi/client"></script>

</head>

<body>

  setStatus("✅ Έτοιμο για σύνδεση με Google!");

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PZ2ZH59T"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<header>FindMyDuplicates</header>

  <div style="text-align:right;margin:10px 20px;">
  <button id="themeToggle" onclick="toggleTheme()">🌙 / ☀️</button>
  <select id="langSelect" onchange="switchLanguage(this.value)">
    <option value="el">🇬🇷 EL</option>
    <option value="en">🇬🇧 EN</option>
  </select>
</div>



<div style="text-align:center;margin:15px;">
  <textarea id="inputList" placeholder="Επικόλλησε δεδομένα από Excel ή CSV..."></textarea><br>
  <label for="columnSelect">Έλεγχος διπλοτύπων στη στήλη:</label>
  <select id="columnSelect"><option value="">-- επιλέξτε --</option></select>
  <button onclick="processData()">Ανάλυση</button>
</div>

  <div id="driveButtons" style="text-align:center;margin:10px;">
  <button id="loginBtn" onclick="handleAuthClick()">🔐 Σύνδεση με Google</button>
  <button id="saveDriveBtn" onclick="saveToDrive()" disabled>☁️ Αποθήκευση στο Drive</button>
  <button id="loadDriveBtn" onclick="loadFromDrive()" disabled>📂 Φόρτωση από Drive</button>
</div>

  <div id="statusMsg" style="
  text-align:center;
  margin-top:10px;
  font-weight:bold;
  color:#ff9800;
"></div>


  <!-- κουμπί Κατέβασε με dropdown -->
<div class="dropdown" style="text-align:center;">
  <button id="downloadBtn" onclick="toggleDownloadMenu()">⬇️ Κατέβασε</button>
  <div id="downloadMenu" style="
    display:none;
    position:absolute;
    background:#fff;
    border:1px solid #ccc;
    border-radius:8px;
    margin-top:5px;
    padding:5px;
    text-align:left;
    box-shadow:0 2px 6px rgba(0,0,0,0.2);
  ">
    <button onclick="downloadList('unique')" style="display:block;width:100%;border:none;background:none;padding:6px;cursor:pointer;">Χωρίς διπλότυπα</button>
    <button onclick="downloadList('duplicates')" style="display:block;width:100%;border:none;background:none;padding:6px;cursor:pointer;">Μόνο τα διπλότυπα</button>
  </div>
</div>


<main>
  <section>
    <h3>Δεδομένα</h3>
    <table id="dataTable"><thead></thead><tbody></tbody></table>
  </section>
  <section>
    <h3>Αναφορές διπλοτύπων</h3>
    <div id="duplicatesList" style="white-space:pre-line;"></div>
  </section>
</main>

<footer>© 2025 FindMyDuplicates | Built by Niki Kalantzi</footer>

<script>
let tableData = [];

function processData() {
  const text = document.getElementById("inputList").value.trim();
  if (!text) return alert("Επικόλλησε πρώτα δεδομένα!");

  // Ανίχνευση tabs ή κόμματα (Excel, CSV)
  const rows = text.split(/\r?\n/).map(r => r.split(/\t|,/));
  tableData = rows.filter(r => r.some(cell => cell.trim() !== ""));
  renderTable(tableData);

  // Γέμισμα dropdown για επιλογή στήλης
  const colSelect = document.getElementById("columnSelect");
  colSelect.innerHTML = '<option value="">-- επιλέξτε --</option>';
  if (tableData[0]) {
    tableData[0].forEach((_, i) => {
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = "Στήλη " + (i + 1);
      colSelect.appendChild(opt);
    });
    document.querySelectorAll("section").forEach(s => s.classList.add("fade-in"));

  }

  document.getElementById("duplicatesList").textContent = "";
}

function renderTable(data) {
  const table = document.getElementById("dataTable");
  const head = table.querySelector("thead");
  const body = table.querySelector("tbody");
  head.innerHTML = "";
  body.innerHTML = "";
  if (!data.length) return;

  // Επικεφαλίδες
  const header = document.createElement("tr");
  data[0].forEach((_, i) => {
    const th = document.createElement("th");
    th.textContent = "Στήλη " + (i + 1);
    header.appendChild(th);
  });
  head.appendChild(header);

  // Σώμα
  data.forEach((row) => {
    const tr = document.createElement("tr");
    row.forEach((cell) => {
      const td = document.createElement("td");
      td.textContent = cell;
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
}

// Ανίχνευση διπλοτύπων στη στήλη που επέλεξε ο χρήστης
document.getElementById("columnSelect").addEventListener("change", () => {
  const col = document.getElementById("columnSelect").value;
  if (col === "") return;
  const seen = {};
  const dups = [];
  const bodyRows = document.querySelectorAll("#dataTable tbody tr");
  bodyRows.forEach((tr, rowIndex) => {
    const cell = tr.children[col];
    if (!cell) return;
    const val = cell.textContent.trim();
    if (val) {
      if (seen[val]) {
        dups.push([seen[val], rowIndex]);
        cell.classList.add("dup");
        bodyRows[seen[val]].children[col].classList.add("dup");
      } else {
        seen[val] = rowIndex;
      }
    }
  });

  // Αναφορές δεξιά
  const dupDiv = document.getElementById("duplicatesList");
  dupDiv.textContent = "";
  if (dups.length === 0) dupDiv.textContent = "✅ Δεν βρέθηκαν διπλότυπα.";
  else {
    dupDiv.textContent = dups
      .map(d => `🔴 Η σειρά ${d[0] + 1} με τη σειρά ${d[1] + 1} είναι ίδιες.`)
      .join("\n");
  }
});
  // ----- Διγλωσσία EN/EL -----
const translations = {
  el: {
    header: "FindMyDuplicates",
    textareaPlaceholder: "Επικόλλησε δεδομένα από Excel ή CSV...",
    columnLabel: "Έλεγχος διπλοτύπων στη στήλη:",
    analyzeBtn: "Ανάλυση",
    downloadBtn: "Κατέβασε",
    noDuplicates: "✅ Δεν βρέθηκαν διπλότυπα.",
    footer: "© 2025 FindMyDuplicates | Built by Niki Kalantzi"
  },
  en: {
    header: "FindMyDuplicates",
    textareaPlaceholder: "Paste data from Excel or CSV...",
    columnLabel: "Check duplicates in column:",
    analyzeBtn: "Analyze",
    downloadBtn: "Download",
    noDuplicates: "✅ No duplicates found.",
    footer: "© 2025 FindMyDuplicates | Built by Niki Kalantzi"
  }
};

function switchLanguage(lang) {
  const t = translations[lang];
  if(!t) return;

  document.querySelector("header").textContent = t.header;
  document.getElementById("inputList").placeholder = t.textareaPlaceholder;
  document.querySelector("label[for='columnSelect']").textContent = t.columnLabel;
  document.querySelector("button[onclick='processData()']").textContent = t.analyzeBtn;
  document.getElementById("downloadBtn").textContent = "⬇️ " + t.downloadBtn;
  document.querySelector("footer").textContent = t.footer;

  localStorage.setItem("lang", lang);
}

// Εφαρμογή αποθηκευμένης γλώσσας στην εκκίνηση
window.addEventListener("DOMContentLoaded", ()=>{
  const savedLang = localStorage.getItem("lang") || "el";
  document.getElementById("langSelect").value = savedLang;
  switchLanguage(savedLang);
});
// ----- Διόρθωση Dark / Light mode -----
function toggleTheme() {
  const body = document.body;
  const current = body.classList.contains("dark") ? "dark" : "light";
  const next = current === "dark" ? "light" : "dark";

  body.classList.remove(current);
  body.classList.add(next);

  // Αποθήκευση στο localStorage
  localStorage.setItem("theme", next);

  // Αλλαγή εικονιδίου στο κουμπί
  const toggleBtn = document.getElementById("themeToggle");
  if (toggleBtn) toggleBtn.textContent = next === "dark" ? "☀️" : "🌙";
}

// Εφαρμογή αποθηκευμένου θέματος κατά την εκκίνηση
window.addEventListener("DOMContentLoaded", () => {
  const savedTheme = localStorage.getItem("theme") || "light";
  document.body.classList.add(savedTheme);
  const toggleBtn = document.getElementById("themeToggle");
  if (toggleBtn) toggleBtn.textContent = savedTheme === "dark" ? "☀️" : "🌙";
});
// ---------- GOOGLE DRIVE SYNC ----------
const CLIENT_ID = "7674481557-tr33gquj964b83jorc7lr8vahjrde34o.apps.googleusercontent.com";
const SCOPES = 'https://www.googleapis.com/auth/drive.file';

let tokenClient;
let gapiInited = false;
let gisInited = false;

  function gapiLoaded() {
  gapi.load('client', initializeGapiClient);
}

async function initializeGapiClient() {
  await gapi.client.init({
    apiKey: "", // optional, δεν χρειάζεται για απλή χρήση
    discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
  });
  gapiInited = true;
}

function gisLoaded() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: '',
  });
  gisInited = true;
}

  function setStatus(msg, color="#ff9800"){
  const div=document.getElementById("statusMsg");
  div.style.color=color;
  div.textContent=msg;
}

// ----- Σύνδεση -----
function handleAuthClick() {
  if (!gapiInited) { setStatus("⏳ Το API φορτώνει... δοκίμασε ξανά.", "red"); return; }
  tokenClient.callback = (resp) => {
    if (resp.error !== undefined) throw (resp);
    document.getElementById('saveDriveBtn').disabled = false;
    document.getElementById('loadDriveBtn').disabled = false;
    setStatus("✅ Συνδέθηκες επιτυχώς με Google!", "green");
  };
  setStatus("🔐 Άνοιγμα παραθύρου σύνδεσης...");
  tokenClient.requestAccessToken({ prompt: 'consent' });
}

// ----- Αποθήκευση -----
async function saveToDrive() {
  const text = document.getElementById("inputList").value.trim();
  if (!text){ setStatus("⚠️ Δεν υπάρχουν δεδομένα!", "red"); return; }

  setStatus("⏳ Αποθήκευση στο Google Drive...");

  const file = new Blob([text], { type: "text/plain" });
  const metadata = { name: "FindMyDuplicates_List.txt", mimeType: "text/plain" };
  const form = new FormData();
  form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
  form.append("file", file);

  const token = gapi.client.getToken();
  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
    method: "POST",
    headers: new Headers({ "Authorization": "Bearer " + token.access_token }),
    body: form,
  });

  if (res.ok) setStatus("☁️ Η λίστα αποθηκεύτηκε επιτυχώς στο Drive!", "green");
  else setStatus("❌ Σφάλμα κατά την αποθήκευση!", "red");
}

// ----- Φόρτωση -----
async function loadFromDrive() {
  setStatus("⏳ Αναζήτηση αρχείου στο Google Drive...");

  const token = gapi.client.getToken();
  const res = await gapi.client.drive.files.list({
    q: "name='FindMyDuplicates_List.txt'",
    fields: "files(id, name)",
  });

  if (!res.result.files.length) {
    setStatus("⚠️ Δεν βρέθηκε αρχείο στο Drive!", "red");
    return;
  }

  const fileId = res.result.files[0].id;
  const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
    headers: new Headers({ "Authorization": "Bearer " + token.access_token }),
  });

  const text = await fileRes.text();
  document.getElementById("inputList").value = text;
  setStatus("📂 Φορτώθηκε η λίστα από το Drive!", "green");
}
</script>
