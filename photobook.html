<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Photobook Editor</title>

  <style>
    :root{
      --bg:#0f1115; --panel:#151924; --panel2:#10131b; --border:#232a3a;
      --text:#e9eefc; --muted:#a9b3cf; --btn:#1f2636; --btn2:#2a3550;
      --accent:#7aa2ff; --danger:#ff6b6b; --ok:#3ddc97;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Arial;}
    button,input,select{font:inherit}

    .app{height:100%;display:grid;grid-template-columns:72px 320px 1fr 360px;grid-template-rows:56px 1fr}
    header{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--panel2)}
    header .title{font-weight:800}
    header .sp{flex:1}
    header .pill{padding:6px 10px;border:1px solid var(--border);border-radius:999px;color:var(--muted);display:flex;gap:8px;align-items:center}
    header .pill b{color:var(--text)}
    #statusDot{width:9px;height:9px;border-radius:999px;background:var(--ok);display:inline-block}

    .rail{grid-row:2;grid-column:1;background:var(--panel2);border-right:1px solid var(--border);
      display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
    .rail button{width:48px;height:48px;border-radius:12px;border:1px solid var(--border);background:var(--btn);color:var(--text);cursor:pointer}
    .rail button:hover{background:var(--btn2)}
    .rail button.active{outline:2px solid var(--accent)}
    .rail .hint{font-size:11px;color:var(--muted);text-align:center}

    .left{grid-row:2;grid-column:2;background:var(--panel);border-right:1px solid var(--border);overflow:auto}
    .leftHead{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--border);padding:12px;z-index:2}
    .leftHead h3{margin:0;font-size:14px;color:var(--muted);font-weight:800}
    .leftBody{padding:12px}
    .group{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
    .btn{padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--btn);color:var(--text);cursor:pointer;text-align:left}
    .btn:hover{background:var(--btn2)}
    .btn.small{padding:8px 10px;font-size:13px}
    .btn.danger{background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.35)}
    .btn.danger:hover{background:rgba(255,107,107,.18)}
    .row{display:flex;gap:8px;align-items:center}
    .row .btn{flex:1}
    .small{font-size:12px;color:var(--muted);line-height:1.3}
    .label{font-size:12px;color:var(--muted);font-weight:700}

    .stage{grid-row:2;grid-column:3;display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden}
    .canvasHost{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
      background:#1a1f2d;border:1px solid var(--border);border-radius:16px;position:relative;overflow:hidden}
    #canvasWrap{padding:18px;border-radius:14px;background:#0b0e14;border:1px solid var(--border)}
    canvas{background:#fff;border-radius:6px;box-shadow:0 14px 40px rgba(0,0,0,.35);}

    .thumbStrip{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:10px;overflow:auto;padding:10px;
      background:rgba(10,12,18,.6);border:1px solid var(--border);border-radius:14px;backdrop-filter: blur(6px);}
    .thumb{width:90px;flex:0 0 auto;border:1px solid var(--border);border-radius:12px;background:#0b0e14;cursor:pointer;overflow:hidden}
    .thumb.active{outline:2px solid var(--accent)}
    .thumb img{display:block;width:100%;height:60px;object-fit:cover;background:#fff}

    .right{grid-row:2;grid-column:4;background:var(--panel);border-left:1px solid var(--border);overflow:auto}
    .rightHead{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--border);padding:12px;z-index:2;
      display:flex;align-items:center;justify-content:space-between}
    .rightHead h3{margin:0;font-size:14px;color:var(--muted);font-weight:800}
    .toggle{padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--btn);color:var(--text);cursor:pointer}
    .toggle:hover{background:var(--btn2)}
    .panel{display:none;padding:12px}
    .panel.open{display:block}
    .kv{display:flex;align-items:center;justify-content:space-between;padding:10px;border:1px solid var(--border);
      border-radius:12px;background:var(--btn);margin-bottom:10px;gap:10px}
    .kv strong{font-size:12px;color:var(--muted)}
    .zoomBox{display:flex;gap:8px;align-items:center}
    .zoomBox button{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--btn2);color:var(--text);cursor:pointer}
    .zoomBox button:hover{filter:brightness(1.08)}
    #zoomValue{min-width:64px;text-align:center;font-weight:800}

    .layerList{display:flex;flex-direction:column;gap:8px}
    .layerItem{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px;border:1px solid var(--border);border-radius:12px;background:#0f1320;cursor:pointer}
    .layerItem.active{outline:2px solid var(--accent)}
    .layerItem .name{font-size:13px}
    .layerItem .type{font-size:11px;color:var(--muted)}
    .miniBtn{padding:7px 9px;border-radius:10px;border:1px solid var(--border);background:var(--btn);color:var(--text);cursor:pointer}
    .miniBtn:hover{background:var(--btn2)}
  </style>

  <!-- IMPORTANT: Fabric BEFORE modules -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

  <!-- Kill the "alphabetical" warning globally -->
  <script>
    (function(){
      if (!window.fabric) return;
      // Force valid baseline everywhere
      const fix = (proto) => {
        if (!proto) return;
        try {
          Object.defineProperty(proto, "textBaseline", {
            get(){ return "alphabetic"; },
            set(){ /* ignore */ }
          });
        } catch {}
      };
      fix(fabric.Textbox && fabric.Textbox.prototype);
      fix(fabric.IText && fabric.IText.prototype);
      fix(fabric.Text && fabric.Text.prototype);
    })();
  </script>
</head>

<body>
  <div class="app">
    <header>
      <div class="title">Photobook Editor</div>
      <div class="pill"><span id="statusDot"></span><b id="statusText">Ready</b></div>
      <div class="sp"></div>

      <!-- Auth placeholders (να μην σπάνε ids) -->
      <div class="pill">
        <span id="userInfo"></span>
        <button class="toggle" id="loginBtn">Σύνδεση</button>
        <button class="toggle" id="logoutBtn" style="display:none">Έξοδος</button>
      </div>
    </header>

    <!-- Rail -->
    <div class="rail sidebar">
      <button class="active" data-panel="tools" title="Tools">🧰</button>
      <button data-panel="pages" title="Pages">📄</button>
      <button data-panel="templates" title="Templates">✨</button>
      <button data-panel="stickers" title="Stickers">😀</button>
      <div class="hint">Panels</div>
    </div>

    <!-- LEFT -->
    <aside class="left">
      <div class="leftHead">
        <h3>Εργαλεία</h3>
        <div class="small">Space: Pan · Ctrl+Wheel: Zoom</div>
      </div>

      <div class="leftBody">
        <!-- TOOLS -->
        <div class="panel-container open" id="panel-tools">
          <div class="group">
            <button class="btn" id="addTextBtn">➕ Text</button>
            <div class="row">
              <button class="btn" id="addEmojiBtn">😀 Emoji</button>
              <button class="btn" id="addImageBtn">🖼 Image</button>
            </div>
          </div>

          <div class="group">
            <div class="label">Canvas size</div>
            <div class="row">
              <select class="btn small" id="sizePreset">
                <option value="A4P">A4 Portrait</option>
                <option value="A4L">A4 Landscape</option>
                <option value="SQUARE">Square</option>
                <option value="STORY">Story</option>
                <option value="HD">HD</option>
              </select>
              <button class="btn small" id="applyPreset">Apply</button>
            </div>
            <div class="row">
              <input class="btn small" id="customW" type="number" min="200" max="4000" placeholder="W (px)">
              <input class="btn small" id="customH" type="number" min="200" max="4000" placeholder="H (px)">
              <button class="btn small" id="applyCustom">Set</button>
            </div>
          </div>

          <div class="group">
            <div class="label">Undo / Redo</div>
            <div class="row">
              <button class="btn small" id="undoBtn">↩ Undo</button>
              <button class="btn small" id="redoBtn">↪ Redo</button>
            </div>
          </div>

          <div class="group">
            <div class="label">Draft (JSON only)</div>
            <div class="row">
              <button class="btn small" id="saveDraftBtn">Save</button>
              <button class="btn small" id="loadDraftBtn">Load</button>
            </div>
            <button class="btn danger" id="clearDraftBtn">Clear</button>
          </div>
        </div>

        <!-- PAGES -->
        <div class="panel-container" id="panel-pages">
          <div class="group">
            <div class="row">
              <button class="btn" id="prevPageBtn">⟵ Prev</button>
              <button class="btn" id="nextPageBtn">Next ⟶</button>
            </div>
            <div class="row">
              <button class="btn small" id="dupPageBtn">Duplicate</button>
              <button class="btn small danger" id="delPageBtn">Delete</button>
            </div>
            <div class="small" id="pageInfo">1 / 1</div>
          </div>
        </div>

        <!-- TEMPLATES -->
        <div class="panel-container" id="panel-templates">
          <div class="group">
            <div class="small">Templates demo (σταθερά, χωρίς assets).</div>
            <button class="btn" id="tpl1">Template 1</button>
            <button class="btn" id="tpl2">Template 2</button>
          </div>
        </div>

        <!-- STICKERS -->
        <div class="panel-container" id="panel-stickers">
          <div class="group">
            <div class="small">Emoji stickers demo.</div>
            <div class="row">
              <button class="btn" data-emoji="😀">😀</button>
              <button class="btn" data-emoji="😍">😍</button>
            </div>
            <div class="row">
              <button class="btn" data-emoji="🔥">🔥</button>
              <button class="btn" data-emoji="⭐">⭐</button>
            </div>
          </div>
        </div>

        <input type="file" id="imageInput" accept="image/*" hidden />
      </div>
    </aside>

    <!-- CENTER -->
    <main class="stage">
      <div class="canvasHost" id="canvasHost">
        <div id="canvasWrap">
          <canvas id="canvas" width="1240" height="1754"></canvas>
        </div>
        <div class="thumbStrip" id="thumbStrip"></div>
      </div>
    </main>

    <!-- RIGHT -->
    <aside class="right">
      <div class="rightHead">
        <h3>Zoom / Layers</h3>
        <button class="toggle" id="toggleRight">Open/Close</button>
      </div>

      <div class="panel open" id="exportPanel">
        <div class="kv">
          <strong>Zoom</strong>
          <div class="zoomBox">
            <button id="zoomOutBtn">−</button>
            <div id="zoomValue">100%</div>
            <button id="zoomInBtn">+</button>
            <button id="zoomResetBtn" title="Reset">⟲</button>
          </div>
        </div>

        <div class="kv">
          <strong>Fit</strong>
          <button class="toggle" id="fitBtn">Fit</button>
        </div>

        <div class="group">
          <div class="label">Layers</div>
          <div class="row">
            <button class="miniBtn" id="bringFwd">Bring +</button>
            <button class="miniBtn" id="sendBack">Send −</button>
            <button class="miniBtn" id="delObj">Delete</button>
          </div>
          <div class="layerList" id="layerList"></div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Modules -->
  <script type="module" src="./js/core.js"></script>
  <script type="module" src="./js/ui.js"></script>
</body>
</html>
